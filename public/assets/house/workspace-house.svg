      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#080b13"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef3f82"/>
      <stop offset="1" stop-color="#8d214d"/>

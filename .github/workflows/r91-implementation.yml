name: R91 implementation

on:
  push:
    branches:
      - r91-launch-experience-optimization

permissions:
  contents: write

jobs:
  implement:
    if: ${{ !contains(github.event.head_commit.message, '[r91-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r91-launch-experience-optimization
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - run: npm ci

      - name: Apply R91 product and discovery changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).parent.mkdir(parents=True, exist_ok=True)
              Path(path).write_text(text)

          def replace_once(path, old, new):
              text = read(path)
              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}: {old[:100]!r}")
              write(path, text.replace(old, new, 1))

          # Root: broader positioning, private-route indexing hygiene and a lighter critical path.
          path = "app/root.tsx"
          text = read(path)
          text = text.replace(
              'const socialImage = `${productionOrigin}/assets/optimized/arrival.webp`;',
              'const socialImage = `${productionOrigin}/assets/optimized/arrival-1440.webp`;',
          )
          text = text.replace(
              '  "A private Web3 professional network where Founders, Creators and Investors build trusted relationships and measurable traction.";',
              '  "A private professional network where Founders, Creators and Investors discover trusted people, opportunities and collaborations.";',
          )
          text = text.replace(
              '      title: "AKARI House | Trusted Web3 Collaboration",',
              '      title: "AKARI House | Founder, Creator & Investor Network",',
          )
          text = text.replace(
              '  "/connections",\n  "/notifications",',
              '  "/connections",\n  "/members",\n  "/notifications",',
          )
          font_and_hero = '''  { rel: "preconnect", href: "https://fonts.googleapis.com" },
          {
            rel: "preconnect",
            href: "https://fonts.gstatic.com",
            crossOrigin: "anonymous",
          },
          {
            rel: "stylesheet",
            href: "https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap",
          },
          {
            rel: "preload",
            href: "/assets/optimized/arrival.webp",
            as: "image",
            type: "image/webp",
          },'''
          hero_preloads = '''  {
            rel: "preload",
            href: "/assets/optimized/arrival-960.webp",
            as: "image",
            type: "image/webp",
            media: "(max-width: 768px)",
          },
          {
            rel: "preload",
            href: "/assets/optimized/arrival-1440.webp",
            as: "image",
            type: "image/webp",
            media: "(min-width: 769px)",
          },'''
          if font_and_hero not in text:
              raise SystemExit("Root font/hero link block changed unexpectedly")
          text = text.replace(font_and_hero, hero_preloads, 1)
          text = text.replace(
              'import "./styles/r78-authenticated-density.css";',
              'import "./styles/r78-authenticated-density.css";\nimport "./styles/r91-launch-experience.css";',
          )
          write(path, text)

          # Homepage: reduce first-load member portrait requests and remove narrow category framing.
          path = "app/routes/home.tsx"
          text = read(path)
          text = text.replace(
              '  { title: "AKARI House | A private Web3 professional network" },',
              '  { title: "AKARI House | Founder, Creator & Investor Network" },',
          )
          text = text.replace("         LIMIT 10`,", "         LIMIT 4`,", 1)
          write(path, text)

          # Hero: responsive image delivery while retaining the approved single-scene architecture.
          path = "app/components/house/InteractiveArrival.tsx"
          text = read(path)
          old = '''      <img
                className="arrival-scene"
                src="/assets/optimized/arrival.webp"
                alt=""
                aria-hidden="true"
                fetchPriority="high"
                width={1672}
                height={941}
              />'''
          new = '''      <picture>
                <source
                  media="(max-width: 768px)"
                  srcSet="/assets/optimized/arrival-960.webp"
                />
                <source srcSet="/assets/optimized/arrival-1440.webp" />
                <img
                  className="arrival-scene"
                  src="/assets/optimized/arrival.webp"
                  alt=""
                  aria-hidden="true"
                  fetchPriority="high"
                  loading="eager"
                  decoding="async"
                  width={1440}
                  height={811}
                />
              </picture>'''
          if old not in text:
              raise SystemExit("Arrival image block changed unexpectedly")
          write(path, text.replace(old, new, 1))

          # Header: workspace pages should not repeat the public navigation beside the sidebar.
          path = "app/components/SiteHeader.tsx"
          text = read(path)
          text = text.replace(
              "  const primaryLinks = primaryLinksForUser(user);",
              "  const primaryLinks = workspaceSidebar && user ? [] : primaryLinksForUser(user);",
              1,
          )
          text = text.replace(
              '<header className="site-header">',
              '<header className={`site-header${workspaceSidebar ? " is-workspace-header" : ""}`}>',
              1,
          )
          updates = '''      <Link className="header-update-link" to="/notifications">
                Updates
              </Link>'''
          activity = '''      <Link className="header-update-link" to="/connections">
                Connections
              </Link>
              <Link className="header-update-link" to="/notifications">
                Updates
              </Link>'''
          if updates not in text:
              raise SystemExit("Header updates link changed unexpectedly")
          text = text.replace(updates, activity, 1)
          write(path, text)

          # Sidebar: keep every real destination but group activity away from discovery and remove edit duplication.
          path = "app/components/HouseWorkspaceSidebar.tsx"
          text = read(path)
          old = '''const discoveryItems: WorkspaceItem[] = [
            { label: "Members", href: "/members", glyph: "◎" },
            { label: "Connections", href: "/connections", glyph: "∞" },
            { label: "Projects", href: "/projects", glyph: "◇" },
            { label: "Campaigns", href: "/campaigns", glyph: "✦" },
            { label: "Events", href: "/events", glyph: "□" },
            { label: "Notifications", href: "/notifications", glyph: "◌" },
          ];

          const profileItems: WorkspaceItem[] = [
            { label: "Edit profile", href: "/app#profile-editor", glyph: "◉" },
            { label: "Profile card", href: "/profile-card", glyph: "▣" },
            { label: "Account & privacy", href: "/settings/account", glyph: "⚙" },
          ];'''
          new = '''const discoveryItems: WorkspaceItem[] = [
            { label: "Members", href: "/members", glyph: "◎" },
            { label: "Projects", href: "/projects", glyph: "◇" },
            { label: "Campaigns", href: "/campaigns", glyph: "✦" },
            { label: "Events", href: "/events", glyph: "□" },
          ];

          const activityItems: WorkspaceItem[] = [
            { label: "Connections", href: "/connections", glyph: "∞" },
            { label: "Notifications", href: "/notifications", glyph: "◌" },
          ];

          const profileItems: WorkspaceItem[] = [
            { label: "Profile card", href: "/profile-card", glyph: "▣" },
            { label: "Account & privacy", href: "/settings/account", glyph: "⚙" },
          ];'''
          if old not in text:
              raise SystemExit("Sidebar shared navigation block changed unexpectedly")
          text = text.replace(old, new, 1)
          marker = '''        <span className="house-workspace-sidebar-section">Profile</span>
                  {profileItems.map((item) => ('''
          activity_block = '''        <span className="house-workspace-sidebar-section">Activity</span>
                  {activityItems.map((item) => (
                    <SidebarLink
                      key={item.label}
                      item={item}
                      pathname={pathname}
                      hash={hash}
                    />
                  ))}

                  <span className="house-workspace-sidebar-section">Profile</span>
                  {profileItems.map((item) => ('''
          if marker not in text:
              raise SystemExit("Sidebar profile marker changed unexpectedly")
          text = text.replace(marker, activity_block, 1)
          write(path, text)

          # Dashboard: remove the third navigation layer and replace repeated overview panels with one role-first compass.
          path = "app/routes/dashboard.tsx"
          text = read(path)
          text = text.replace('import { ScrollTo } from "~/components/ScrollTo";\n', "", 1)
          text = text.replace(
              'import { DashboardRoleActions } from "~/components/DashboardRoleActions";',
              'import { HouseCompass } from "~/components/HouseCompass";',
              1,
          )
          text, n = re.subn(
              r'\n        <nav className="dashboard-nav"[\s\S]*?\n        </nav>\n        <section className="dashboard-content">',
              '\n        <section className="dashboard-content">',
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit(f"Dashboard duplicate nav removal matched {n} blocks")
          insertion = '''          <HouseCompass
                    user={loaderData.user}
                    isMember={isMember}
                    membershipLabel={membershipLabel}
                    completion={completion}
                    activity={loaderData.activity}
                  />
                  <div className="dashboard-heading">'''
          if '          <div className="dashboard-heading">' not in text:
              raise SystemExit("Dashboard heading marker missing")
          text = text.replace('          <div className="dashboard-heading">', insertion, 1)
          text = text.replace(
              '<span className="eyebrow">Personal profile</span>\n              <h1>Shape how you appear.</h1>',
              '<span className="eyebrow">Your AKARI identity</span>\n              <h1>Keep your profile clear and credible.</h1>',
              1,
          )
          text, n = re.subn(
              r'\n          <section\n            className="member-home"[\s\S]*?\n          <ProfilePhotoEditor',
              '\n          <ProfilePhotoEditor',
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit(f"Dashboard repeated overview removal matched {n} blocks")
          write(path, text)

          # Routes: serve a data-aware sitemap instead of a stale static file.
          path = "app/routes.ts"
          text = read(path)
          marker = '  route("health", "routes/health.ts"),\n'
          if 'route("sitemap.xml"' not in text:
              if marker not in text:
                  raise SystemExit("Route insertion marker missing")
              text = text.replace(marker, marker + '  route("sitemap.xml", "routes/sitemap.ts"),\n', 1)
          write(path, text)

          # Existing source assertion should reflect the intentionally smaller homepage presence preview.
          path = "tests/homepage-isolation.test.ts"
          text = read(path).replace('expect(homeSource).toContain("LIMIT 10");', 'expect(homeSource).toContain("LIMIT 4");')
          write(path, text)

          # Dynamic sitemap resource route.
          write("app/routes/sitemap.ts", '''import type { Route } from "./+types/sitemap";
          import { cloudflareContext } from "~/lib/cloudflare-context";

          const origin = "https://akarihouse.com";
          const staticPaths = [
            "/",
            "/hall",
            "/archive",
            "/team",
            "/projects",
            "/campaigns",
            "/events",
            "/deals",
            "/membership",
            "/contact",
            "/privacy",
            "/terms",
            "/community-guidelines",
          ];

          function escapeXml(value: string) {
            return value
              .replaceAll("&", "&amp;")
              .replaceAll("<", "&lt;")
              .replaceAll(">", "&gt;")
              .replaceAll('"', "&quot;")
              .replaceAll("'", "&apos;");
          }

          function sitemapEntry(path: string, updatedAt?: string | null) {
            const lastmod = updatedAt?.slice(0, 10);
            return [
              "  <url>",
              `    <loc>${escapeXml(`${origin}${path}`)}</loc>`,
              ...(lastmod ? [`    <lastmod>${escapeXml(lastmod)}</lastmod>`] : []),
              "  </url>",
            ].join("\\n");
          }

          export async function loader({ context }: Route.LoaderArgs) {
            const db = context.get(cloudflareContext).env.DB;
            const [projects, campaigns, events] = await Promise.all([
              db
                .prepare(
                  "SELECT slug, updated_at AS updatedAt FROM projects WHERE status = 'published' ORDER BY updated_at DESC LIMIT 1000",
                )
                .all<{ slug: string; updatedAt: string }>(),
              db
                .prepare(
                  "SELECT slug, updated_at AS updatedAt FROM ambassador_campaigns WHERE status = 'published' ORDER BY updated_at DESC LIMIT 1000",
                )
                .all<{ slug: string; updatedAt: string }>(),
              db
                .prepare(
                  "SELECT slug, updated_at AS updatedAt FROM events WHERE status = 'published' ORDER BY updated_at DESC LIMIT 1000",
                )
                .all<{ slug: string; updatedAt: string }>(),
            ]);

            const entries = [
              ...staticPaths.map((path) => sitemapEntry(path)),
              ...projects.results.map((item) =>
                sitemapEntry(`/projects/${encodeURIComponent(item.slug)}`, item.updatedAt),
              ),
              ...campaigns.results.map((item) =>
                sitemapEntry(`/campaigns/${encodeURIComponent(item.slug)}`, item.updatedAt),
              ),
              ...events.results.map((item) =>
                sitemapEntry(`/events/${encodeURIComponent(item.slug)}`, item.updatedAt),
              ),
            ];

            return new Response(
              `<?xml version="1.0" encoding="UTF-8"?>\\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\\n${entries.join("\\n")}\\n</urlset>\\n`,
              {
                headers: {
                  "Content-Type": "application/xml; charset=utf-8",
                  "Cache-Control": "public, max-age=3600, stale-while-revalidate=86400",
                },
              },
            );
          }
          ''')

          # Role-first member compass. One primary move, then two logical next moves.
          write("app/components/HouseCompass.tsx", '''import { useMemo, useState } from "react";
          import { Link } from "react-router";
          import type { Role, SessionUser } from "~/lib/domain";

          export type HouseCompassStep = {
            label: string;
            title: string;
            description: string;
            href: string;
            action: string;
          };

          export const houseCompassJourneys: Record<Role, HouseCompassStep[]> = {
            founder: [
              {
                label: "01 · Project",
                title: "Keep your project actionable",
                description:
                  "Make the project, stage and current support needs clear before asking the House to act.",
                href: "/projects/manage",
                action: "Manage projects",
              },
              {
                label: "02 · People",
                title: "Find the right Creators",
                description:
                  "Discover people by role and expertise instead of broadcasting to everyone.",
                href: "/members?role=creator",
                action: "Find Creators",
              },
              {
                label: "03 · Momentum",
                title: "Turn support into a campaign",
                description:
                  "Use published campaigns to coordinate clear briefs, applications and outcomes.",
                href: "/campaigns",
                action: "Open campaigns",
              },
            ],
            creator: [
              {
                label: "01 · Signal",
                title: "Make your profile useful",
                description:
                  "Keep your X profile, audience signals, expertise and availability current.",
                href: "/app#profile-editor",
                action: "Update profile",
              },
              {
                label: "02 · Fit",
                title: "Find a campaign that fits",
                description:
                  "Start with the brief, eligibility, deadline and compensation before you apply.",
                href: "/campaigns",
                action: "Find campaigns",
              },
              {
                label: "03 · Relationship",
                title: "Meet the people behind the work",
                description:
                  "Build useful Founder relationships rather than collecting disconnected contacts.",
                href: "/members?role=founder",
                action: "Find Founders",
              },
            ],
            investor: [
              {
                label: "01 · Opportunity",
                title: "See opportunities first",
                description:
                  "Review the available opportunity before spending time on settings or admin.",
                href: "/deals",
                action: "Browse opportunities",
              },
              {
                label: "02 · Relevance",
                title: "Tune what matters to you",
                description:
                  "Preferences improve relevance without blocking your ability to browse the House.",
                href: "/settings/investor",
                action: "Set preferences",
              },
              {
                label: "03 · People",
                title: "Understand the Founder",
                description:
                  "Use the member network to understand who is behind an opportunity before an introduction.",
                href: "/members?role=founder",
                action: "Find Founders",
              },
            ],
          };

          type Props = {
            user: SessionUser;
            isMember: boolean;
            membershipLabel: string;
            completion: { percent: number; missing: string[] };
            activity: {
              unreadNotifications: number;
              connections: number;
              followedProjects: number;
              upcomingEvents: number;
            };
          };

          export function HouseCompass({
            user,
            isMember,
            membershipLabel,
            completion,
            activity,
          }: Props) {
            const roles = useMemo(() => user.roles.filter(Boolean), [user.roles]);
            const [activeRole, setActiveRole] = useState<Role>(roles[0] ?? "founder");
            const steps = houseCompassJourneys[activeRole];

            if (!isMember) {
              return (
                <section className="house-compass is-applicant" aria-labelledby="house-compass-title">
                  <div className="house-compass-heading">
                    <div>
                      <span className="eyebrow">Your path into the House</span>
                      <h1 id="house-compass-title">Finish your identity. We handle the review.</h1>
                      <p>
                        You do not need to explore every room yet. Keep your profile useful and private while the Membership Desk completes its review.
                      </p>
                    </div>
                    <span className="house-compass-status">{membershipLabel}</span>
                  </div>
                  <div className="house-compass-applicant-actions">
                    <a className="button button-primary" href="#profile-editor">
                      Complete your profile
                    </a>
                    <Link className="button button-quiet" to="/settings/account">
                      Review privacy
                    </Link>
                  </div>
                </section>
              );
            }

            return (
              <section className="house-compass" aria-labelledby="house-compass-title">
                <div className="house-compass-heading">
                  <div>
                    <span className="eyebrow">House Compass</span>
                    <h1 id="house-compass-title">One next move at a time.</h1>
                    <p>
                      Choose the role you are using now. AKARI keeps one identity, then changes the path around your intent.
                    </p>
                  </div>
                  <div className="house-compass-readiness" aria-label="Profile readiness">
                    <strong>{completion.percent}%</strong>
                    <span>profile ready</span>
                    <div
                      className="house-compass-progress"
                      role="progressbar"
                      aria-label="Profile completion"
                      aria-valuemin={0}
                      aria-valuemax={100}
                      aria-valuenow={completion.percent}
                    >
                      <span style={{ width: `${completion.percent}%` }} />
                    </div>
                  </div>
                </div>

                {roles.length > 1 && (
                  <div className="house-compass-role-switch" aria-label="Choose your active AKARI role">
                    {roles.map((role) => (
                      <button
                        key={role}
                        type="button"
                        aria-pressed={activeRole === role}
                        onClick={() => setActiveRole(role)}
                      >
                        {role}
                      </button>
                    ))}
                  </div>
                )}

                <div className="house-compass-steps">
                  {steps.map((step, index) => (
                    <article
                      className={`house-compass-step${index === 0 ? " is-now" : ""}`}
                      key={step.label}
                    >
                      <span>{step.label}</span>
                      <h2>{step.title}</h2>
                      <p>{step.description}</p>
                      <Link
                        className={index === 0 ? "button button-primary" : "quiet-link"}
                        to={step.href}
                      >
                        {step.action} <span aria-hidden="true">→</span>
                      </Link>
                    </article>
                  ))}
                </div>

                <nav className="house-compass-activity" aria-label="Your House activity">
                  <Link to="/connections"><strong>{activity.connections}</strong><span>connections</span></Link>
                  <Link to="/notifications"><strong>{activity.unreadNotifications}</strong><span>updates</span></Link>
                  <Link to="/projects"><strong>{activity.followedProjects}</strong><span>followed projects</span></Link>
                  <Link to="/events"><strong>{activity.upcomingEvents}</strong><span>event places</span></Link>
                </nav>
              </section>
            );
          }
          ''')

          write("app/styles/r91-launch-experience.css", '''/* R91 — one clear role-first path, less duplicated chrome, lighter rendering. */
          .house-compass {
            position: relative;
            overflow: hidden;
            margin: 0 0 1.25rem;
            padding: clamp(1.1rem, 2.2vw, 1.75rem);
            border: 1px solid rgba(240, 79, 135, 0.22);
            border-radius: 22px;
            background:
              radial-gradient(circle at 88% 0%, rgba(255, 211, 61, 0.08), transparent 30%),
              linear-gradient(145deg, rgba(17, 21, 34, 0.98), rgba(9, 11, 20, 0.98));
          }

          .house-compass::after {
            position: absolute;
            top: 0;
            right: 2rem;
            width: 72px;
            height: 3px;
            border-radius: 0 0 999px 999px;
            background: linear-gradient(90deg, var(--pink), var(--yellow));
            content: "";
          }

          .house-compass-heading {
            display: flex;
            justify-content: space-between;
            gap: 1.25rem;
            align-items: flex-start;
          }

          .house-compass-heading > div:first-child {
            max-width: 720px;
          }

          .house-compass-heading h1 {
            margin: 0.35rem 0 0.6rem;
            font-size: clamp(1.75rem, 3vw, 2.7rem);
            letter-spacing: -0.04em;
          }

          .house-compass-heading p,
          .house-compass-step p {
            color: var(--muted);
            line-height: 1.65;
          }

          .house-compass-readiness {
            min-width: 132px;
            padding: 0.8rem 0.9rem;
            border: 1px solid var(--hair);
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.025);
          }

          .house-compass-readiness strong,
          .house-compass-readiness span {
            display: block;
          }

          .house-compass-readiness strong {
            color: var(--yellow);
            font-size: 1.5rem;
          }

          .house-compass-readiness > span {
            margin-top: 0.08rem;
            color: var(--muted);
            font-size: 0.78rem;
          }

          .house-compass-progress {
            overflow: hidden;
            height: 4px;
            margin-top: 0.65rem;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
          }

          .house-compass-progress > span {
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, var(--pink), var(--yellow));
          }

          .house-compass-role-switch {
            display: inline-flex;
            gap: 0.3rem;
            margin: 1rem 0 0;
            padding: 0.28rem;
            border: 1px solid var(--hair);
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.18);
          }

          .house-compass-role-switch button {
            min-height: 38px;
            padding: 0.45rem 0.8rem;
            border: 0;
            border-radius: 999px;
            background: transparent;
            color: var(--muted);
            font: inherit;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: capitalize;
            cursor: pointer;
          }

          .house-compass-role-switch button[aria-pressed="true"] {
            background: rgba(240, 79, 135, 0.14);
            color: #fff;
            box-shadow: inset 0 0 0 1px rgba(240, 79, 135, 0.26);
          }

          .house-compass-steps {
            display: grid;
            grid-template-columns: 1.2fr 1fr 1fr;
            gap: 0.75rem;
            margin-top: 1rem;
          }

          .house-compass-step {
            min-width: 0;
            padding: 1rem;
            border: 1px solid var(--hair);
            border-radius: 17px;
            background: rgba(255, 255, 255, 0.025);
          }

          .house-compass-step.is-now {
            border-color: rgba(240, 79, 135, 0.35);
            background: linear-gradient(145deg, rgba(240, 79, 135, 0.09), rgba(255, 211, 61, 0.025));
          }

          .house-compass-step > span:first-child {
            color: var(--yellow);
            font-size: 0.67rem;
            font-weight: 800;
            letter-spacing: 0.1em;
            text-transform: uppercase;
          }

          .house-compass-step h2 {
            margin: 0.55rem 0 0.4rem;
            font-size: clamp(1.05rem, 1.6vw, 1.35rem);
          }

          .house-compass-step p {
            min-height: 4.8em;
            margin: 0 0 0.85rem;
            font-size: 0.88rem;
          }

          .house-compass-activity {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 0.55rem;
            margin-top: 0.75rem;
          }

          .house-compass-activity a {
            display: flex;
            gap: 0.4rem;
            align-items: baseline;
            padding: 0.55rem 0.7rem;
            border-radius: 12px;
            color: inherit;
            background: rgba(255, 255, 255, 0.02);
            text-decoration: none;
          }

          .house-compass-activity strong {
            color: var(--yellow);
          }

          .house-compass-activity span {
            color: var(--muted);
            font-size: 0.75rem;
          }

          .house-compass-status {
            padding: 0.45rem 0.7rem;
            border: 1px solid rgba(255, 211, 61, 0.25);
            border-radius: 999px;
            color: var(--yellow);
            font-size: 0.75rem;
            font-weight: 800;
          }

          .house-compass-applicant-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.65rem;
            margin-top: 1rem;
          }

          @media (min-width: 901px) {
            .site-header.is-workspace-header {
              justify-content: flex-end;
              min-height: 68px;
              background: rgba(9, 11, 20, 0.88);
            }

            .site-header.is-workspace-header .wordmark,
            .site-header.is-workspace-header .desktop-nav,
            .site-header.is-workspace-header .header-account-link {
              display: none;
            }
          }

          @media (max-width: 860px) {
            .house-compass-steps {
              grid-template-columns: 1fr;
            }

            .house-compass-step p {
              min-height: 0;
            }

            .house-compass-activity {
              grid-template-columns: repeat(2, minmax(0, 1fr));
            }
          }

          @media (max-width: 560px) {
            .house-compass-heading {
              display: grid;
            }

            .house-compass-readiness {
              width: min(180px, 100%);
            }

            .house-compass-role-switch {
              display: grid;
              grid-template-columns: repeat(3, 1fr);
              width: 100%;
              border-radius: 14px;
            }

            .house-compass-role-switch button {
              min-width: 0;
            }
          }
          ''')

          write("tests/unit/house-compass.test.ts", '''import { describe, expect, it } from "vitest";

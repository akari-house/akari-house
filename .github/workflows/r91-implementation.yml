          Path("public/sitemap.xml").unlink(missing_ok=True)

          write("docs/R91_LAUNCH_EXPERIENCE_OPTIMIZATION.md", '''# R91 — Launch Experience, Performance & Discovery Optimization

          ## Decision panel

          R91 is reviewed through the combined lens of a principal product/IA lead, senior UX architect, Founder/Creator/Investor journey advisors, AKARI art direction, design-systems and accessibility specialists, frontend performance engineering, technical SEO, PWA/app-discovery readiness, privacy/security and cross-browser QA.

          ## Product rule

          **The public House creates emotion. The signed-in House creates direction. Evidence creates trust.**

          A member should never need to understand the full AKARI feature map before getting value. The signed-in experience therefore presents one role at a time and three ordered decisions through the House Compass.

          ## R91 changes

          - Remove the dashboard's duplicate third navigation layer.
          - Reduce repeated account-status/profile-readiness/role-workspace panels to one House Compass.
          - Keep multi-role identity intact while allowing an obvious active-role view.
          - Keep public/cinematic navigation separate from focused workspace navigation.
          - Reduce homepage member-preview image requests.
          - Remove the render-blocking Google Fonts stylesheet; retain a system-first Inter-compatible stack.
          - Serve responsive Arrival artwork for mobile and desktop.
          - Replace malformed PWA icon dimensions with exact 192/512 square icons plus a maskable icon.
          - Replace the stale static sitemap with a D1-aware sitemap for published Projects, Campaigns and Events.
          - Keep authenticated member discovery out of search indexing.
          - Preserve AKARI House / CRM by AKARI product boundaries from R90.

          ## Deliberately not added

          No chat, wallet, token feature, AI matching, new CRM surface, creator basket or speculative feature scope is part of this release.
          ''')
          PY

      - name: Generate responsive and installable brand assets
        run: |
          node --input-type=module <<'NODE'
          import sharp from "sharp";

          const hero = "public/assets/optimized/arrival.webp";
          await sharp(hero)
            .resize({ width: 960, withoutEnlargement: true })
            .webp({ quality: 78, effort: 6 })
            .toFile("public/assets/optimized/arrival-960.webp");
          await sharp(hero)
            .resize({ width: 1440, withoutEnlargement: true })
            .webp({ quality: 82, effort: 6 })
            .toFile("public/assets/optimized/arrival-1440.webp");

          const mark = "public/assets/brand/akari-mark.png";
          const background = { r: 9, g: 11, b: 20, alpha: 1 };
          for (const size of [64, 180, 192, 512]) {
            const name = size === 64
              ? "favicon.png"
              : size === 180
                ? "apple-touch-icon.png"
                : `app-icon-${size}.png`;
            await sharp(mark)
              .resize(size, size, { fit: "contain", background })
              .png({ compressionLevel: 9 })
              .toFile(`public/assets/brand/${name}`);
          }
          await sharp(mark)
            .resize(400, 400, { fit: "contain", background: { r: 0, g: 0, b: 0, alpha: 0 } })
            .extend({ top: 56, bottom: 56, left: 56, right: 56, background })
            .png({ compressionLevel: 9 })
            .toFile("public/assets/brand/app-icon-maskable-512.png");
          NODE


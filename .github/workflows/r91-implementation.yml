          write("tests/unit/r91-discovery-foundation.test.ts", '''import { readFileSync } from "node:fs";
          import { describe, expect, it } from "vitest";

          describe("R91 discovery and installability foundation", () => {
            it("removes the render-blocking remote font stylesheet", () => {
              const root = readFileSync("app/root.tsx", "utf8");
              expect(root).not.toContain("fonts.googleapis.com");
              expect(root).toContain("arrival-960.webp");
              expect(root).toContain("arrival-1440.webp");
            });

            it("keeps member-only discovery out of search indexing", () => {
              const root = readFileSync("app/root.tsx", "utf8");
              expect(root).toContain('"/members"');
            });

            it("uses a dynamic sitemap and square install icons", () => {
              const routes = readFileSync("app/routes.ts", "utf8");
              const manifest = JSON.parse(readFileSync("public/site.webmanifest", "utf8")) as {
                icons: Array<{ sizes: string; purpose: string }>;
                shortcuts?: unknown[];
              };
              expect(routes).toContain('route("sitemap.xml", "routes/sitemap.ts")');
              expect(manifest.icons.some((icon) => icon.sizes === "192x192")).toBe(true);
              expect(manifest.icons.some((icon) => icon.sizes === "512x512")).toBe(true);
              expect(manifest.icons.some((icon) => icon.purpose === "maskable")).toBe(true);
              expect(manifest.shortcuts?.length).toBeGreaterThanOrEqual(3);
            });
          });
          ''')


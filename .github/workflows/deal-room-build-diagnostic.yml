name: Deal Room Build Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run production build with captured output
        run: |
          set +e
          npm run build 2>&1 | tee deal-room-build.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Upload build diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deal-room-build-${{ github.sha }}
          path: deal-room-build.log
          retention-days: 7

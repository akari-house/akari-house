name: Apply Project Ownership Transfer

on:
  push:
    branches:
      - feature/project-ownership-transfer
    paths:
      - .github/workflows/apply-project-ownership-transfer.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/project-ownership-transfer
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply ownership and collaborator access changes
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).parent.mkdir(parents=True, exist_ok=True)
              Path(path).write_text(text)

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected one match in {path}, found {count}: {old[:100]!r}")
              write(path, text.replace(old, new, 1))

          def replace_count(path, old, new, expected):
              text = read(path)
              count = text.count(old)
              if count != expected:
                  raise RuntimeError(f"Expected {expected} matches in {path}, found {count}: {old[:100]!r}")
              write(path, text.replace(old, new))

          write("migrations/0111_project_ownership_transfer.sql", """PRAGMA foreign_keys = ON;

CREATE TABLE project_collaborators (
  project_id TEXT NOT NULL REFERENCES projects(id) ON DELETE CASCADE,
  user_id TEXT NOT NULL REFERENCES users(id) ON DELETE CASCADE,
  access_level TEXT NOT NULL DEFAULT 'manager'
    CHECK (access_level IN ('manager')),
  granted_by TEXT REFERENCES users(id) ON DELETE SET NULL,
  created_at TEXT NOT NULL DEFAULT (datetime('now')),
  updated_at TEXT NOT NULL DEFAULT (datetime('now')),
  PRIMARY KEY (project_id, user_id)
);

CREATE INDEX idx_project_collaborators_user
  ON project_collaborators(user_id, updated_at DESC);
""")

          write("app/lib/project-access.server.ts", """export type ProjectManagerAccess = "owner" | "collaborator";

export async function projectManagerAccess(
  db: D1Database,
  projectId: string,
  userId: string,
): Promise<ProjectManagerAccess | null> {
  const row = await db
    .prepare(
      `SELECT CASE
                WHEN pr.founder_user_id = ? THEN 'owner'
                ELSE 'collaborator'
              END AS access
       FROM projects pr
       LEFT JOIN project_collaborators pc
         ON pc.project_id = pr.id AND pc.user_id = ?
       WHERE pr.id = ?
         AND (pr.founder_user_id = ? OR pc.user_id IS NOT NULL)
       LIMIT 1`,
    )
    .bind(userId, userId, projectId, userId)
    .first<{ access: ProjectManagerAccess }>();
  return row?.access ?? null;
}

export async function userCanManageProject(
  db: D1Database,
  projectId: string,
  userId: string,
) {
  return Boolean(await projectManagerAccess(db, projectId, userId));
}

export async function requireProjectManagerBySlug(
  db: D1Database,
  slug: string | undefined,
  userId: string,
) {
  const project = await db
    .prepare(
      `SELECT pr.id AS projectId, pr.slug,
              pr.founder_user_id AS ownerUserId,
              CASE
                WHEN pr.founder_user_id = ? THEN 'owner'
                ELSE 'collaborator'
              END AS access
       FROM projects pr
       LEFT JOIN project_collaborators pc
         ON pc.project_id = pr.id AND pc.user_id = ?
       WHERE pr.slug = ?
         AND (pr.founder_user_id = ? OR pc.user_id IS NOT NULL)
       LIMIT 1`,
    )
    .bind(userId, userId, slug, userId)
    .first<{
      projectId: string;
      slug: string;
      ownerUserId: string;
      access: ProjectManagerAccess;
    }>();
  if (!project) throw new Response("Project not found.", { status: 404 });
  return project;
}
""")


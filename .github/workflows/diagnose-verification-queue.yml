name: Diagnose Verification Queue

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Capture typecheck output
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npm run typecheck > /tmp/typecheck.log 2>&1
          status=$?
          {
            echo '## Verification queue typecheck diagnostic'
            echo
            echo '```text'
            tail -n 120 /tmp/typecheck.log
            echo '```'
          } > /tmp/comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/comment.md
          exit "$status"

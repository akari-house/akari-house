name: Apply Legacy Diligence Repair

on:
  push:
    branches: [fix/complete-investor-deals-room]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, 'Apply legacy diligence repair') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/complete-investor-deals-room
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply diligence patch
        run: |
          set +e
          node scripts/patch-legacy-diligence.mjs 2>&1 | tee diligence-patch.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Upload diligence patch diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diligence-patch-diagnostic-${{ github.sha }}
          path: diligence-patch.log
          retention-days: 7
      - run: npx prettier --write app/routes/project-diligence.tsx
      - name: Commit changes
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/routes/project-diligence.tsx
          if git diff --cached --quiet; then
            echo "No diligence source changes required."
          else
            git commit -m "Apply legacy diligence repair"
            git push
          fi

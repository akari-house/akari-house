name: Diagnose Auth Latest

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/auth-password-ux
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Capture latest authentication result
        run: |
          set +e
          npx playwright test tests/e2e/auth-password-ux.spec.ts --reporter=line --retries=0 > .github/auth-latest-result.txt 2>&1
          status=$?
          echo "exit_status=${status}" >> .github/auth-latest-result.txt
          rm -f .github/workflows/diagnose-auth-latest.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record latest authentication browser result"
          git pull --rebase origin agent/auth-password-ux
          git push origin HEAD:agent/auth-password-ux
          exit 0

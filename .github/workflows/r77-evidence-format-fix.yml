name: R77 One-Time Evidence Format Repair

on:
  push:
    branches:
      - r77-launch-completion
    paths:
      - .github/workflows/r77-evidence-format-fix.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r77-launch-completion
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: >-
          npx prettier --write
          .github/workflows/production-performance.yml
          scripts/production-performance.mjs
          scripts/production-inventory-evidence.mjs
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "R77: format production launch evidence" || true
          git push origin HEAD:r77-launch-completion
      - name: Remove temporary workflow
        run: |
          rm .github/workflows/r77-evidence-format-fix.yml
          git add -A
          git commit -m "chore: remove R77 evidence format workflow"
          git push origin HEAD:r77-launch-completion

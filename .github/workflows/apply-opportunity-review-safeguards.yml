name: Apply Opportunity Review Safeguards

on:
  push:
    branches: [fix/complete-investor-deals-room]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply opportunity review safeguards') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/complete-investor-deals-room
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/patch-opportunity-review-safeguards.mjs
      - run: npx prettier --write app/routes/admin-opportunities.tsx
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/routes/admin-opportunities.tsx
          if git diff --cached --quiet; then
            echo "No review safeguard changes required."
          else
            git commit -m "Apply opportunity review safeguards"
            git push
          fi

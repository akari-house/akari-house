name: Patch Diligence Document Approval

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Enforce approved documents in diligence workspace
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/routes/project-diligence.tsx")
          value = path.read_text()
          replacements = [
              (
                  '''`SELECT id, title, content_type AS contentType, byte_size AS byteSize,
                        created_at AS createdAt
                 FROM project_documents WHERE project_id = ? ORDER BY created_at DESC`,''',
                  '''`SELECT id, title, content_type AS contentType, byte_size AS byteSize,
                        category, approved_at AS approvedAt,
                        created_at AS createdAt
                 FROM project_documents WHERE project_id = ? ORDER BY created_at DESC`,''',
              ),
              (
                  '''      byteSize: number;
      createdAt: string;''',
                  '''      byteSize: number;
      category: string;
      approvedAt: string | null;
      createdAt: string;''',
              ),
              (
                  '''         FROM users u JOIN profiles p ON p.user_id = u.id
         JOIN role_verifications rv ON rv.user_id = u.id AND rv.role = 'investor'
         WHERE rv.status = 'verified' AND u.status = 'active' ''',
                  '''         FROM users u JOIN profiles p ON p.user_id = u.id
         JOIN role_verifications rv ON rv.user_id = u.id AND rv.role = 'investor'
         JOIN investor_profiles ip ON ip.user_id = u.id
         JOIN membership_applications ma ON ma.user_id = u.id
         WHERE rv.status = 'verified' AND ip.status = 'verified'
           AND ma.status = 'approved' AND u.status = 'active' ''',
              ),
              (
                  '''       WHERE dag.project_id = ? AND dag.investor_user_id = ?
          AND dag.revoked_at IS NULL AND dag.starts_at <= datetime('now')''',
                  '''       WHERE dag.project_id = ? AND dag.investor_user_id = ?
          AND pd.approved_at IS NOT NULL
          AND dag.revoked_at IS NULL AND dag.starts_at <= datetime('now')''',
              ),
              (
                  '''         `SELECT 1 FROM project_documents pd
        JOIN role_verifications rv ON rv.user_id = ? AND rv.role = 'investor' AND rv.status = 'verified'
        WHERE pd.id = ? AND pd.project_id = ?`,''',
                  '''         `SELECT 1 FROM project_documents pd
        JOIN role_verifications rv ON rv.user_id = ?
          AND rv.role = 'investor' AND rv.status = 'verified'
        JOIN investor_profiles ip ON ip.user_id = rv.user_id AND ip.status = 'verified'
        JOIN users u ON u.id = rv.user_id AND u.status = 'active'
        JOIN membership_applications ma
          ON ma.user_id = rv.user_id AND ma.status = 'approved'
        WHERE pd.id = ? AND pd.project_id = ? AND pd.approved_at IS NOT NULL`,''',
              ),
              (
                  '''                      {loaderData.documents.map((item) => (
                        <option key={item.id} value={item.id}>
                          {item.title}
                        </option>
                      ))}''',
                  '''                      {loaderData.documents.map((item) => (
                        <option
                          key={item.id}
                          value={item.id}
                          disabled={!item.approvedAt}
                        >
                          {item.title}
                          {item.approvedAt ? "" : " (awaiting AKARI review)"}
                        </option>
                      ))}''',
              ),
              (
                  '''                  <label>
                    Document
                    <select name="documentId" required>''',
                  '''                  <p>
                    Only documents approved through AKARI review can be granted.
                  </p>
                  <label>
                    Document
                    <select name="documentId" required>''',
              ),
          ]

          for old, new in replacements:
              count = value.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match, found {count}: {old[:80]!r}")
              value = value.replace(old, new, 1)

          path.write_text(value)
          PY
      - name: Commit approval enforcement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/routes/project-diligence.tsx
          git commit -m "Enforce reviewed documents in diligence grants"
          git push

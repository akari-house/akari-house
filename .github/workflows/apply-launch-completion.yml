name: Apply Launch Completion

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-launch-completion.yml"
      - ".github/launch-completion-parts/**"

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply launch completion release
        run: |
          set -euo pipefail
          cat .github/launch-completion-parts/part-* | base64 -d | gzip -d > /tmp/launch-completion.patch
          git apply --check /tmp/launch-completion.patch
          git apply /tmp/launch-completion.patch
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - name: Commit verified release
        run: |
          set -euo pipefail
          rm -rf .github/launch-completion-parts
          rm -f .github/workflows/apply-launch-completion.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete AKARI launch systems"
          git push

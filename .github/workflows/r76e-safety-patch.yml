name: R76E Revocation Safety Patch

on:
  push:
    branches:
      - feature/r76e-trust-review-operations

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/r76e-trust-review-operations
      - name: Bind revocation cleanup to original verification grant
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/routes/admin-project-claims.tsx')
          text = path.read_text()
          text = text.replace(
              'rel.claim_status AS claimStatus,\n              pr.title AS projectTitle,',
              'rel.claim_status AS claimStatus,\n              rel.reviewed_by AS previousReviewerId,\n              pr.title AS projectTitle,',
              1,
          )
          text = text.replace(
              'claimStatus: string;\n      projectTitle: string;',
              'claimStatus: string;\n      previousReviewerId: string | null;\n      projectTitle: string;',
              1,
          )
          text = text.replace(
              "WHERE project_id = ? AND user_id = ? AND access_level = 'manager'`,\n        )\n        .bind(projectId, userId),",
              "WHERE project_id = ? AND user_id = ? AND access_level = 'manager'\n             AND granted_by = ?`,\n        )\n        .bind(projectId, userId, claim.previousReviewerId ?? admin.id),",
              1,
          )
          path.write_text(text)
          PY
      - run: npx prettier --write app/routes/admin-project-claims.tsx
      - name: Commit safety patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/routes/admin-project-claims.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "R76E scope revocation cleanup to verification grant"
          git push origin HEAD:feature/r76e-trust-review-operations

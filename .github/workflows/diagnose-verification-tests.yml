name: Diagnose Verification Queue Tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/verification-active-queue
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Persist full test output
        run: |
          set +e
          npm test > .github/verification-test-output.txt 2>&1
          status=$?
          echo "exit_status=${status}" >> .github/verification-test-output.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/verification-test-output.txt
          git commit -m "Record verification queue test diagnostic"
          git push origin HEAD:agent/verification-active-queue
          exit "$status"

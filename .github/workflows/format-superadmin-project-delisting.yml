name: Format Superadmin Project Delisting

on:
  push:
    branches:
      - feature/superadmin-project-delisting

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/superadmin-project-delisting
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply repository formatting
        run: npx prettier --write app/routes/admin-interests.tsx tests/superadmin-project-delisting.test.ts
      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/routes/admin-interests.tsx tests/superadmin-project-delisting.test.ts
          git commit -m "Format Superadmin project delisting"
          git push origin HEAD:feature/superadmin-project-delisting

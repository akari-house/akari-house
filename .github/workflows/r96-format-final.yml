name: R96 Final Format

on:
  push:
    branches:
      - r96-project-detail-pilot-console

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r96-project-detail-pilot-console
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format R96.2 files
        run: npx prettier --write app/routes/admin-seed-house.tsx app/routes/project-detail-v2.tsx app/styles/r96-pilot-readiness.css
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/routes/admin-seed-house.tsx app/routes/project-detail-v2.tsx app/styles/r96-pilot-readiness.css
          git diff --cached --quiet || git commit -m "style: format R96.2 project and pilot surfaces"
          git push origin HEAD:r96-project-detail-pilot-console

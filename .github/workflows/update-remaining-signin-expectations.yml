name: Update Remaining Signin Expectations

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Update remaining browser expectations
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("tests/e2e/public-journey.spec.ts"): [
                  (r"/\/login\?returnTo=%2Fapp$/", r"/\/signin\?returnTo=%2Fapp$/", 1),
                  (r"/\/login/", r"/\/signin/", 1),
              ],
              Path("tests/e2e/production-command-centre.spec.ts"): [
                  (
                      r"/\/login\?returnTo=%2Fadmin%2Fproduction$/",
                      r"/\/signin\?returnTo=%2Fadmin%2Fproduction$/",
                      1,
                  ),
              ],
          }

          for path, operations in replacements.items():
              text = path.read_text()
              for old, new, expected in operations:
                  count = text.count(old)
                  if count != expected:
                      raise SystemExit(
                          f"{path}: expected {expected} occurrence(s) of {old}, found {count}."
                      )
                  text = text.replace(old, new)
              path.write_text(text)
          PY
          npx prettier --write tests/e2e/public-journey.spec.ts tests/e2e/production-command-centre.spec.ts
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - name: Commit updated expectations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/public-journey.spec.ts tests/e2e/production-command-centre.spec.ts
          if git diff --cached --quiet; then
            echo "No expectation changes required."
          else
            git commit -m "Update remaining browser expectations for signin"
            git push
          fi

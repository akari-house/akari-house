name: R89 Force Apply

on:
  push:
    branches:
      - r89-profile-card-credibility

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r89-profile-card-credibility
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply robust R89 source patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/components/ProfileShareCard.tsx')
          css_path = Path('app/styles/profile-card-glass.css')
          test_path = Path('tests/unit/profile-card-completion.test.ts')
          text = path.read_text()

          if 'function profileCardCode(' not in text:
            pat = r'(function titleCaseRole\(role: string\) \{\s+return role \? role\[0\]\.toUpperCase\(\) \+ role\.slice\(1\) : role;\s+\})'
            helper = r'''\1

function profileCardCode(username: string) {
  const clean = username.toUpperCase().replace(/[^A-Z0-9]/g, "");
  const prefix = clean.slice(0, 4).padEnd(4, "X");
  let hash = 2166136261;
  for (const character of username) {
    hash ^= character.charCodeAt(0);
    hash = Math.imul(hash, 16777619) >>> 0;
  }
  const suffix = hash.toString(36).toUpperCase().padStart(7, "0").slice(-7);
  return `AKARI-${prefix}-${suffix}`;
}

function barcodePattern(value: string) {
  const codes = [...value].map((character) => character.charCodeAt(0));
  return Array.from({ length: 54 }, (_, index) => {
    const code = codes[index % Math.max(codes.length, 1)] ?? 65;
    return { width: 1 + ((code + index * 5) % 3), gap: 1 + ((code + index * 7) % 2) };
  });
}

function ProfileBarcode({ value }: { value: string }) {
  const bars = barcodePattern(value);
  const total = bars.reduce((sum, bar) => sum + bar.width + bar.gap, 0);
  let cursor = 0;
  return (
    <svg viewBox={`0 0 ${total} 32`} preserveAspectRatio="none" aria-hidden="true" focusable="false">
      {bars.map((bar, index) => {
        const x = cursor;
        cursor += bar.width + bar.gap;
        const inset = index % 7 === 0 ? 3 : index % 5 === 0 ? 1.5 : 0;
        return <rect key={`${x}-${index}`} x={x} y={inset} width={bar.width} height={32 - inset * 2} rx={0.2} />;
      })}
    </svg>
  );
}'''
            text, n = re.subn(pat, helper, text, count=1)
            assert n == 1, 'profile helper insertion failed'

          if 'function drawBarcode(' not in text:
            marker = 'function drawSocialMark('
            assert marker in text
            helper = '''function drawBarcode(
  ctx: CanvasRenderingContext2D,
  value: string,
  x: number,
  y: number,
  width: number,
  height: number,
  colour: string,
) {
  const bars = barcodePattern(value);
  const total = bars.reduce((sum, bar) => sum + bar.width + bar.gap, 0);
  const scale = width / total;
  let cursor = 0;
  ctx.save();
  ctx.fillStyle = colour;
  bars.forEach((bar, index) => {
    const inset = index % 7 === 0 ? 7 : index % 5 === 0 ? 3 : 0;
    ctx.fillRect(x + cursor * scale, y + inset, Math.max(1.2, bar.width * scale), height - inset * 2);
    cursor += bar.width + bar.gap;
  });
  ctx.restore();
}

'''
            text = text.replace(marker, helper + marker, 1)

          # Add stable AKARI profile code to canvas area.
          before_export, after_export = text.split('export function ProfileShareCard', 1)
          if 'const profileCode = profileCardCode(model.username);' not in before_export:
            pat = r'(const opportunities =\s*model\.opportunityStats\.created \+ model\.opportunityStats\.received;\s*)'
            before_export, n = re.subn(pat, r'\1  const profileCode = profileCardCode(model.username);\n', before_export, count=1)
            assert n == 1, 'canvas profile code insertion failed'
          text = before_export + 'export function ProfileShareCard' + after_export

          # Replace canvas profile-link panel.
          if 'ctx.fillText("PROFILE LINK"' in text:
            pat = r'  roundedRect\(ctx, 1190, 260, 280, 310, 38\);.*?  ctx\.textAlign = "left";\n'
            replacement = '''  roundedRect(ctx, 1190, 260, 280, 310, 38);
  ctx.fillStyle = palette.surface;
  ctx.fill();
  ctx.strokeStyle = `${palette.accent}99`;
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = palette.accent;
  ctx.font = "700 17px Inter, sans-serif";
  ctx.fillText("AKARI ID", 1230, 314);
  drawBarcode(ctx, profileCode, 1222, 344, 216, 76, palette.ink);
  ctx.fillStyle = palette.ink;
  ctx.font = "700 16px Inter, sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(profileCode, 1330, 455);
  ctx.font = "650 20px Inter, sans-serif";
  ctx.fillText("Connect on AKARI", 1330, 493);
  ctx.font = "500 14px Inter, sans-serif";
  ctx.globalAlpha = 0.66;
  ctx.fillText(canonicalUrl.slice(0, 34), 1330, 526);
  ctx.globalAlpha = 1;
  ctx.textAlign = "left";
'''
            text, n = re.subn(pat, replacement, text, count=1, flags=re.S)
            assert n == 1, 'canvas identity panel replacement failed'

          if '[formatProfileReach(model.followerCount), "REACH"]' in text:
            pat = r'  const metrics = \[.*?  \] as const;\s+  roundedRect\(ctx, 115, 625, 1010, 116, 30\);.*?  \}\);\n\n  roundedRect\(ctx, 115, 765, 1010, 104, 28\);'
            replacement = '''  const metrics = [
    [String(opportunities), "OPPORTUNITIES"],
    [formatProfileReach(model.followerCount), "SOCIAL REACH"],
    [String(model.socials.length), "CONNECTED SOCIALS"],
    [model.percentile.topPercent ? `TOP ${model.percentile.topPercent}%` : "BUILDING", "AKARI SIGNAL"],
  ] as const;
  roundedRect(ctx, 115, 625, 1010, 116, 30);
  ctx.fillStyle = palette.surface;
  ctx.fill();
  ctx.strokeStyle = `${palette.ink}2f`;
  ctx.lineWidth = 1.5;
  ctx.stroke();
  metrics.forEach(([value, label], index) => {
    const x = 150 + index * 245;
    ctx.fillStyle = index % 2 === 0 ? palette.highlight : palette.accent;
    ctx.font = "750 28px Inter, sans-serif";
    ctx.fillText(value, x, 677);
    ctx.fillStyle = palette.ink;
    ctx.globalAlpha = 0.65;
    ctx.font = "700 12px Inter, sans-serif";
    ctx.fillText(label, x, 708);
    ctx.globalAlpha = 1;
  });

  roundedRect(ctx, 115, 765, 1010, 104, 28);'''
            text, n = re.subn(pat, replacement, text, count=1, flags=re.S)
            assert n == 1, 'canvas metrics replacement failed'

          # Add profile code inside interactive component (second opportunity total).
          before_export, after_export = text.split('export function ProfileShareCard', 1)
          if 'const profileCode = profileCardCode(model.username);' not in after_export:
            pat = r'(const opportunities =\s*model\.opportunityStats\.created \+ model\.opportunityStats\.received;\s*)'
            after_export, n = re.subn(pat, r'\1  const profileCode = profileCardCode(model.username);\n', after_export, count=1)
            assert n == 1, 'component profile code insertion failed'
          text = before_export + 'export function ProfileShareCard' + after_export

          text = re.sub(
            r'A premium AKARI credit-card profile built from your real member\s+data\. Choose your glass color, control private details, then\s+download or share\.',
            'A premium AKARI member card built from your real member data.\n            Choose your glass color, control what stays public, then download\n            or share.',
            text,
            count=1,
          )

          if 'aria-label="Profile link"' in text:
            pat = r'              <div className="glass-profile-link" aria-label="Profile link">.*?              </div>\n            </div>'
            replacement = '''              <div className="glass-profile-link" aria-label="AKARI identity code">
                <small>AKARI ID</small>
                <span className="glass-profile-barcode" aria-hidden="true">
                  <ProfileBarcode value={profileCode} />
                </span>
                <strong>{profileCode}</strong>
                <span>{canonicalUrl}</span>
              </div>
            </div>'''
            text, n = re.subn(pat, replacement, text, count=1, flags=re.S)
            assert n == 1, 'interactive identity panel replacement failed'

          if '<span>Reach</span>' in text:
            pat = r'            <div className="share-card-metrics glass-card-metrics">.*?            </div>\n\n            <div className="glass-connect-strip">'
            replacement = '''            <div className="share-card-metrics glass-card-metrics" aria-label="Profile credibility signals">
              <div><strong>{opportunities}</strong><span>Opportunities</span></div>
              <div><strong>{formatProfileReach(model.followerCount)}</strong><span>Social reach</span></div>
              <div><strong>{model.socials.length}</strong><span>Connected socials</span></div>
              <div>
                <strong>{model.percentile.topPercent ? `Top ${model.percentile.topPercent}%` : "Building"}</strong>
                <span>AKARI signal</span>
              </div>
            </div>

            <div className="glass-connect-strip">'''
            text, n = re.subn(pat, replacement, text, count=1, flags=re.S)
            assert n == 1, 'interactive metrics replacement failed'

          if 'Credit-card format' in text:
            pat = r'          <div className="glass-card-note">.*?          </div>\n          <p className="share-card-confidence">.*?          </p>'
            replacement = '''          <div className="glass-card-note">
            <strong>Built for sharing.</strong>
            <span>Export as PNG and share your AKARI identity anywhere.</span>
          </div>
          <p className="share-card-confidence">
            {model.percentile.confidence === "verified"
              ? "Credibility signals use verified member data."
              : model.percentile.confidence === "provisional"
                ? "Credibility signals include member-reported data."
                : "Credibility signals grow as more comparable member data becomes available."}
          </p>'''
            text, n = re.subn(pat, replacement, text, count=1, flags=re.S)
            assert n == 1, 'card note replacement failed'

          text = text.replace('A private ecosystem for high-signal connections.', 'A private membership for high-signal connections.')
          assert 'credit-card profile' not in text
          assert 'Credit-card format' not in text
          assert 'Profile credibility signals' in text
          assert 'glass-profile-barcode' in text
          path.write_text(text)

          css = css_path.read_text()
          css = css.replace('content: "A private ecosystem for high-signal connections.";', 'content: "A private membership for high-signal connections.";')
          if '/* R89 credibility */' not in css:
            css += '''

/* R89 credibility */
.glass-profile-barcode {
  width: 82%; height: clamp(1.55rem, 5.3cqi, 3.5rem); margin: 0.15cqi 0 0.35cqi;
  display: block; overflow: hidden; border-radius: clamp(3px, 0.7cqi, 7px);
  color: var(--card-ink); background: color-mix(in srgb, var(--card-ink) 7%, transparent);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--card-ink) 13%, transparent);
}
.glass-profile-barcode svg { width: 100%; height: 100%; display: block; fill: currentColor; }
.glass-profile-link { gap: clamp(0.16rem, 0.48cqi, 0.34rem); }
.glass-profile-link small { margin-top: 0; }
.glass-profile-link strong { max-width: 100%; overflow: hidden; color: var(--card-ink); font-size: clamp(0.38rem, 0.9cqi, 0.58rem); letter-spacing: 0.035em; text-overflow: ellipsis; white-space: nowrap; }
.glass-card-metrics { grid-template-columns: repeat(4, minmax(0, 1fr)); padding-inline: 1.5cqi; }
.glass-card-metrics > div { min-width: 0; padding-inline: 0.8cqi; }
.glass-card-metrics > div + div { border-left: 1px solid color-mix(in srgb, var(--card-ink) 18%, transparent); }
.glass-card-metrics strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.glass-card-metrics span { overflow: hidden; font-size: clamp(0.34rem, 0.72cqi, 0.48rem); text-overflow: ellipsis; white-space: nowrap; }
.glass-card-socials a { border-color: color-mix(in srgb, var(--card-ink) 42%, transparent); background: color-mix(in srgb, var(--card-bg) 62%, var(--card-surface)); }
.glass-card-note strong { font-weight: 800; }
@media (max-width: 700px) {
  .glass-profile-barcode { height: 4.6cqi; }
  .glass-card-metrics { padding-inline: 0.9cqi; }
  .glass-card-metrics > div { padding-inline: 0.4cqi; }
  .glass-card-metrics span { font-size: 0.69cqi; letter-spacing: 0.01em; }
}
'''
          css_path.write_text(css)

          test = test_path.read_text()
          test = test.replace('renders the requested credit-card identity and privacy features', 'renders the requested shareable identity and privacy features')
          if 'Profile credibility signals' not in test:
            needle = '    expect(component).toContain("Connected social platforms");\n'
            assert needle in test
            test = test.replace(needle, needle + '    expect(component).toContain("glass-profile-barcode");\n    expect(component).toContain("Profile credibility signals");\n    expect(component).toContain("Built for sharing.");\n    expect(component).not.toContain("credit-card profile");\n', 1)
          test_path.write_text(test)
          PY
      - name: Format product files
        run: npx prettier --write app/components/ProfileShareCard.tsx app/styles/profile-card-glass.css tests/unit/profile-card-completion.test.ts
      - name: Commit product patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/ProfileShareCard.tsx app/styles/profile-card-glass.css tests/unit/profile-card-completion.test.ts
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "R89: upgrade profile sharing card"
            git push origin HEAD:r89-profile-card-credibility
          fi

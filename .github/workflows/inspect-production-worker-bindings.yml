name: Inspect Production Worker Bindings

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Collect active deployment and resource information
        run: |
          set -euo pipefail
          mkdir -p worker-binding-diagnostic
          npx wrangler d1 list --json > worker-binding-diagnostic/d1-list.json
          npx wrangler deployments status --name akari-house --json > worker-binding-diagnostic/deployment-status.json
          npx wrangler versions list --name akari-house --json > worker-binding-diagnostic/versions-list.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const read = (path) => JSON.parse(fs.readFileSync(path, "utf8"));
          const deployment = read("worker-binding-diagnostic/deployment-status.json");
          const versions = read("worker-binding-diagnostic/versions-list.json");
          const ids = new Set();
          const visit = (value) => {
            if (!value || typeof value !== "object") return;
            if (Array.isArray(value)) {
              for (const item of value) visit(item);
              return;
            }
            for (const [key, child] of Object.entries(value)) {
              if (
                typeof child === "string" &&
                /version.*id|id.*version/i.test(key) &&
                /^[0-9a-f-]{20,}$/i.test(child)
              ) ids.add(child);
              visit(child);
            }
          };
          visit(deployment);
          if (ids.size === 0) {
            const candidates = Array.isArray(versions) ? versions : versions.result ?? [];
            for (const candidate of candidates.slice(0, 3)) {
              const id = candidate.id ?? candidate.version_id;
              if (id) ids.add(id);
            }
          }
          fs.writeFileSync(
            "worker-binding-diagnostic/version-ids.json",
            `${JSON.stringify([...ids], null, 2)}\n`,
          );
          NODE
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { execFileSync } from "node:child_process";
          const ids = JSON.parse(fs.readFileSync("worker-binding-diagnostic/version-ids.json", "utf8"));
          const details = [];
          for (const id of ids) {
            const output = execFileSync(
              "npx",
              ["wrangler", "versions", "view", id, "--name", "akari-house", "--json"],
              { encoding: "utf8" },
            );
            details.push(JSON.parse(output));
          }
          fs.writeFileSync(
            "worker-binding-diagnostic/version-details.json",
            `${JSON.stringify(details, null, 2)}\n`,
          );
          NODE
      - name: Build sanitised binding comparison
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const d1Payload = JSON.parse(fs.readFileSync("worker-binding-diagnostic/d1-list.json", "utf8"));
          const databases = Array.isArray(d1Payload) ? d1Payload : d1Payload.result ?? [];
          const expected = databases.find((entry) =>
            [entry.name, entry.database_name].includes("akari-house-db"),
          );
          const expectedId = expected?.uuid ?? expected?.database_id ?? expected?.id ?? null;
          const versions = JSON.parse(fs.readFileSync("worker-binding-diagnostic/version-details.json", "utf8"));

          const collectBindings = (value, collected = []) => {
            if (!value || typeof value !== "object") return collected;
            if (Array.isArray(value)) {
              for (const item of value) collectBindings(item, collected);
              return collected;
            }
            if (Array.isArray(value.bindings)) {
              for (const binding of value.bindings) {
                collected.push({
                  name: binding.name ?? binding.binding ?? null,
                  type: binding.type ?? null,
                  id:
                    binding.id ??
                    binding.database_id ??
                    binding.namespace_id ??
                    binding.bucket_name ??
                    null,
                });
              }
            }
            for (const child of Object.values(value)) collectBindings(child, collected);
            return collected;
          };

          const versionSummaries = versions.map((version) => {
            const bindings = collectBindings(version);
            const d1Bindings = bindings.filter(
              (binding) =>
                binding.name === "DB" ||
                String(binding.type).toLowerCase().includes("d1"),
            );
            return {
              versionId: version.id ?? version.result?.id ?? null,
              d1Bindings,
              allBindings: bindings,
            };
          });
          const boundIds = versionSummaries.flatMap((entry) =>
            entry.d1Bindings.map((binding) => binding.id).filter(Boolean),
          );
          const report = {
            expectedProductionDatabaseName: "akari-house-db",
            expectedProductionDatabaseId: expectedId,
            activeVersions: versionSummaries,
            productionDatabaseBound: Boolean(expectedId && boundIds.includes(expectedId)),
          };
          fs.writeFileSync(
            "worker-binding-diagnostic/summary.json",
            `${JSON.stringify(report, null, 2)}\n`,
          );
          console.log(JSON.stringify(report, null, 2));
          NODE
      - name: Upload Worker binding diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-worker-binding-diagnostic-${{ github.sha }}
          path: worker-binding-diagnostic
          retention-days: 7
          if-no-files-found: error

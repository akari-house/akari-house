name: Remove Shared Fixture Test

on:
  push:
    branches:
      - agent/connect-investor-profile-deals
    paths:
      - .github/workflows/remove-shared-fixture-test.yml

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/connect-investor-profile-deals
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Remove duplicate fixture-dependent journey
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/e2e/curated-opportunities.spec.ts")
          content = path.read_text()
          start_marker = '  test("Investor profile powers catalogue matching and workspace menus", async ({\n'
          end_marker = '  test("approved Investor receives only the authorised private room", async ({\n'
          start = content.index(start_marker)
          end = content.index(end_marker, start)
          path.write_text(content[:start] + content[end:])
          PY
          rm .github/workflows/remove-shared-fixture-test.yml
      - run: npm run format
      - run: npm run typecheck
      - run: npm test -- --run tests/investor-deal-matching.test.ts tests/public-directory-resilience.test.ts
      - name: Commit fixture isolation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep Deal Room browser fixtures isolated"
          git push origin HEAD:agent/connect-investor-profile-deals

name: Format Launch Gate Coverage

on:
  pull_request:
    paths:
      - ".github/workflows/format-launch-gate-coverage.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write app/routes/test-persona.ts tests/e2e/launch-gate.spec.ts scripts/build-launch-gate-report.mjs
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/routes/test-persona.ts tests/e2e/launch-gate.spec.ts scripts/build-launch-gate-report.mjs
          git commit -m "Format complete launch gate coverage"
          git push

name: Format IIO Commitment

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'agent/separate-iio-engagement'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write app/lib/campaign-delivery.ts app/routes/admin-campaigns.tsx tests/campaign-delivery.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/campaign-delivery.ts app/routes/admin-campaigns.tsx tests/campaign-delivery.test.ts
          git commit -m "Format IIO commitment separation"
          git push origin HEAD:${{ github.head_ref }}

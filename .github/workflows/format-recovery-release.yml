name: Format Recovery Release

on:
  pull_request:
    paths:
      - ".github/workflows/format-recovery-release.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply project formatting
        run: |
          npx prettier --write \
            .github/workflows/d1-recovery-drill.yml \
            app/lib/delivery-outbox.server.ts \
            app/lib/google-export-delivery.server.ts \
            app/lib/operational-resilience-schema.server.ts \
            app/lib/operational-resilience.server.ts \
            app/lib/r2-lifecycle.server.ts \
            app/lib/scheduled-jobs.ts \
            app/routes/admin-iio-detail.tsx \
            app/routes/admin-operations.tsx \
            app/routes/admin-resilience.tsx \
            app/routes/dashboard.tsx \
            app/routes/project-edit.tsx \
            scripts/recovery/backup-crypto.mjs \
            scripts/recovery/validate-restore.mjs \
            tests/unit/recovery-backup.test.ts \
            tests/unit/scheduled-jobs.test.ts \
            worker/index.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github app scripts tests worker
          git commit -m "Format recovery automation release"
          git push

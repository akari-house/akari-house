name: R76G Format

on:
  push:
    branches:
      - feature/r76g-activation-analytics-review-inbox
    paths:
      - .github/workflows/r76g-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/r76g-activation-analytics-review-inbox
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: >-
          npx prettier --write
          app/lib/activation-analytics.server.ts
          app/lib/admin-workspace.ts
          app/routes/activation-events.ts
          app/routes/admin-activation.tsx
          app/routes/admin-review-inbox.tsx
          tests/activation-analytics.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/activation-analytics.server.ts app/lib/admin-workspace.ts app/routes/activation-events.ts app/routes/admin-activation.tsx app/routes/admin-review-inbox.tsx tests/activation-analytics.test.ts
          git diff --cached --quiet || git commit -m "R76G apply repository formatting"
          git push origin HEAD:feature/r76g-activation-analytics-review-inbox

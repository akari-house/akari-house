name: Diagnose Worker Login E2E

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run login journey and report the result
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          npx playwright test tests/e2e/public-journey.spec.ts --project=desktop-chromium --reporter=line > login-e2e.log 2>&1
          code=$?
          {
            echo "## Focused login E2E diagnostic"
            echo
            echo '```text'
            tail -n 140 login-e2e.log
            echo '```'
          } > login-e2e-comment.md
          gh pr comment "$PR_NUMBER" --body-file login-e2e-comment.md
          exit "$code"

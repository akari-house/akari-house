name: Diagnose Worker Login E2E

on:
  pull_request:
    branches: [main]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run login journey only
        run: npx playwright test tests/e2e/public-journey.spec.ts --project=desktop-chromium --reporter=line

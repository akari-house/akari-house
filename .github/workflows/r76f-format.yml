name: R76F Format

on:
  push:
    branches:
      - feature/r76f-activation-next-action
    paths:
      - .github/workflows/r76f-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/r76f-activation-next-action
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/e2e/launch-visual-evidence.spec.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/launch-visual-evidence.spec.ts
          git diff --cached --quiet || git commit -m "R76F format launch evidence"
          git push origin HEAD:feature/r76f-activation-next-action

name: Apply Shared Deal Room Section Import

on:
  push:
    branches: [fix/complete-investor-deals-room]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply shared Deal Room section import') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/complete-investor-deals-room
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/split-opportunity-section-import.mjs
      - run: npm run format
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/routes/opportunity-manage.tsx app/lib/opportunity-sections.ts app/lib/opportunity-sections.server.ts
          if git diff --cached --quiet; then
            echo "No shared section import changes required."
          else
            git commit -m "Apply shared Deal Room section import"
            git push
          fi

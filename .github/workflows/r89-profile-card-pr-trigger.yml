name: R89 Profile Card PR Trigger

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'r89-profile-card-credibility' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r89-profile-card-credibility
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Extract and run R89 implementation script
        run: |
          awk '
            /^[[:space:]]+python - <<'\''PY'\''$/ { in_script=1; next }
            /^[[:space:]]+PY$/ && in_script { exit }
            in_script { sub(/^          /, ""); print }
          ' .github/workflows/r89-profile-card-apply.yml > /tmp/r89-apply.py
          python /tmp/r89-apply.py
      - name: Format changed files
        run: npx prettier --write app/components/ProfileShareCard.tsx app/styles/profile-card-glass.css tests/unit/profile-card-completion.test.ts
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/ProfileShareCard.tsx app/styles/profile-card-glass.css tests/unit/profile-card-completion.test.ts
          git commit -m "R89: upgrade profile sharing card credibility"
          git push origin HEAD:r89-profile-card-credibility

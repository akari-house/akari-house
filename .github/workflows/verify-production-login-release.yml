name: Verify Production Login Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-production-login-release
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Wait for and verify the exact Worker login release
        run: |
          set -euo pipefail
          expected=$(node - <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('app/lib/public-login-fallback.server.ts', 'utf8');
          const match = source.match(/publicLoginRelease\s*=\s*"([^"]+)"/);
          if (!match) {
            console.error('Could not derive publicLoginRelease from source.');
            process.exit(1);
          }
          process.stdout.write(match[1]);
          NODE
          )
          base="https://akarihouse.com"

          for attempt in $(seq 1 48); do
            headers=$(mktemp)
            body=$(mktemp)
            status=$(curl -sS --max-time 20 -D "$headers" -o "$body" -w '%{http_code}' "$base/login" || true)
            release=$(awk 'BEGIN{IGNORECASE=1} /^x-akari-login-release:/ {gsub("\r",""); sub(/^[^:]+:[[:space:]]*/,""); print; exit}' "$headers")
            if [ "$status" = "200" ] && [ "$release" = "$expected" ] && grep -q 'Return to the House' "$body"; then
              rm -f "$headers" "$body"
              break
            fi
            rm -f "$headers" "$body"
            if [ "$attempt" = "48" ]; then
              echo "Custom domain did not serve the expected login release. status=$status release=$release expected=$expected"
              exit 1
            fi
            sleep 10
          done

          headers=$(mktemp)
          body=$(mktemp)
          status=$(curl -sS --max-time 20 -D "$headers" -o "$body" -w '%{http_code}' \
            -X POST "$base/login" \
            -H "Origin: $base" \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data 'email=login-audit%40example.com&password=not-a-real-password')
          release=$(awk 'BEGIN{IGNORECASE=1} /^x-akari-login-release:/ {gsub("\r",""); sub(/^[^:]+:[[:space:]]*/,""); print; exit}' "$headers")
          result=$(awk 'BEGIN{IGNORECASE=1} /^x-akari-login-result:/ {gsub("\r",""); sub(/^[^:]+:[[:space:]]*/,""); print; exit}' "$headers")
          stage=$(awk 'BEGIN{IGNORECASE=1} /^x-akari-login-stage:/ {gsub("\r",""); sub(/^[^:]+:[[:space:]]*/,""); print; exit}' "$headers")

          test "$release" = "$expected"
          test "$result" = "error"
          test "$stage" = "security"
          test "$status" = "403"
          grep -q 'Complete the security check and try again.' "$body"
          ! grep -qi 'The lantern went out unexpectedly' "$body"

          echo "Verified GET and POST /login on the custom domain for release $release."
          rm -f "$headers" "$body"

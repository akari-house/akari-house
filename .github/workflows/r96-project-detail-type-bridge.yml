name: R96 Project Detail Type Bridge

on:
  push:
    branches:
      - r96-project-detail-pilot-console

permissions:
  contents: write

jobs:
  bridge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r96-project-detail-pilot-console
      - name: Point legacy project module at active route types
        run: sed -i 's#./+types/project-detail#./+types/project-detail-v2#' app/routes/project-detail.tsx
      - name: Commit type bridge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/routes/project-detail.tsx
          git diff --cached --quiet || git commit -m "fix: bridge legacy project detail route types"
          git push origin HEAD:r96-project-detail-pilot-console

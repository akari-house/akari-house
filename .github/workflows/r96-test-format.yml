name: R96 Test Format

on:
  push:
    branches:
      - r96-project-detail-pilot-console

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r96-project-detail-pilot-console
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/r96-project-detail-pilot-console.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/r96-project-detail-pilot-console.test.ts
          git diff --cached --quiet || git commit -m "style: format R96.2 regression test"
          git push origin HEAD:r96-project-detail-pilot-console

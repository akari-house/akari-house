name: Apply launch finalization

on:
  push:
    branches:
      - agent/complete-launch-gate-and-pilot
    paths:
      - scripts/patch-launch-finalization.py
      - .github/workflows/apply-launch-finalization.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/patch-launch-finalization.py
      - .github/workflows/apply-launch-finalization.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-launch-gate-and-pilot
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply final launch patches
        run: python scripts/patch-launch-finalization.py
      - name: Remove temporary and obsolete patch tooling
        run: |
          rm -f scripts/patch-launch-finalization.py
          rm -f .github/workflows/apply-launch-finalization.yml
          rm -f .github/workflows/apply-launch-completion.yml
          rm -f .github/launch-completion-trigger
          rm -f .github/launch-completion-diagnostics.log
          rm -rf .github/launch-completion-parts
      - run: npm ci
      - name: Format changed files
        run: |
          npx prettier --write \
            app/routes.ts \
            app/routes/test-persona.ts \
            app/routes/test-launch-security.ts \
            app/routes/admin-moderation.tsx \
            app/routes/admin-launch-gate.tsx \
            app/routes/health.ts \
            app/lib/launch-gate.ts \
            tests/e2e/launch-gate-security.spec.ts \
            scripts/build-launch-gate-report.mjs \
            scripts/production-smoke.mjs \
            .github/workflows/launch-gate-preview.yml \
            .github/workflows/launch-gate-production.yml \
            docs/operations/production-launch-audit.md \
            docs/operations/controlled-iio-pilot.md \
            README.md
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Commit verified launch finalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete launch security and pilot operations"
          git push origin HEAD:agent/complete-launch-gate-and-pilot

name: R76 Dependency Audit
on:
  push:
    branches:
      - r76-security-production-hardening
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Capture npm audit
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit.json
          status=$?
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('npm-audit.json','utf8'));
          console.log(JSON.stringify({metadata: report.metadata, vulnerabilities: report.vulnerabilities}, null, 2));
          NODE
          echo "npm audit exit code: $status"
          exit 0

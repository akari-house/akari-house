name: R89 Profile Card Apply

on:
  push:
    branches:
      - r89-profile-card-credibility

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r89-profile-card-credibility
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply approved profile card design
        run: |
          python - <<'PY'
          from pathlib import Path

          component_path = Path('app/components/ProfileShareCard.tsx')
          styles_path = Path('app/styles/profile-card-glass.css')
          test_path = Path('tests/unit/profile-card-completion.test.ts')

          component = component_path.read_text()

          anchor = '''function titleCaseRole(role: string) {
            return role ? role[0].toUpperCase() + role.slice(1) : role;
          }
          '''
          helpers = '''function titleCaseRole(role: string) {
            return role ? role[0].toUpperCase() + role.slice(1) : role;
          }

          function profileCardCode(username: string) {
            const clean = username.toUpperCase().replace(/[^A-Z0-9]/g, "");
            const prefix = clean.slice(0, 4).padEnd(4, "X");
            let hash = 2166136261;
            for (const character of username) {
              hash ^= character.charCodeAt(0);
              hash = Math.imul(hash, 16777619) >>> 0;
            }
            const suffix = hash
              .toString(36)
              .toUpperCase()
              .padStart(7, "0")
              .slice(-7);
            return `AKARI-${prefix}-${suffix}`;
          }

          function barcodePattern(value: string) {
            const codes = [...value].map((character) => character.charCodeAt(0));
            return Array.from({ length: 54 }, (_, index) => {
              const code = codes[index % Math.max(codes.length, 1)] ?? 65;
              return {
                width: 1 + ((code + index * 5) % 3),
                gap: 1 + ((code + index * 7) % 2),
              };
            });
          }

          function ProfileBarcode({ value }: { value: string }) {
            const bars = barcodePattern(value);
            const total = bars.reduce((sum, bar) => sum + bar.width + bar.gap, 0);
            let cursor = 0;
            return (
              <svg
                viewBox={`0 0 ${total} 32`}
                preserveAspectRatio="none"
                aria-hidden="true"
                focusable="false"
              >
                {bars.map((bar, index) => {
                  const x = cursor;
                  cursor += bar.width + bar.gap;
                  const inset = index % 7 === 0 ? 3 : index % 5 === 0 ? 1.5 : 0;
                  return (
                    <rect
                      key={`${x}-${index}`}
                      x={x}
                      y={inset}
                      width={bar.width}
                      height={32 - inset * 2}
                      rx={0.2}
                    />
                  );
                })}
              </svg>
            );
          }
          '''
          assert anchor in component
          component = component.replace(anchor, helpers, 1)

          rounded_anchor = '''function roundedRect(
            ctx: CanvasRenderingContext2D,
            x: number,
            y: number,
            width: number,
            height: number,
            radius: number,
          ) {
            ctx.beginPath();
            ctx.roundRect(x, y, width, height, radius);
          }
          '''
          rounded_replacement = rounded_anchor + '''
          function drawBarcode(
            ctx: CanvasRenderingContext2D,
            value: string,
            x: number,
            y: number,
            width: number,
            height: number,
            colour: string,
          ) {
            const bars = barcodePattern(value);
            const total = bars.reduce((sum, bar) => sum + bar.width + bar.gap, 0);
            const scale = width / total;
            let cursor = 0;
            ctx.save();
            ctx.fillStyle = colour;
            bars.forEach((bar, index) => {
              const inset = index % 7 === 0 ? 7 : index % 5 === 0 ? 3 : 0;
              ctx.fillRect(
                x + cursor * scale,
                y + inset,
                Math.max(1.2, bar.width * scale),
                height - inset * 2,
              );
              cursor += bar.width + bar.gap;
            });
            ctx.restore();
          }
          '''
          assert rounded_anchor in component
          component = component.replace(rounded_anchor, rounded_replacement, 1)

          canvas_opportunity = '''  const opportunities =
            model.opportunityStats.created + model.opportunityStats.received;
          const canonicalUrl ='''
          canvas_opportunity_replacement = '''  const opportunities =
            model.opportunityStats.created + model.opportunityStats.received;
          const profileCode = profileCardCode(model.username);
          const canonicalUrl ='''
          assert canvas_opportunity in component
          component = component.replace(canvas_opportunity, canvas_opportunity_replacement, 1)

          old_canvas_link = '''  roundedRect(ctx, 1190, 260, 280, 310, 38);
          ctx.fillStyle = palette.surface;
          ctx.fill();
          ctx.strokeStyle = `${palette.accent}99`;
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.fillStyle = palette.accent;
          ctx.font = "700 17px Inter, sans-serif";
          ctx.fillText("PROFILE LINK", 1230, 320);
          try {
            const flower = await loadImage("/assets/brand/akari-flower-mark.png");
            ctx.drawImage(flower, 1278, 345, 100, 100);
          } catch {
            // Brand mark is decorative here.
          }
          ctx.fillStyle = palette.ink;
          ctx.font = "650 21px Inter, sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("Connect on AKARI", 1330, 480);
          ctx.font = "500 15px Inter, sans-serif";
          ctx.globalAlpha = 0.72;
          ctx.fillText(canonicalUrl.slice(0, 34), 1330, 514);
          ctx.globalAlpha = 1;
          ctx.textAlign = "left";
          '''
          new_canvas_link = '''  roundedRect(ctx, 1190, 260, 280, 310, 38);
          ctx.fillStyle = palette.surface;
          ctx.fill();
          ctx.strokeStyle = `${palette.accent}99`;
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.fillStyle = palette.accent;
          ctx.font = "700 17px Inter, sans-serif";
          ctx.fillText("AKARI ID", 1230, 314);
          drawBarcode(ctx, profileCode, 1222, 344, 216, 76, palette.ink);
          ctx.fillStyle = palette.ink;
          ctx.font = "700 16px Inter, sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(profileCode, 1330, 455);
          ctx.font = "650 20px Inter, sans-serif";
          ctx.fillText("Connect on AKARI", 1330, 493);
          ctx.font = "500 14px Inter, sans-serif";
          ctx.globalAlpha = 0.66;
          ctx.fillText(canonicalUrl.slice(0, 34), 1330, 526);
          ctx.globalAlpha = 1;
          ctx.textAlign = "left";
          '''
          assert old_canvas_link in component
          component = component.replace(old_canvas_link, new_canvas_link, 1)

          old_metrics = '''  const metrics = [
            [String(opportunities), "OPPORTUNITIES"],
            [formatProfileReach(model.followerCount), "REACH"],
            [
              model.percentile.topPercent
                ? `TOP ${model.percentile.topPercent}%`
                : "BUILDING",
              "SIGNAL",
            ],
          ] as const;
          roundedRect(ctx, 115, 625, 1010, 116, 30);
          ctx.fillStyle = palette.surface;
          ctx.fill();
          ctx.strokeStyle = `${palette.ink}2f`;
          ctx.lineWidth = 1.5;
          ctx.stroke();
          metrics.forEach(([value, label], index) => {
            const x = 165 + index * 315;
            ctx.fillStyle = index === 0 ? palette.highlight : palette.accent;
            ctx.font = "750 29px Inter, sans-serif";
            ctx.fillText(value, x, 677);
            ctx.fillStyle = palette.ink;
            ctx.globalAlpha = 0.65;
            ctx.font = "700 13px Inter, sans-serif";
            ctx.fillText(label, x, 708);
            ctx.globalAlpha = 1;
          });
          '''
          new_metrics = '''  const metrics = [
            [String(opportunities), "OPPORTUNITIES"],
            [formatProfileReach(model.followerCount), "SOCIAL REACH"],
            [String(model.socials.length), "CONNECTED SOCIALS"],
            [
              model.percentile.topPercent
                ? `TOP ${model.percentile.topPercent}%`
                : "BUILDING",
              "AKARI SIGNAL",
            ],
          ] as const;
          roundedRect(ctx, 115, 625, 1010, 116, 30);
          ctx.fillStyle = palette.surface;
          ctx.fill();
          ctx.strokeStyle = `${palette.ink}2f`;
          ctx.lineWidth = 1.5;
          ctx.stroke();
          metrics.forEach(([value, label], index) => {
            const x = 150 + index * 245;
            ctx.fillStyle = index % 2 === 0 ? palette.highlight : palette.accent;
            ctx.font = "750 28px Inter, sans-serif";
            ctx.fillText(value, x, 677);
            ctx.fillStyle = palette.ink;
            ctx.globalAlpha = 0.65;
            ctx.font = "700 12px Inter, sans-serif";
            ctx.fillText(label, x, 708);
            ctx.globalAlpha = 1;
          });
          '''
          assert old_metrics in component
          component = component.replace(old_metrics, new_metrics, 1)

          component = component.replace(
            'ctx.fillText("A private ecosystem for high-signal connections.", 1470, 925);',
            'ctx.fillText("A private membership for high-signal connections.", 1470, 925);',
            1,
          )

          component_opportunity = '''  const opportunities =
            model.opportunityStats.created + model.opportunityStats.received;

          function updateLanguages'''
          component_opportunity_replacement = '''  const opportunities =
            model.opportunityStats.created + model.opportunityStats.received;
          const profileCode = profileCardCode(model.username);

          function updateLanguages'''
          assert component_opportunity in component
          component = component.replace(component_opportunity, component_opportunity_replacement, 1)

          old_heading = '''          <p>
                    A premium AKARI credit-card profile built from your real member
                    data. Choose your glass color, control private details, then
                    download or share.
                  </p>'''
          new_heading = '''          <p>
                    A premium AKARI member card built from your real member data.
                    Choose your glass color, control what stays public, then download
                    or share.
                  </p>'''
          assert old_heading in component
          component = component.replace(old_heading, new_heading, 1)

          old_link = '''              <div className="glass-profile-link" aria-label="Profile link">
                        <span className="glass-profile-link-icon">
                          <LinkGlyph size={22} />
                        </span>
                        <small>Profile link</small>
                        <strong>Connect on AKARI</strong>
                        <span>{canonicalUrl}</span>
                      </div>'''
          new_link = '''              <div className="glass-profile-link" aria-label="AKARI identity code">
                        <small>AKARI ID</small>
                        <span className="glass-profile-barcode" aria-hidden="true">
                          <ProfileBarcode value={profileCode} />
                        </span>
                        <strong>{profileCode}</strong>
                        <span>{canonicalUrl}</span>
                      </div>'''
          assert old_link in component
          component = component.replace(old_link, new_link, 1)

          old_jsx_metrics = '''            <div className="share-card-metrics glass-card-metrics">
                      <div>
                        <strong>{opportunities}</strong>
                        <span>Opportunities</span>
                      </div>
                      <div>
                        <strong>{formatProfileReach(model.followerCount)}</strong>
                        <span>Reach</span>
                      </div>
                      <div>
                        <strong>
                          {model.percentile.topPercent
                            ? `Top ${model.percentile.topPercent}%`
                            : "Building"}
                        </strong>
                        <span>AKARI signal</span>
                      </div>
                    </div>'''
          new_jsx_metrics = '''            <div
                      className="share-card-metrics glass-card-metrics"
                      aria-label="Profile credibility signals"
                    >
                      <div>
                        <strong>{opportunities}</strong>
                        <span>Opportunities</span>
                      </div>
                      <div>
                        <strong>{formatProfileReach(model.followerCount)}</strong>
                        <span>Social reach</span>
                      </div>
                      <div>
                        <strong>{model.socials.length}</strong>
                        <span>Connected socials</span>
                      </div>
                      <div>
                        <strong>
                          {model.percentile.topPercent
                            ? `Top ${model.percentile.topPercent}%`
                            : "Building"}
                        </strong>
                        <span>AKARI signal</span>
                      </div>
                    </div>'''
          assert old_jsx_metrics in component
          component = component.replace(old_jsx_metrics, new_jsx_metrics, 1)

          old_note = '''          <div className="glass-card-note">
                    <strong>Credit-card format</strong>
                    <span>
                      85.6 × 54 proportion. The downloaded PNG uses the same branded
                      glass design.
                    </span>
                  </div>
                  <p className="share-card-confidence">
                    {model.percentile.confidence === "verified"
                      ? "Percentile uses verified member signals."
                      : model.percentile.confidence === "provisional"
                        ? "Provisional percentile: one or more signals are member-reported."
                        : "Your percentile appears after enough comparable member signals exist."}
                  </p>'''
          new_note = '''          <div className="glass-card-note">
                    <strong>Built for sharing.</strong>
                    <span>Export as PNG and share your AKARI identity anywhere.</span>
                  </div>
                  <p className="share-card-confidence">
                    {model.percentile.confidence === "verified"
                      ? "Credibility signals use verified member data."
                      : model.percentile.confidence === "provisional"
                        ? "Credibility signals include member-reported data."
                        : "Credibility signals grow as more comparable member data becomes available."}
                  </p>'''
          assert old_note in component
          component = component.replace(old_note, new_note, 1)

          component_path.write_text(component)

          styles = styles_path.read_text()
          styles = styles.replace(
            'content: "A private ecosystem for high-signal connections.";',
            'content: "A private membership for high-signal connections.";',
            1,
          )
          styles += '''

          /* R89 identity-card credibility layer */
          .glass-profile-barcode {
            width: 82%;
            height: clamp(1.55rem, 5.3cqi, 3.5rem);
            margin: 0.15cqi 0 0.35cqi;
            display: block;
            overflow: hidden;
            border-radius: clamp(3px, 0.7cqi, 7px);
            color: var(--card-ink);
            background: color-mix(in srgb, var(--card-ink) 7%, transparent);
            box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--card-ink) 13%, transparent);
          }

          .glass-profile-barcode svg {
            width: 100%;
            height: 100%;
            display: block;
            fill: currentColor;
          }

          .glass-profile-link {
            gap: clamp(0.16rem, 0.48cqi, 0.34rem);
          }

          .glass-profile-link small {
            margin-top: 0;
          }

          .glass-profile-link strong {
            max-width: 100%;
            overflow: hidden;
            color: var(--card-ink);
            font-size: clamp(0.38rem, 0.9cqi, 0.58rem);
            letter-spacing: 0.035em;
            text-overflow: ellipsis;
            white-space: nowrap;
          }

          .glass-card-metrics {
            position: absolute;
            left: 7.3%;
            bottom: 30.4%;
            z-index: 1;
            width: 61.5%;
            min-height: 12.7%;
            padding: 0 2.2cqi;
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            align-items: center;
            border: 1px solid color-mix(in srgb, var(--card-ink) 30%, transparent);
            border-radius: clamp(13px, 2.6cqi, 25px);
            background: color-mix(in srgb, var(--card-bg) 70%, var(--card-surface));
            box-shadow:
              inset 0 1px 0 color-mix(in srgb, var(--card-ink) 20%, transparent),
              0 14px 28px rgb(0 0 0 / 15%);
            backdrop-filter: blur(15px);
          }

          .glass-card-metrics > div {
            min-width: 0;
            padding: 0 1.2cqi;
            display: grid;
            gap: 0.35cqi;
          }

          .glass-card-metrics > div + div {
            border-left: 1px solid color-mix(in srgb, var(--card-ink) 18%, transparent);
          }

          .glass-card-metrics strong {
            overflow: hidden;
            color: var(--card-highlight);
            font-size: clamp(0.62rem, 1.75cqi, 1.12rem);
            font-weight: 800;
            line-height: 1;
            text-overflow: ellipsis;
            white-space: nowrap;
          }

          .glass-card-metrics > div:nth-child(even) strong {
            color: var(--card-accent);
          }

          .glass-card-metrics span {
            overflow: hidden;
            color: var(--card-ink);
            font-size: clamp(0.34rem, 0.76cqi, 0.5rem);
            font-weight: 700;
            letter-spacing: 0.055em;
            opacity: 0.68;
            text-overflow: ellipsis;
            text-transform: uppercase;
            white-space: nowrap;
          }

          .glass-card-socials a {
            border-color: color-mix(in srgb, var(--card-ink) 42%, transparent);
            background: color-mix(in srgb, var(--card-bg) 62%, var(--card-surface));
          }

          .glass-card-note {
            font-size: 0.82rem;
          }

          .glass-card-note strong {
            font-weight: 800;
          }

          @media (max-width: 700px) {
            .glass-profile-barcode {
              height: 4.6cqi;
            }

            .glass-card-metrics {
              bottom: 30.2%;
              min-height: 12.2%;
              padding-inline: 1.4cqi;
            }

            .glass-card-metrics > div {
              padding-inline: 0.7cqi;
            }

            .glass-card-metrics strong {
              font-size: 1.55cqi;
            }

            .glass-card-metrics span {
              font-size: 0.72cqi;
              letter-spacing: 0.02em;
            }
          }
          '''
          styles_path.write_text(styles)

          test = test_path.read_text()
          test = test.replace(
            'it("renders the requested credit-card identity and privacy features", () => {',
            'it("renders the requested shareable identity and privacy features", () => {',
            1,
          )
          marker = '    expect(component).toContain("Connected social platforms");\n'
          assert marker in test
          test = test.replace(
            marker,
            marker
            + '    expect(component).toContain("glass-profile-barcode");\n'
            + '    expect(component).toContain("Profile credibility signals");\n'
            + '    expect(component).toContain("Built for sharing.");\n'
            + '    expect(component).not.toContain("credit-card profile");\n',
            1,
          )
          test_path.write_text(test)
          PY
      - name: Format changed files
        run: npx prettier --write app/components/ProfileShareCard.tsx app/styles/profile-card-glass.css tests/unit/profile-card-completion.test.ts
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/ProfileShareCard.tsx app/styles/profile-card-glass.css tests/unit/profile-card-completion.test.ts
          git commit -m "R89: upgrade profile sharing card credibility"
          git push origin HEAD:r89-profile-card-credibility

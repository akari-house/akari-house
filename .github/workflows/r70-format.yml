name: R70 Format

on:
  push:
    branches:
      - feature/r70-agreement-tracking

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/r70-agreement-tracking
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write app/lib/agreement-tracking.ts app/routes/admin-agreements.tsx tests/agreement-tracking.test.ts tests/e2e/agreement-tracking.spec.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/agreement-tracking.ts app/routes/admin-agreements.tsx tests/agreement-tracking.test.ts tests/e2e/agreement-tracking.spec.ts
          git commit -m "chore: format R70 files"
          git push origin HEAD:feature/r70-agreement-tracking

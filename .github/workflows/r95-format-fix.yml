name: R95 Format Fix

on:
  push:
    branches:
      - r95-discovery-density

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r95-discovery-density
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write app/styles/r78-authenticated-density.css tests/r95-discovery-density.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/styles/r78-authenticated-density.css tests/r95-discovery-density.test.ts
          git diff --cached --quiet || git commit -m "style: format R95 discovery changes"
          git push origin HEAD:r95-discovery-density

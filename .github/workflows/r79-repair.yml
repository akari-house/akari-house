name: R79 exact repair

on:
  push:
    branches: [r79-profile-sharing-glass-card]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r79-profile-sharing-glass-card
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Repair lint and format R79 files
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/components/ProfileShareCardGlass.tsx')
          text = path.read_text()
          old = '''  let logo: HTMLImageElement | null = null;
  let flower: HTMLImageElement | null = null;
  try {
    [logo, flower] = await Promise.all([
      loadImage("/assets/brand/akari-logo-horizontal.png"),
      loadImage("/assets/brand/akari-flower-mark.png"),
    ]);
  } catch {
    logo = null;
    flower = null;
  }
'''
          new = '''  const [logo, flower] = await Promise.all([
    loadImage("/assets/brand/akari-logo-horizontal.png"),
    loadImage("/assets/brand/akari-flower-mark.png"),
  ]).catch(() => [null, null] as const);
'''
          if old not in text:
              raise SystemExit('Expected R79 image-loading block not found')
          path.write_text(text.replace(old, new))
          PY
          npx prettier --write app/components/ProfileShareCard.tsx app/components/ProfileShareCardGlass.tsx app/styles/r79-profile-sharing-glass.css tests/unit/profile-card-completion.test.ts tests/e2e/profile-share-card-glass.spec.ts
          git rm .github/workflows/r79-repair.yml
      - name: Commit exact repair and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "R79: apply exact lint and format repair"
          git push origin HEAD:r79-profile-sharing-glass-card

name: Focused Opportunity Browser Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run focused browser journeys
        run: |
          set +e
          npx playwright test \
            tests/e2e/curated-opportunities.spec.ts \
            tests/e2e/opportunity-document-review.spec.ts \
            tests/e2e/inari-homepage-regression.spec.ts \
            --project=desktop-chromium \
            --reporter=line > focused.log 2>&1
          desktop_status=$?
          npx playwright test \
            tests/e2e/public-journey.spec.ts \
            --project=tablet-chromium \
            --reporter=line > tablet.log 2>&1
          tablet_status=$?
          python - <<'PY'
          from pathlib import Path
          import re

          parts = []
          for label, file in [("Desktop opportunity journeys", "focused.log"), ("Tablet public journey", "tablet.log")]:
              text = re.sub(r"\x1b\[[0-9;]*m", "", Path(file).read_text(errors="replace"))
              parts.append(f"## {label}\n\n```text\n" + "\n".join(text.splitlines()[-220:]) + "\n```")
          Path("diagnostic.md").write_text("Temporary diagnostic for PR #44.\n\n" + "\n\n".join(parts))
          PY
          if [ "$desktop_status" -ne 0 ] || [ "$tablet_status" -ne 0 ]; then
            echo "failed=true" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "failed=false" >> "$GITHUB_ENV"
      - name: Publish focused failure
        if: env.failed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --repo "$GITHUB_REPOSITORY" --title "Temporary focused opportunity diagnostic ${GITHUB_SHA:0:7}" --body-file diagnostic.md
      - name: Enforce
        run: test "$failed" = "false"

name: R71 Format

on:
  push:
    branches:
      - r71-founder-fundraising-readiness

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r71-founder-fundraising-readiness
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format R71 files
        run: >-
          npx prettier --write
          app/lib/fundraising-readiness.ts
          app/routes.ts
          app/routes/admin-fundraising-readiness.tsx
          app/routes/project-fundraising-readiness.tsx
          app/routes/project-manage.tsx
          tests/fundraising-readiness.test.ts
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/fundraising-readiness.ts app/routes.ts app/routes/admin-fundraising-readiness.tsx app/routes/project-fundraising-readiness.tsx app/routes/project-manage.tsx tests/fundraising-readiness.test.ts
          git commit -m "chore: format R71 files"
          git push origin HEAD:r71-founder-fundraising-readiness

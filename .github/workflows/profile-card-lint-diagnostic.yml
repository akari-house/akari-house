name: Profile Card Format Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Format profile card files
        run: |
          npx prettier --write \
            app/components/ProfileShareCard.tsx \
            app/lib/profile-card.ts \
            app/routes/profile-card.tsx \
            app/styles/profile-card-enhancements.css \
            tests/unit/profile-card-completion.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: profile-card-formatted-source
          path: |
            app/components/ProfileShareCard.tsx
            app/lib/profile-card.ts
            app/routes/profile-card.tsx
            app/styles/profile-card-enhancements.css
            tests/unit/profile-card-completion.test.ts
          retention-days: 1

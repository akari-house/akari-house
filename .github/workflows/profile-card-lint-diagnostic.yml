name: Profile Card Lint Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Capture lint output
        shell: bash
        run: |
          set +e
          npm run lint > lint-output.txt 2>&1
          echo $? > lint-exit-code.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: profile-card-lint-output
          path: |
            lint-output.txt
            lint-exit-code.txt
          retention-days: 1

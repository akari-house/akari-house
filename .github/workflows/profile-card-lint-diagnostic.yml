name: Apply Profile Card Formatting

on:
  push:
    branches:
      - agent/profile-card-completion

permissions:
  contents: write

jobs:
  format-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/profile-card-completion
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Apply repository formatting
        run: |
          npx prettier --write \
            app/components/ProfileShareCard.tsx \
            app/lib/profile-card.ts \
            app/routes/profile-card.tsx \
            app/styles/profile-card-enhancements.css \
            tests/unit/profile-card-completion.test.ts
          rm .github/workflows/profile-card-lint-diagnostic.yml
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/ProfileShareCard.tsx \
            app/lib/profile-card.ts \
            app/routes/profile-card.tsx \
            app/styles/profile-card-enhancements.css \
            tests/unit/profile-card-completion.test.ts \
            .github/workflows/profile-card-lint-diagnostic.yml
          git commit -m "Format completed profile card sources"
          git push origin HEAD:agent/profile-card-completion

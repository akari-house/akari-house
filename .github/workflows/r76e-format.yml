name: R76E Format

on:
  push:
    branches:
      - feature/r76e-trust-review-operations

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/r76e-trust-review-operations
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write app/routes/project-claim.tsx tests/project-relationship-claims.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/routes/project-claim.tsx tests/project-relationship-claims.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "R76E apply repository formatting"
          git push origin HEAD:feature/r76e-trust-review-operations

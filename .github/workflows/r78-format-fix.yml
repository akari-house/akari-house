name: R78 One-Time Format Repair

on:
  push:
    branches:
      - r78-authenticated-ui-density

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r78-authenticated-ui-density
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write app/styles/r78-authenticated-density.css tests/e2e/launch-visual-evidence.spec.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No formatting changes needed."
          else
            git add app/styles/r78-authenticated-density.css tests/e2e/launch-visual-evidence.spec.ts
            git commit -m "chore: format R78 UI density changes"
            git push origin HEAD:r78-authenticated-ui-density
          fi
      - name: Remove temporary workflow
        run: |
          git pull --rebase origin r78-authenticated-ui-density
          git rm .github/workflows/r78-format-fix.yml
          git commit -m "chore: remove R78 format repair workflow"
          git push origin HEAD:r78-authenticated-ui-density

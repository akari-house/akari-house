name: Format Worker Login Repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format Worker login repair
        run: |
          npx prettier --write \
            app/lib/public-login-handler.server.ts \
            app/lib/public-login-fallback.server.ts \
            tests/public-login-fallback.test.ts \
            worker/index.ts
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/public-login-handler.server.ts app/lib/public-login-fallback.server.ts tests/public-login-fallback.test.ts worker/index.ts
          if git diff --cached --quiet; then
            echo "No formatting changes required."
          else
            git commit -m "Format Worker login repair"
            git push
          fi

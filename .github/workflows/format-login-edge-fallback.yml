name: Format Login Edge Fallback

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format login edge fallback
        run: |
          npx prettier --write \
            worker/index.ts \
            app/routes.ts \
            app/routes/signin.tsx \
            scripts/production-public-audit.mjs \
            tests/e2e/header-login.spec.ts
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/index.ts app/routes.ts app/routes/signin.tsx scripts/production-public-audit.mjs tests/e2e/header-login.spec.ts
          if git diff --cached --quiet; then
            echo "No formatting changes required."
          else
            git commit -m "Format login edge fallback"
            git push
          fi

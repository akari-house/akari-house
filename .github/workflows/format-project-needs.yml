name: Format Project Needs

on:
  pull_request:
    paths:
      - "app/lib/project-needs.ts"
      - "app/components/projects/**"
      - "app/styles/project-needs.css"
      - "app/root.tsx"
      - "app/routes/project-new.tsx"
      - "app/routes/project-needs.tsx"
      - "app/routes/project-manage.tsx"
      - "app/routes/projects.tsx"
      - "app/components/discovery/ProjectLanternCard.tsx"
      - "app/routes.ts"
      - "tests/project-needs.test.ts"

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: >-
          npx prettier --write
          app/lib/project-needs.ts
          app/components/projects/ProjectNeedsFieldset.tsx
          app/components/projects/ProjectNeedChips.tsx
          app/styles/project-needs.css
          app/root.tsx
          app/routes/project-new.tsx
          app/routes/project-needs.tsx
          app/routes/project-manage.tsx
          app/routes/projects.tsx
          app/components/discovery/ProjectLanternCard.tsx
          app/routes.ts
          tests/project-needs.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app tests
          git commit -m "Format project needs release"
          git push

name: Fix Opportunity Punctuation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Apply interface punctuation rule
        run: |
          python - <<'PY'
          from pathlib import Path

          changed = []
          for pattern in ("*.ts", "*.tsx"):
              for path in Path("app").rglob(pattern):
                  value = path.read_text()
                  updated = value.replace("\u2013", "-").replace("\u2014", "-")
                  if updated != value:
                      path.write_text(updated)
                      changed.append(str(path))
          if len(changed) != 3:
              raise SystemExit(f"Expected three punctuation fixes, found {len(changed)}: {changed}")
          print("\n".join(changed))
          PY
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git commit -m "Follow AKARI interface punctuation rules"
          git push

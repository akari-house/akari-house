name: Format Full Product Audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format audit files
        run: |
          npx prettier --write \
            scripts/full-product-production-audit.mjs \
            .github/workflows/full-product-audit.yml \
            eslint.config.js
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/full-product-production-audit.mjs \
            .github/workflows/full-product-audit.yml \
            eslint.config.js
          if git diff --cached --quiet; then
            echo "No formatting changes required."
          else
            git commit -m "Format full product audit files"
            git push
          fi

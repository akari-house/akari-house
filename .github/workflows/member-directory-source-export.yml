name: Member Directory Source Export

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive source
        run: git archive --format=tar.gz --output=akari-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: akari-member-directory-source
          path: akari-source.tar.gz
          retention-days: 1

name: R76H Evidence Format

on:
  push:
    branches:
      - feature/r76h-outcome-intelligence-sla
    paths:
      - .github/workflows/r76h-evidence-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/r76h-outcome-intelligence-sla
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/e2e/launch-visual-evidence.spec.ts
      - name: Commit formatted evidence
        run: |
          git config user.name "AKARI Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add tests/e2e/launch-visual-evidence.spec.ts
          if git diff --cached --quiet; then
            echo "No formatting changes required."
          else
            git commit -m "R76H format launch evidence"
            git push origin HEAD:feature/r76h-outcome-intelligence-sla
          fi

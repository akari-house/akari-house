name: Fix Deal Room Preview Type

on:
  push:
    branches: [fix/complete-investor-deals-room]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Fix Deal Room preview response type') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/complete-investor-deals-room
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/fix-deal-room-preview-type.mjs
      - run: npx prettier --write app/routes/deal-room.tsx
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/routes/deal-room.tsx
          if git diff --cached --quiet; then
            echo "No preview type changes required."
          else
            git commit -m "Fix Deal Room preview response type"
            git push
          fi

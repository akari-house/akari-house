name: Format Delivery Reliability

on:
  pull_request:
    paths:
      - ".github/workflows/format-delivery-reliability.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Apply fixes and capture remaining diagnostics
        run: |
          npx eslint --fix \
            app/lib/delivery-policy.ts \
            app/lib/delivery-operations-schema.server.ts \
            app/lib/delivery-outbox.server.ts \
            app/lib/scheduled-execution.server.ts \
            app/lib/email.server.ts \
            app/lib/telegram.server.ts \
            app/routes/admin-operations.tsx \
            app/routes/health.ts \
            worker/index.ts \
            tests/unit/delivery-policy.test.ts || true
          npx prettier --write \
            app/lib/delivery-policy.ts \
            app/lib/delivery-operations-schema.server.ts \
            app/lib/delivery-outbox.server.ts \
            app/lib/scheduled-execution.server.ts \
            app/lib/email.server.ts \
            app/lib/telegram.server.ts \
            app/routes/admin-operations.tsx \
            app/routes/health.ts \
            worker/index.ts \
            tests/unit/delivery-policy.test.ts
          mkdir -p docs
          npx eslint \
            app/lib/delivery-policy.ts \
            app/lib/delivery-operations-schema.server.ts \
            app/lib/delivery-outbox.server.ts \
            app/lib/scheduled-execution.server.ts \
            app/lib/email.server.ts \
            app/lib/telegram.server.ts \
            app/routes/admin-operations.tsx \
            app/routes/health.ts \
            worker/index.ts \
            tests/unit/delivery-policy.test.ts \
            > docs/delivery-reliability-lint.txt 2>&1 || true
          if [ ! -s docs/delivery-reliability-lint.txt ]; then
            echo "No targeted lint diagnostics." > docs/delivery-reliability-lint.txt
          fi
      - name: Commit fixes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app worker tests docs
          git commit -m "Format delivery reliability release"
          git push

name: R94 Launch Polish Helper

on:
  push:
    branches:
      - r94-launch-polish

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r94-launch-polish
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply R94 launch polish
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f"Missing replacement target: {label}")
              return text.replace(old, new, 1)

          dashboard_path = Path("app/routes/dashboard.tsx")
          dashboard = dashboard_path.read_text()
          dashboard = replace_once(
              dashboard,
              '    photoSaved: new URL(request.url).searchParams.has("photo"),\n    welcome: new URL(request.url).searchParams.has("welcome"),',
              '    photoSaved: new URL(request.url).searchParams.has("photo"),\n    editing: new URL(request.url).searchParams.has("edit"),\n    welcome: new URL(request.url).searchParams.has("welcome"),',
              "dashboard edit loader flag",
          )
          dashboard = replace_once(
              dashboard,
              '          <ScrollTo targetId="profile-editor">Edit profile</ScrollTo>\n          <ScrollTo targetId="privacy-controls">Privacy and security</ScrollTo>',
              '          <Link to="/app?edit=1#profile-editor">Edit profile</Link>\n          <Link to="/app?edit=1#privacy-controls">Privacy and security</Link>',
              "dashboard edit navigation",
          )
          dashboard = replace_once(
              dashboard,
              '              <ScrollTo className="quiet-link" targetId="profile-editor">\n                Continue your profile\n              </ScrollTo>',
              '              <Link className="quiet-link" to="/app?edit=1#profile-editor">\n                Continue your profile\n              </Link>',
              "dashboard next action",
          )
          dashboard = replace_once(
              dashboard,
              '  return (\n    <div className="dashboard-shell">',
              '  const editingProfile = loaderData.editing || Boolean(actionData?.error);\n  const connectedSocialCount = loaderData.socialAccounts.filter((account) =>\n    Boolean(account.profileUrl),\n  ).length;\n\n  return (\n    <div className="dashboard-shell">',
              "dashboard derived launch state",
          )

          start_marker = '          <ProfilePhotoEditor\n'
          end_marker = '          </Form>\n'
          start = dashboard.find(start_marker)
          if start < 0:
              raise SystemExit("Missing profile editor start")
          end = dashboard.find(end_marker, start)
          if end < 0:
              raise SystemExit("Missing profile editor form end")
          end += len(end_marker)
          editor = dashboard[start:end]
          editor = editor.replace(
              '<Form method="post" className="profile-form" id="profile-editor">',
              '<Form method="post" className="profile-form" id="profile-edit-form">',
              1,
          )
          editor = "\n".join("  " + line if line else line for line in editor.rstrip("\n").split("\n"))
          replacement = f'''          {{editingProfile ? (\n            <section\n              className="profile-editor-shell"\n              id="profile-editor"\n              aria-labelledby="profile-editor-title"\n            >\n              <div className="profile-editor-heading">\n                <div>\n                  <span className="chapter">Profile &amp; privacy</span>\n                  <h2 id="profile-editor-title">Edit only when you need to.</h2>\n                  <p>\n                    Your House stays focused on people and opportunities. Open\n                    these controls when you want to update identity, socials or\n                    privacy.\n                  </p>\n                </div>\n                <Link className="quiet-link" to="/app#profile-editor">\n                  Back to My House\n                </Link>\n              </div>\n{editor}\n            </section>\n          ) : (\n            <section\n              className="profile-editor-summary"\n              id="profile-editor"\n              aria-labelledby="profile-summary-title"\n            >\n              <div className="profile-editor-summary-copy">\n                <span className="chapter">Profile &amp; privacy</span>\n                <h2 id="profile-summary-title">Your identity is ready when the House needs it.</h2>\n                <p>\n                  Keep the overview calm. Edit the details only when something\n                  about your role, visibility or professional context changes.\n                </p>\n              </div>\n              <div className="profile-editor-summary-grid" aria-label="Profile status">\n                <div>\n                  <span>Readiness</span>\n                  <strong>{{completion.percent}}%</strong>\n                </div>\n                <div>\n                  <span>Visibility</span>\n                  <strong>{{loaderData.profile.visibility}}</strong>\n                </div>\n                <div>\n                  <span>Roles</span>\n                  <strong>\n                    {{loaderData.user.roles\n                      .map((role) => role[0].toUpperCase() + role.slice(1))\n                      .join(" · ")}}\n                  </strong>\n                </div>\n                <div>\n                  <span>Social profiles</span>\n                  <strong>{{connectedSocialCount}}</strong>\n                </div>\n              </div>\n              <div className="profile-editor-summary-actions">\n                <Link className="button button-primary" to="/app?edit=1#profile-editor">\n                  Edit profile\n                </Link>\n                <Link className="button button-quiet" to="/profile-card">\n                  Sharing card\n                </Link>\n              </div>\n            </section>\n          )}}\n'''
          dashboard = dashboard[:start] + replacement + dashboard[end:]
          dashboard_path.write_text(dashboard)

          actions_path = Path("app/components/DashboardRoleActions.tsx")
          actions = actions_path.read_text().replace(
              'to: "/app#profile-editor",',
              'to: "/app?edit=1#profile-editor",',
          )
          actions_path.write_text(actions)

          home_path = Path("app/routes/home.tsx")
          home = home_path.read_text()
          home = replace_once(
              home,
              '<main id="main-content">',
              '<main id="main-content" className="public-home-main">',
              "public home launch class",
          )
          home_path.write_text(home)

          css_path = Path("app/styles/r91-launch-experience.css")
          css = css_path.read_text()
          css += r'''

/* R94 — launch polish: keep the House cinematic, but never make users hunt
   through a full account form or scroll through visually empty chapters. */
.dashboard-shell .profile-editor-summary,
.dashboard-shell .profile-editor-shell {
  margin-top: 1rem;
  padding: clamp(1rem, 2.2vw, 1.4rem);
  border: 1px solid rgba(255, 255, 255, 0.09);
  border-radius: 18px;
  background:
    radial-gradient(circle at 92% 0%, rgba(255, 211, 61, 0.055), transparent 22rem),
    linear-gradient(145deg, rgba(15, 19, 31, 0.97), rgba(9, 12, 21, 0.98));
  box-shadow: 0 16px 44px rgba(0, 0, 0, 0.16);
}

.dashboard-shell .profile-editor-summary {
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(320px, 0.85fr);
  gap: 1rem 1.25rem;
  align-items: center;
}

.dashboard-shell .profile-editor-summary-copy h2,
.dashboard-shell .profile-editor-heading h2 {
  max-width: 19ch;
  margin: 0.35rem 0 0.5rem;
  font-size: clamp(1.35rem, 2.35vw, 2rem);
  line-height: 1.08;
  letter-spacing: -0.035em;
}

.dashboard-shell .profile-editor-summary-copy p,
.dashboard-shell .profile-editor-heading p {
  max-width: 62ch;
  margin: 0;
  color: var(--muted);
  line-height: 1.6;
}

.dashboard-shell .profile-editor-summary-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0.55rem;
}

.dashboard-shell .profile-editor-summary-grid > div {
  min-width: 0;
  padding: 0.75rem 0.8rem;
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.025);
}

.dashboard-shell .profile-editor-summary-grid span,
.dashboard-shell .profile-editor-summary-grid strong {
  display: block;
}

.dashboard-shell .profile-editor-summary-grid span {
  color: var(--muted);
  font-size: 0.68rem;
  font-weight: 750;
  letter-spacing: 0.07em;
  text-transform: uppercase;
}

.dashboard-shell .profile-editor-summary-grid strong {
  margin-top: 0.25rem;
  overflow-wrap: anywhere;
  color: #fff;
  font-size: 0.94rem;
  line-height: 1.3;
  text-transform: capitalize;
}

.dashboard-shell .profile-editor-summary-actions {
  display: flex;
  grid-column: 1 / -1;
  flex-wrap: wrap;
  gap: 0.65rem;
}

.dashboard-shell .profile-editor-heading {
  display: flex;
  justify-content: space-between;
  gap: 1rem;
  margin-bottom: 1rem;
  align-items: end;
}

.dashboard-shell .profile-editor-shell .profile-photo-editor {
  margin-top: 0;
}

.dashboard-shell .profile-editor-shell .profile-form {
  margin-bottom: 0;
}

/* Scroll-driven entrance effects are decorative. The launch page should never
   present a large blank chapter while waiting for an animation timeline. */
.public-home-main .chapter-section {
  padding-block: clamp(3.75rem, 6vw, 5.75rem);
}

.public-home-main .common-section,
.public-home-main .journey-section,
.public-home-main .archive-section {
  min-height: 0 !important;
}

@supports (animation-timeline: view()) {
  .public-home-main .story-chapter .section-intro,
  .public-home-main .story-chapter > .archive-copy,
  .public-home-main .story-chapter > .membership-copy,
  .public-home-main .journey-section > div:first-child {
    animation: none !important;
    opacity: 1 !important;
    transform: none !important;
  }
}

@media (max-width: 760px) {
  .dashboard-shell .profile-editor-summary {
    grid-template-columns: 1fr;
  }

  .dashboard-shell .profile-editor-summary-actions {
    grid-column: 1;
  }

  .dashboard-shell .profile-editor-heading {
    align-items: flex-start;
    flex-direction: column;
  }

  .public-home-main .chapter-section {
    padding-block: 3.25rem;
  }
}

@media (max-width: 440px) {
  .dashboard-shell .profile-editor-summary-grid {
    grid-template-columns: 1fr;
  }

  .dashboard-shell .profile-editor-summary-actions .button {
    width: 100%;
    justify-content: center;
  }
}
'''
          css_path.write_text(css)

          test_path = Path("tests/e2e/r94-launch-polish.spec.ts")
          test_path.write_text(r'''import { expect, test, type Page } from "@playwright/test";

const fixtureHeaders = { "x-akari-test-fixture": "launch-gate-v1" };

async function activateSuperadmin(page: Page) {
  await page.context().clearCookies();
  const response = await page.request.post("/__test__/personas/superadmin", {
    headers: fixtureHeaders,
    form: { session: "true", reuseExisting: "true" },
  });
  expect(response.status()).toBe(201);
}

test("My House stays action-first until profile editing is requested", async ({
  page,
}) => {
  await activateSuperadmin(page);
  await page.goto("/app", { waitUntil: "networkidle" });

  await expect(
    page.getByRole("heading", { name: "Continue from the role you need now." }),
  ).toBeVisible();
  await expect(
    page.getByRole("heading", {
      name: "Your identity is ready when the House needs it.",
    }),
  ).toBeVisible();
  await expect(page.getByLabel("Display name")).toHaveCount(0);

  await page.getByRole("link", { name: "Edit profile", exact: true }).click();
  await expect(page).toHaveURL(/\/app\?edit=1#profile-editor$/);
  await expect(
    page.getByRole("heading", { name: "Edit only when you need to." }),
  ).toBeVisible();
  await expect(page.getByLabel("Display name")).toBeVisible();
});

test("public House chapters do not depend on hidden scroll-entry content", async ({
  page,
}) => {
  await page.goto("/", { waitUntil: "networkidle" });
  for (const selector of [
    "#hall .section-intro",
    "#common .section-intro",
    "#journey > div:first-child",
    "#archive .archive-copy",
  ]) {
    const chapter = page.locator(selector);
    await expect(chapter).toHaveCSS("opacity", "1");
    const transform = await chapter.evaluate(
      (element) => getComputedStyle(element).transform,
    );
    expect(transform === "none" || transform.includes("matrix(1, 0, 0, 1")).toBe(
      true,
    );
  }

  const widths = await page.evaluate(() => ({
    client: document.documentElement.clientWidth,
    scroll: document.documentElement.scrollWidth,
  }));
  expect(widths.scroll).toBeLessThanOrEqual(widths.client + 1);
});
''')
          PY

      - name: Format R94 files
        run: npx prettier --write app/routes/dashboard.tsx app/components/DashboardRoleActions.tsx app/routes/home.tsx app/styles/r91-launch-experience.css tests/e2e/r94-launch-polish.spec.ts
      - name: Commit R94 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/routes/dashboard.tsx app/components/DashboardRoleActions.tsx app/routes/home.tsx app/styles/r91-launch-experience.css tests/e2e/r94-launch-polish.spec.ts
          git commit -m "R94: simplify My House and close launch scroll gaps"
          git push origin HEAD:r94-launch-polish

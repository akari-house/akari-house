name: R79 Postdeploy Evidence

on:
  push:
    branches:
      - r79-profile-card-event-publishing

permissions:
  contents: read
  issues: write

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Resolve production evidence
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > d1.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const payload = JSON.parse(fs.readFileSync('d1.json','utf8'));
          const rows = Array.isArray(payload) ? payload : (payload.result ?? []);
          const db = rows.find((x) => x.name === 'akari-house-db' || x.database_name === 'akari-house-db');
          const id = db?.uuid ?? db?.database_id ?? db?.id;
          if (!id) throw new Error('akari-house-db not found');
          const config = {
            name: 'akari-house',
            main: './worker/index.ts',
            compatibility_date: '2026-07-23',
            d1_databases: [{ binding: 'DB', database_name: 'akari-house-db', database_id: id }]
          };
          fs.writeFileSync('r79-evidence-wrangler.jsonc', JSON.stringify(config, null, 2));
          NODE
          npx wrangler d1 execute DB --remote --config r79-evidence-wrangler.jsonc --json --command \
            "SELECT id, name, applied_at FROM d1_migrations ORDER BY id DESC LIMIT 6" > migrations.json
          npx wrangler d1 execute DB --remote --config r79-evidence-wrangler.jsonc --json --command \
            "SELECT commit_sha, status, workflow_url, completed_at FROM production_audit_runs WHERE commit_sha = 'af7cc90751f4581d8de965f54339b821a70cb9d6' ORDER BY completed_at DESC LIMIT 1" > audit.json
          npx wrangler versions list --name akari-house --json > versions.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const unwrap = (payload) => {
            const entries = Array.isArray(payload) ? payload : [payload];
            return entries.flatMap((entry) => entry.results ?? entry.result?.results ?? []);
          };
          const migrations = unwrap(JSON.parse(fs.readFileSync('migrations.json','utf8')));
          const audit = unwrap(JSON.parse(fs.readFileSync('audit.json','utf8')))[0] ?? {};
          const versionsPayload = JSON.parse(fs.readFileSync('versions.json','utf8'));
          const versions = Array.isArray(versionsPayload) ? versionsPayload : (versionsPayload.result ?? []);
          const latest = versions[0] ?? {};
          const migration = migrations.find((row) => String(row.name ?? '').includes('0125'));
          if (!migration) throw new Error('Migration 0125 is not recorded in production D1.');
          if (audit.status !== 'passed') throw new Error('R79 production audit was not found as passed.');
          const versionId = latest.id ?? latest.version_id ?? latest.versionId ?? 'unavailable';
          const body = [
            '## R79 production evidence',
            '',
            '- Commit: `af7cc90751f4581d8de965f54339b821a70cb9d6`',
            `- Migration: \`${migration.name}\` applied`,
            `- Production audit: **${audit.status}**`,
            `- Deploy workflow: ${audit.workflow_url ?? 'unavailable'}`,
            `- Worker version: \`${versionId}\``,
            `- Audit completed: ${audit.completed_at ?? 'unavailable'}`,
            '- Live product: https://akarihouse.com',
          ].join('\n');
          fs.writeFileSync('r79-evidence.md', body);
          NODE
          gh issue comment 31 --repo "$GITHUB_REPOSITORY" --body-file r79-evidence.md

name: Update Login Launch Gate Expectations

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Update protected-route URL expectations
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path("tests/e2e/launch-gate.spec.ts"),
              Path("tests/e2e/launch-gate-security.spec.ts"),
          ]
          old = r"/\/login\?returnTo=%2Fapp$/"
          new = r"/\/signin\?returnTo=%2Fapp$/"
          total = 0
          for path in paths:
              text = path.read_text()
              count = text.count(old)
              total += count
              path.write_text(text.replace(old, new))
              print(f"{path}: updated {count} expectation(s)")
          if total != 6:
              raise SystemExit(f"Expected 6 login URL assertions, updated {total}.")
          PY
          npx prettier --write tests/e2e/launch-gate.spec.ts tests/e2e/launch-gate-security.spec.ts
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - name: Commit updated expectations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/launch-gate.spec.ts tests/e2e/launch-gate-security.spec.ts
          if git diff --cached --quiet; then
            echo "No expectation changes required."
          else
            git commit -m "Update launch-gate expectations for signin fallback"
            git push
          fi

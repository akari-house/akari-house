name: Format Launch Gate

on:
  pull_request:
    paths:
      - ".github/workflows/format-launch-gate.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write app/routes.ts app/routes/admin-launch-gate.tsx app/lib/launch-gate.ts app/lib/launch-gate-schema.server.ts tests/unit/launch-gate.test.ts docs/security/launch-gate-matrix.md
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app tests docs
          git commit -m "Format launch gate release"
          git push

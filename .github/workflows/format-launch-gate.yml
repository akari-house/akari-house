name: Format Launch Gate

on:
  pull_request:
    paths:
      - ".github/workflows/format-launch-gate.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply lint and formatting fixes
        run: |
          npx eslint --fix \
            app/lib/launch-gate-evidence.ts \
            app/lib/launch-gate-schema.server.ts \
            app/routes.ts \
            app/routes/admin-launch-gate.tsx \
            app/routes/test-persona.ts \
            scripts/build-launch-gate-report.mjs \
            tests/e2e/launch-gate.spec.ts \
            tests/unit/launch-gate-evidence.test.ts
          npx prettier --write \
            .github/workflows/launch-gate-preview.yml \
            app/lib/launch-gate-evidence.ts \
            app/lib/launch-gate-schema.server.ts \
            app/routes.ts \
            app/routes/admin-launch-gate.tsx \
            app/routes/test-persona.ts \
            migrations/0097_launch_gate_automation.sql \
            scripts/build-launch-gate-report.mjs \
            tests/e2e/launch-gate.spec.ts \
            tests/unit/launch-gate-evidence.test.ts
      - name: Commit fixes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app migrations scripts tests .github/workflows/launch-gate-preview.yml
          git commit -m "Format automated launch gate release"
          git push

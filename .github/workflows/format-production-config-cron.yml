name: Format Production Config and Cron

on:
  pull_request:
    paths:
      - ".github/workflows/format-production-config-cron.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write README.md app/lib/scheduled-jobs.ts worker/index.ts tests/unit/scheduled-jobs.test.ts wrangler.jsonc
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md app/lib/scheduled-jobs.ts worker/index.ts tests/unit/scheduled-jobs.test.ts wrangler.jsonc
          git commit -m "Format production config and cron release"
          git push

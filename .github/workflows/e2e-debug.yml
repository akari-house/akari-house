name: E2E Debug

on:
  pull_request:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Run end-to-end tests with captured output
        id: e2e
        shell: bash
        run: |
          set +e
          npx playwright test --reporter=line 2>&1 | tee e2e-output.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-debug-output
          path: |
            e2e-output.txt
            playwright-report
            test-results
          if-no-files-found: warn
      - name: Preserve test result
        if: steps.e2e.outputs.status != '0'
        run: exit 1

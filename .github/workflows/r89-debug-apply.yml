name: R89 Debug Apply

on:
  push:
    branches:
      - r89-profile-card-credibility

permissions:
  contents: write

jobs:
  debug-apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r89-profile-card-credibility
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run force patch and capture diagnostics
        run: |
          awk '
            /^[[:space:]]+python - <<'\''PY'\''$/ { in_script=1; next }
            /^[[:space:]]+PY$/ && in_script { exit }
            in_script { sub(/^          /, ""); print }
          ' .github/workflows/r89-force-apply.yml > /tmp/r89-force.py
          set +e
          python /tmp/r89-force.py > /tmp/r89-output.txt 2>&1
          status=$?
          set -e
          {
            echo "exit_status=$status"
            cat /tmp/r89-output.txt
          } > .r89-diagnostic.txt
          npx prettier --write app/components/ProfileShareCard.tsx app/styles/profile-card-glass.css tests/unit/profile-card-completion.test.ts || true
      - name: Commit diagnostic and any product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .r89-diagnostic.txt app/components/ProfileShareCard.tsx app/styles/profile-card-glass.css tests/unit/profile-card-completion.test.ts
          git commit -m "R89: capture profile card apply diagnostic"
          git push origin HEAD:r89-profile-card-credibility

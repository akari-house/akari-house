name: Diagnose Auth Password Browser Journeys

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/auth-password-ux
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Capture authentication browser output
        run: |
          set +e
          npx playwright test tests/e2e/auth-password-ux.spec.ts --reporter=line > .github/auth-password-e2e-output.txt 2>&1
          status=$?
          echo "exit_status=${status}" >> .github/auth-password-e2e-output.txt
          rm -f .github/workflows/diagnose-auth-password-e2e.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record authentication browser diagnostic"
          git push origin HEAD:agent/auth-password-ux
          exit 0

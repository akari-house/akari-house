name: Verify Automated Launch Gate Production

on:
  pull_request:
    paths:
      - ".github/workflows/verify-automated-launch-gate-production.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for production health
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            code=$(curl --silent --show-error --output health.json --write-out "%{http_code}" https://akarihouse.com/health || true)
            if [ "$code" = "200" ] && node -e '
              const fs = require("node:fs");
              const value = JSON.parse(fs.readFileSync("health.json", "utf8"));
              if (value.status !== "ready" || value.checks?.launchGate !== true) process.exit(1);
            '; then
              exit 0
            fi
            sleep 10
          done
          echo "Production health did not become ready."
          cat health.json || true
          exit 1
      - name: Verify public application
        run: |
          curl --fail --silent --show-error https://akarihouse.com/ > /dev/null
      - name: Verify protected launch gate route
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --output admin-body.txt --dump-header admin-headers.txt --write-out "%{http_code}" --max-redirs 0 https://akarihouse.com/admin/launch-gate || true)
          if [ "$code" != "302" ] && [ "$code" != "303" ]; then
            echo "Expected authentication redirect, received $code"
            cat admin-body.txt || true
            exit 1
          fi
          grep -Eiq '^location: .*/login' admin-headers.txt
      - name: Verify production fixture denial
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --output fixture-body.txt --write-out "%{http_code}" \
            --request POST \
            --header 'x-akari-test-fixture: launch-gate-v1' \
            --data 'session=true' \
            https://akarihouse.com/__test__/personas/founder || true)
          if [ "$code" != "404" ]; then
            echo "Production fixture endpoint was not denied: $code"
            cat fixture-body.txt || true
            exit 1
          fi
          grep -Fxq 'Not found' fixture-body.txt

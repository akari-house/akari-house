name: R96 Final Format

on:
  push:
    branches:
      - r96-creator-investor-readiness

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r96-creator-investor-readiness
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write app/styles/r96-creator-investor-readiness.css
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/styles/r96-creator-investor-readiness.css
          git diff --cached --quiet || git commit -m "style: format R96.3 readiness styles"
          git push origin HEAD:r96-creator-investor-readiness

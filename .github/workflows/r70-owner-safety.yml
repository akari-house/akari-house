name: R70 Owner Safety Patch

on:
  push:
    branches:
      - feature/r70-agreement-tracking

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/r70-agreement-tracking
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Preserve agreement records when owners leave
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/routes/admin-agreements.tsx')
          text = path.read_text()
          replacements = {
            '  ownerUserId: string;': '  ownerUserId: string | null;',
            'COALESCE(op.display_name, ou.username) AS ownerName,': "COALESCE(op.display_name, ou.username, 'Unassigned') AS ownerName,",
            '           JOIN users ou ON ou.id = ar.owner_user_id': '           LEFT JOIN users ou ON ou.id = ar.owner_user_id',
          }
          for old, new in replacements.items():
            if old not in text:
              raise SystemExit(f'Missing expected source fragment: {old}')
            text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          npx prettier --write app/routes/admin-agreements.tsx tests/e2e/agreement-tracking.spec.ts
      - name: Commit patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/routes/admin-agreements.tsx tests/e2e/agreement-tracking.spec.ts
          git commit -m "R70: preserve agreement records when owners leave"
          git push origin HEAD:feature/r70-agreement-tracking

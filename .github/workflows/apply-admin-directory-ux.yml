name: Apply Admin Directory UX

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/admin-directory-ux-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply staged patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat \
            .github/patches/admin-min.part-00 \
            .github/patches/admin-min.part-01a \
            .github/patches/admin-min.part-01b \
            .github/patches/admin-min.part-02 \
            .github/patches/admin-min.part-03 \
            .github/patches/admin-min.part-04 \
            .github/patches/admin-min.part-05 \
            > /tmp/admin-min.b64
          base64 --decode /tmp/admin-min.b64 > /tmp/admin-min.patch
          patch_sha=$(sha256sum /tmp/admin-min.patch | cut -d' ' -f1)
          if [ "$patch_sha" != "164b97a5fdbcb260b2b62c25a4486d2f82e8fa95ef6b7d0e99ca55d798ed27ef" ]; then
            gh pr comment 126 --repo "$GITHUB_REPOSITORY" --body "Admin UX patch integrity failed: expected \`164b97a5...\`, received \`${patch_sha}\`."
            exit 1
          fi
          git apply --check /tmp/admin-min.patch
          git apply /tmp/admin-min.patch
          rm -rf .github/patches
      - run: npm ci
      - name: Format changed source
        run: npm run format
      - name: Commit final implementation
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-admin-directory-ux.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Compact member directory and add scoped admin workspace"
          git push origin HEAD:agent/admin-directory-ux-audit

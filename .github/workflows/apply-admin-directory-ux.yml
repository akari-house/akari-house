name: Finalize Admin Directory UX

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/admin-directory-ux-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply final route and navigation wiring
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("app/root.tsx")
          source = root.read_text()
          marker = 'import "./styles/member-presence.css";'
          addition = marker + '\nimport "./styles/admin-console.css";'
          if 'import "./styles/admin-console.css";' not in source:
              if marker not in source:
                  raise SystemExit("member presence style import not found")
              source = source.replace(marker, addition, 1)
              root.write_text(source)

          routes = Path("app/routes.ts")
          source = routes.read_text()
          marker = '  route("verify-email", "routes/verify-email.tsx"),'
          addition = marker + '\n  route("admin", "routes/admin-workspace.tsx"),'
          if 'route("admin", "routes/admin-workspace.tsx")' not in source:
              if marker not in source:
                  raise SystemExit("verify-email route marker not found")
              source = source.replace(marker, addition, 1)
              routes.write_text(source)

          dashboard = Path("app/routes/dashboard.tsx")
          source = dashboard.read_text()
          marker = '          <Link to="/notifications">Notifications</Link>'
          addition = marker + '\n          {loaderData.adminAccess && (\n            <Link to="/admin">Admin workspace</Link>\n          )}'
          if '<Link to="/admin">Admin workspace</Link>' not in source:
              if marker not in source:
                  raise SystemExit("notifications navigation marker not found")
              source = source.replace(marker, addition, 1)
              dashboard.write_text(source)
          PY
      - run: npm ci
      - run: npm run format
      - run: npm run typecheck
      - name: Remove temporary patch machinery
        run: |
          rm -rf .github/patches .github/payloads
          rm -f .github/admin-patch-error.txt
          rm -f .github/workflows/apply-admin-directory-ux.yml
      - name: Commit final implementation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Compact member directory and add scoped admin workspace"
          git push origin HEAD:agent/admin-directory-ux-audit

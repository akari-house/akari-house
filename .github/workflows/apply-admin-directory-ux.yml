name: Apply Admin Directory UX

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/admin-directory-ux-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply staged patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "Staged part sizes and hashes:"
            wc -c .github/patches/admin-min.part-*
            sha256sum .github/patches/admin-min.part-*
          } > /tmp/admin-part-diagnostic.txt
          cat .github/patches/admin-min.part-* > /tmp/admin-min.b64
          base64 --decode /tmp/admin-min.b64 > /tmp/admin-min.patch
          {
            echo "Patch SHA256: $(sha256sum /tmp/admin-min.patch | cut -d' ' -f1)"
            git apply --check /tmp/admin-min.patch
          } >> /tmp/admin-part-diagnostic.txt 2>&1 || {
            printf '## Admin UX patch integrity diagnostic\n\n```text\n' > /tmp/admin-patch-comment.md
            cat /tmp/admin-part-diagnostic.txt >> /tmp/admin-patch-comment.md
            printf '\n```\n' >> /tmp/admin-patch-comment.md
            gh pr comment 126 --repo "$GITHUB_REPOSITORY" --body-file /tmp/admin-patch-comment.md
            exit 1
          }
          git apply /tmp/admin-min.patch
          rm -rf .github/patches
      - run: npm ci
      - name: Format changed source
        run: npm run format
      - name: Commit final implementation
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-admin-directory-ux.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Compact member directory and add scoped admin workspace"
          git push origin HEAD:agent/admin-directory-ux-audit

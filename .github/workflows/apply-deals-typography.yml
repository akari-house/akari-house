name: Apply Deal Room Typography

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/complete-investor-deals-room
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/fix-deals-typography.mjs
      - run: npm run format
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/routes/deals.tsx tests/unit/deal-room-completion.test.ts
          if git diff --cached --quiet; then
            echo "No Deal Room typography changes required."
          else
            git commit -m "Apply Deal Room typography policy"
            git push
          fi

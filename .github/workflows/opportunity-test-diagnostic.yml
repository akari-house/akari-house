name: Opportunity Test Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  test-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Capture failed tests only
        run: |
          set +e
          npm test -- --reporter=verbose > test-diagnostic.log 2>&1
          status=$?
          python - <<'PY'
          from pathlib import Path
          import re

          value = Path("test-diagnostic.log").read_text(errors="replace")
          value = re.sub(r"\x1b\[[0-9;]*m", "", value)
          marker = "Failed Tests"
          if marker in value:
              value = value[value.index(marker):]
          else:
              lines = value.splitlines()
              matched = []
              for index, line in enumerate(lines):
                  if "FAIL" in line or "AssertionError" in line or "Test Files" in line:
                      matched.extend(lines[max(0, index - 8):min(len(lines), index + 35)])
              value = "\n".join(matched or lines[-120:])
          concise = "\n".join(value.splitlines()[:180])
          Path("test-diagnostic-tail.log").write_text(concise)
          Path("test-diagnostic-issue.md").write_text(
              "Temporary diagnostic for PR #44.\n\n```text\n" + concise + "\n```\n"
          )
          PY
          echo "status=$status" >> "$GITHUB_ENV"
      - name: Create temporary diagnostic issue
        if: env.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Temporary opportunity test diagnostic ${GITHUB_SHA:0:7}" \
            --body-file test-diagnostic-issue.md
      - name: Enforce result
        run: test "$status" = "0"

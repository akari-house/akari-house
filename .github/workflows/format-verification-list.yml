name: Format Verification List

on:
  push:
    branches:
      - agent/verification-list-actions

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/verification-list-actions
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Commit exact formatter output
        run: |
          set -euo pipefail
          rm -f .github/workflows/format-verification-list.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format verification approval centre"
          git push origin HEAD:agent/verification-list-actions

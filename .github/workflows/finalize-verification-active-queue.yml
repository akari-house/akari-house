name: Finalize Verification Active Queue

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/verification-active-queue
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Replace prohibited dash and remove diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/routes/admin-verifications.tsx')
          text = path.read_text()
          old = '<strong>{firstResult}</strong>–<strong>{lastResult}</strong>'
          new = '<strong>{firstResult}</strong> to <strong>{lastResult}</strong>'
          if old not in text:
              raise SystemExit('Expected range separator was not found')
          path.write_text(text.replace(old, new))
          PY
          rm -f .github/workflows/diagnose-verification-tests.yml
          rm -f .github/verification-test-output.txt
          rm -f .github/workflows/finalize-verification-active-queue.yml
      - run: npm ci
      - run: npm run format
      - run: npm run typecheck
      - run: npm test
      - name: Commit final queue implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize scalable verification review queue"
          git push origin HEAD:agent/verification-active-queue

name: R79 E2E Format

on:
  push:
    branches:
      - r79-profile-card-event-publishing

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r79-profile-card-event-publishing
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/e2e/profile-card-events-r79.spec.ts
      - name: Commit formatted E2E test
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/e2e/profile-card-events-r79.spec.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: format R79 browser coverage'
          git push origin HEAD:r79-profile-card-event-publishing

name: Format Project Brand Branch

on:
  push:
    branches:
      - feature/project-brand-assets

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/project-brand-assets
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply repository formatting
        run: npx prettier --write app/components/RouteScrollReset.tsx app/routes/home.tsx app/routes/project-brand.tsx tests/unit/project-brand-media.test.ts
      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/RouteScrollReset.tsx app/routes/home.tsx app/routes/project-brand.tsx tests/unit/project-brand-media.test.ts
          git commit -m "Format project brand implementation"
          git push origin HEAD:feature/project-brand-assets

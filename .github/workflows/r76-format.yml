name: R76 Format
on:
  push:
    branches:
      - r76-security-production-hardening
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r76-security-production-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/security.test.ts
      - name: Commit formatter output
        run: |
          if git diff --quiet -- tests/security.test.ts; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/security.test.ts
          git commit -m "R76: apply repo formatter"
          git push origin HEAD:r76-security-production-hardening

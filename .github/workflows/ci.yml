name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply reviewed ownership-transfer integration
        run: |
          python <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/apply-project-ownership-transfer.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if "python <<'PY'" in line) + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          script = []
          for line in source[start:end]:
              script.append(line[10:] if line.startswith('          ') else line)
          generated = '\n'.join(script) + '\n'
          generated = generated.replace(
              'replace_once(path, old_summary, new_summary)',
              '_text = read(path)\n_start = _text.index("function ProjectSummary(")\n_end = _text.index("\\n\\nexport default function AdminInterests", _start)\nwrite(path, _text[:_start] + new_summary + _text[_end:])',
          )
          generated = generated.replace(
              'replace_once(path, old, new)\n\n# Private brand media',
              '_text = read(path)\n_start = _text.index("async function readOwnedProject(")\n_end = _text.index("\\n\\nexport async function loader", _start)\nwrite(path, _text[:_start] + new + _text[_end:])\n\n# Private brand media',
          )
          Path('/tmp/apply-project-ownership-transfer.py').write_text(generated)
          PY
          sed -i 's/ORDER BY updated_at DESC`,/ORDER BY updated_at DESC`",/' /tmp/apply-project-ownership-transfer.py
          python /tmp/apply-project-ownership-transfer.py
          python <<'PY'
          from pathlib import Path

          path = Path('app/routes/project-detail.tsx')
          text = path.read_text()
          old = "AND (status = 'published' OR created_by = ? OR ? = 1)\n       ORDER BY updated_at DESC,\n    )"
          new = "AND (status = 'published' OR created_by = ? OR ? = 1)\n       ORDER BY updated_at DESC`,\n    )"
          if old not in text:
              raise RuntimeError('Unable to restore the project campaign query delimiter.')
          path.write_text(text.replace(old, new, 1))
          PY
          npx prettier --write \
            app/lib/project-access.server.ts \
            app/routes/admin-interests.tsx \
            app/routes/project-manage.tsx \
            app/routes/project-edit.tsx \
            app/routes/project-needs.tsx \
            app/routes/project-brand.tsx \
            app/routes/project-brand-media.ts \
            app/routes/project-opportunity.tsx \
            app/routes/opportunity-manage.tsx \
            app/routes/project-diligence.tsx \
            app/routes/project-document.ts \
            app/routes/campaign-new.tsx \
            app/routes/project-detail.tsx \
            app/routes/deal-room.tsx \
            tests/project-ownership-transfer.test.ts
          rm -f \
            .github/workflows/apply-project-ownership-transfer.yml \
            .github/workflows/trigger-project-ownership-transfer.yml \
            .ownership-bootstrap-started \
            .ownership-bootstrap-error.log
          git add -N \
            migrations/0111_project_ownership_transfer.sql \
            app/lib/project-access.server.ts \
            tests/project-ownership-transfer.test.ts
          git diff --binary -- . ':(exclude).github/workflows/ci.yml' > ownership-transfer.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ownership-transfer-patch
          path: ownership-transfer.patch
          retention-days: 7
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e

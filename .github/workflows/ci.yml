name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r93-house-polish-and-credibility
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Dependency security gate
        run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - name: Apply exact R93 formatting
        run: npx prettier --write app/styles/profile-card-enhancements.css tests/e2e/profile-card-events-r79.spec.ts
      - name: Commit exact formatter output
        run: |
          if git diff --quiet; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/styles/profile-card-enhancements.css tests/e2e/profile-card-events-r79.spec.ts
          git commit -m "chore: apply exact R93 repository formatting"
          git push origin HEAD:r93-house-polish-and-credibility
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Install pinned Playwright browsers and host dependencies
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run Playwright E2E
        run: npm run test:e2e -- --reporter=json > playwright-results.json
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-ci-report
          path: playwright-results.json
          if-no-files-found: ignore

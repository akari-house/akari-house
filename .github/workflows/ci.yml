name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format complete production patch
        run: |
          npx prettier --write \
            app/components/PublicFooter.tsx \
            app/lib/opportunity-schema.server.ts \
            app/root.tsx \
            app/routes.ts \
            app/routes/deal-room.tsx \
            app/routes/deals.tsx \
            app/styles/footer-theme-fix.css \
            docs/operations/public-navigation-audit.md \
            scripts/production-public-audit.mjs \
            tests/e2e/footer-trust-layer.spec.ts \
            tests/homepage-isolation.test.ts \
            tests/navigation-destinations.test.ts \
            tests/unit/public-discovery.test.tsx
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - name: Restore permanent workflow set
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f .github/workflows/format-navigation-fix.yml
      - name: Commit validated formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format navigation and footer production fix"
          git push

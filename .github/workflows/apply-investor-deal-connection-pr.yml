name: Apply Investor Deal Connection on PR

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/connect-investor-profile-deals'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/connect-investor-profile-deals
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Extract and run the reviewed patch
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-investor-deal-connection.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          block = workflow[start:end]
          patch = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in block.splitlines()
          )
          Path('/tmp/apply-investor-deal-connection.py').write_text(patch + "\n")
          PY
          python /tmp/apply-investor-deal-connection.py
          rm .github/workflows/apply-investor-deal-connection.yml
      - run: npm run format
      - run: npm run typecheck
      - run: npm test -- --run tests/investor-deal-matching.test.ts
      - name: Commit the implementation
        run: |
          rm .github/workflows/apply-investor-deal-connection-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/investor-matching.server.ts app/routes/deals.tsx app/routes/investor-settings.tsx app/styles/opportunities.css tests/investor-deal-matching.test.ts tests/e2e/curated-opportunities.spec.ts .github/workflows/apply-investor-deal-connection.yml .github/workflows/apply-investor-deal-connection-pr.yml
          git commit -m "Connect Investor profile to deal discovery"
          git push origin HEAD:agent/connect-investor-profile-deals

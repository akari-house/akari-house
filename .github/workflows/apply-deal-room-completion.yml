name: Apply Deal Room Completion

on:
  push:
    branches: [fix/complete-investor-deals-room]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply scoped Deal Room repair') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/complete-investor-deals-room
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply source patch
        run: node scripts/patch-deal-room-completion.mjs
      - name: Format changed source
        run: npx prettier --write app/routes/deal-room.tsx
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/routes/deal-room.tsx
          if git diff --cached --quiet; then
            echo "No source changes required."
          else
            git commit -m "Apply scoped Deal Room repair"
            git push
          fi

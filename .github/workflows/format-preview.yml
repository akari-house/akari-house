name: Format Preview

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format
      - uses: actions/upload-artifact@v4
        with:
          name: prettier-output
          path: |
            README.md
            app/lib/operations.ts
            app/routes.ts
            app/routes/admin-contact.tsx
            app/routes/admin-operations.tsx
            tests/unit/operations.test.ts
          if-no-files-found: error

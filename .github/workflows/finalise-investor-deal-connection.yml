name: Finalise Investor Deal Connection

on:
  push:
    branches:
      - agent/connect-investor-profile-deals
    paths:
      - .github/workflows/finalise-investor-deal-connection.yml

permissions:
  contents: write

jobs:
  finalise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/connect-investor-profile-deals
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refine default sort copy and release scope
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/routes/deals.tsx")
          content = path.read_text()
          old = '<option value="">Best profile match</option>'
          new = '''<option value="">
                    {investorProfile?.complete
                      ? "Best profile match"
                      : "Recommended"}
                  </option>'''
          if content.count(old) != 1:
              raise SystemExit(f"Expected one sort label, found {content.count(old)}")
          path.write_text(content.replace(old, new, 1))
          PY
          rm -f \
            docs/operations/investor-house-access-boundary.md \
            docs/operations/investor-house-no-advice.md \
            docs/operations/investor-house-release-checklist.md \
            docs/operations/investor-house-release-note.md \
            docs/operations/investor-house-scope.md
          rm .github/workflows/finalise-investor-deal-connection.yml
      - run: npm run format
      - run: npm run typecheck
      - run: npm test -- --run tests/investor-deal-matching.test.ts
      - name: Commit final release scope
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine Investor deal matching"
          git push origin HEAD:agent/connect-investor-profile-deals

name: Diagnose Launch Gate

on:
  pull_request:
    paths:
      - ".github/workflows/diagnose-launch-gate.yml"

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Capture diagnostics
        run: |
          mkdir -p docs
          npx eslint \
            app/lib/launch-gate-evidence.ts \
            app/lib/launch-gate-schema.server.ts \
            app/routes.ts \
            app/routes/admin-launch-gate.tsx \
            app/routes/test-persona.ts \
            scripts/build-launch-gate-report.mjs \
            tests/e2e/launch-gate.spec.ts \
            tests/unit/launch-gate-evidence.test.ts \
            > docs/launch-gate-lint.txt 2>&1 || true
          if [ ! -s docs/launch-gate-lint.txt ]; then
            echo "No targeted lint diagnostics." > docs/launch-gate-lint.txt
          fi
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/launch-gate-lint.txt
          git commit -m "Capture launch gate lint diagnostics"
          git push

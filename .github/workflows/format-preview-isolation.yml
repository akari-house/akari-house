name: Format Preview Isolation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write wrangler.jsonc package.json tests/deployment-isolation.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wrangler.jsonc package.json tests/deployment-isolation.test.ts
          if git diff --cached --quiet; then
            echo "Formatting already clean."
            exit 0
          fi
          git commit -m "Format preview isolation hotfix"
          git push

name: R96 Format Fix

on:
  push:
    branches:
      - r96-pilot-readiness

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r96-pilot-readiness
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write app/routes/project-manage.tsx app/routes/project-new.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/routes/project-manage.tsx app/routes/project-new.tsx
          git diff --cached --quiet || git commit -m "style: format R96 Founder readiness routes"
          git push origin HEAD:r96-pilot-readiness

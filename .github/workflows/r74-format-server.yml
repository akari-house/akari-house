name: R74 Format Server

on:
  push:
    branches:
      - r74-reporting-notifications-operating-rhythm

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r74-reporting-notifications-operating-rhythm
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write app/lib/operating-rhythm.server.ts
      - run: npx prettier --check app/lib/operating-rhythm.server.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/operating-rhythm.server.ts
          git commit -m "R74: format operating rhythm server"
          git push origin HEAD:r74-reporting-notifications-operating-rhythm

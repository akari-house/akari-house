name: Patch Footer Horizon Cross Browser

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Remove decorative overflow and normalise motion assertion
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path("app/styles/footer.css")
          css = css_path.read_text()
          replacements = [
              ("  right: -5vw;\n  bottom: -4rem;\n  left: -5vw;", "  right: 0;\n  bottom: -4rem;\n  left: 0;"),
              ("    right: -12vw;\n    bottom: -3rem;\n    left: -12vw;", "    right: 0;\n    bottom: -3rem;\n    left: 0;"),
          ]
          for old, new in replacements:
              if css.count(old) != 1:
                  raise SystemExit(f"Expected one CSS block: {old!r}")
              css = css.replace(old, new, 1)
          css_path.write_text(css)

          test_path = Path("tests/e2e/footer-trust-layer.spec.ts")
          test = test_path.read_text()
          old = '''  await expect(landscape).toHaveCSS("transition-duration", "0s");
          await expect(landscape).toHaveCSS("transform", "none");'''
          new = '''  const longestTransition = await landscape.evaluate((element) =>
            Math.max(
              ...getComputedStyle(element)
                .transitionDuration.split(",")
                .map((value) => Number.parseFloat(value) || 0),
            ),
          );
          expect(longestTransition).toBeLessThanOrEqual(0.001);
          await expect(landscape).toHaveCSS("transform", "none");'''
          if test.count(old) != 1:
              raise SystemExit("Expected one reduced-motion assertion block.")
          test_path.write_text(test.replace(old, new, 1))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write app/styles/footer.css tests/e2e/footer-trust-layer.spec.ts
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/styles/footer.css tests/e2e/footer-trust-layer.spec.ts
          git commit -m "Fix footer horizon cross-browser assertions"
          git push

name: Fix Project Needs Lint

on:
  pull_request:
    paths:
      - "app/lib/project-needs.ts"
      - "app/components/projects/**"
      - "app/styles/project-needs.css"
      - "app/root.tsx"
      - "app/routes/project-new.tsx"
      - "app/routes/project-needs.tsx"
      - "app/routes/project-manage.tsx"
      - "app/routes/projects.tsx"
      - "app/components/discovery/ProjectLanternCard.tsx"
      - "app/routes.ts"
      - "tests/project-needs.test.ts"

permissions:
  contents: write

jobs:
  lint-fix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run ESLint fixes and capture remaining output
        run: |
          set +e
          npm run lint -- --fix > /tmp/project-needs-lint.txt 2>&1
          STATUS=$?
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$STATUS" -ne 0 ]; then
            cp /tmp/project-needs-lint.txt .github/project-needs-lint-output.txt
          else
            rm -f .github/project-needs-lint-output.txt
          fi
          git add app tests .github/project-needs-lint-output.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Fix project needs lint"
            git push
          fi

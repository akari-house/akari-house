name: Bootstrap Project Ownership Transfer

# Trigger diagnostic capture for PR #151. Remove after the branch is updated.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap-project-ownership-transfer.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/project-ownership-transfer
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Extract and apply reviewed integration script
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/apply-project-ownership-transfer.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if "python <<'PY'" in line) + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          script = []
          for line in source[start:end]:
              script.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply-project-ownership-transfer.py').write_text('\n'.join(script) + '\n')
          PY
          set +e
          python /tmp/apply-project-ownership-transfer.py > /tmp/ownership-bootstrap.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
            cp /tmp/ownership-bootstrap.log .ownership-bootstrap-error.log
            git add .ownership-bootstrap-error.log
            git commit -m "Record ownership bootstrap failure"
            git push origin HEAD:feature/project-ownership-transfer
            exit "$status"
          fi
      - name: Format changed application files
        run: |
          set +e
          npx prettier --write \
            app/lib/project-access.server.ts \
            app/routes/admin-interests.tsx \
            app/routes/project-manage.tsx \
            app/routes/project-edit.tsx \
            app/routes/project-needs.tsx \
            app/routes/project-brand.tsx \
            app/routes/project-brand-media.ts \
            app/routes/project-opportunity.tsx \
            app/routes/opportunity-manage.tsx \
            app/routes/project-diligence.tsx \
            app/routes/project-document.ts \
            app/routes/campaign-new.tsx \
            app/routes/project-detail.tsx \
            app/routes/deal-room.tsx \
            tests/project-ownership-transfer.test.ts > /tmp/ownership-format.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
            cp /tmp/ownership-format.log .ownership-bootstrap-error.log
            git add .ownership-bootstrap-error.log
            git commit -m "Record ownership formatting failure"
            git push origin HEAD:feature/project-ownership-transfer
            exit "$status"
          fi
      - name: Remove temporary files and push implementation
        run: |
          rm .github/workflows/apply-project-ownership-transfer.yml
          rm .github/workflows/trigger-project-ownership-transfer.yml
          rm -f .ownership-bootstrap-started .ownership-bootstrap-error.log
          git add -A
          git commit -m "Add audited project ownership transfers"
          git push origin HEAD:feature/project-ownership-transfer

name: Diagnose Verification Queue Browser Test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/verification-active-queue
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Capture browser output
        run: |
          set +e
          npm run test:e2e > .github/verification-e2e-output.txt 2>&1
          status=$?
          echo "exit_status=${status}" >> .github/verification-e2e-output.txt
          rm -f .github/workflows/diagnose-verification-e2e.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record verification queue browser diagnostic"
          git push origin HEAD:agent/verification-active-queue
          exit 0

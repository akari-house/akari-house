name: R85 Reconciliation Inventory

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/r85-reconciliation-inventory.yml"
      - "scripts/reconciliation/**"
      - "docs/r84-house-legacy-crm-inventory.sql"
      - "docs/R84_RECONCILIATION_CHECKLIST.md"

permissions:
  contents: read
  issues: write

concurrency:
  group: r85-reconciliation-inventory
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RECOVERY_BACKUP_ENCRYPTION_KEY: ${{ secrets.RECOVERY_BACKUP_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Mark credential-check stage
        run: echo "R85_STAGE=credentials" >> "$GITHUB_ENV"

      - name: Require encrypted-backup credentials
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN is required."; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID is required."; exit 1; }
          test -n "${RECOVERY_BACKUP_ENCRYPTION_KEY:-}" || { echo "RECOVERY_BACKUP_ENCRYPTION_KEY is required."; exit 1; }

      - name: Mark database-resolution stage
        run: echo "R85_STAGE=database-resolution" >> "$GITHUB_ENV"

      - name: Resolve House and CRM production D1 databases
        run: |
          set -euo pipefail
          mkdir -p private/reconciliation
          npx wrangler d1 list --json > private/reconciliation/d1-list.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const payload = JSON.parse(fs.readFileSync("private/reconciliation/d1-list.json", "utf8"));
          const rows = Array.isArray(payload) ? payload : payload.result ?? [];
          const idFor = (name) => {
            const row = rows.find((entry) => (entry.name ?? entry.database_name) === name);
            return row?.uuid ?? row?.database_id ?? row?.id ?? null;
          };
          const house = idFor("akari-house-db");
          const crm = idFor("akari-crm-production");
          if (!house || !crm) throw new Error("Both production D1 databases must be visible to the recovery token.");
          console.log(`::add-mask::${house}`);
          console.log(`::add-mask::${crm}`);
          fs.appendFileSync(process.env.GITHUB_ENV, `R85_HOUSE_DB_ID=${house}\nR85_CRM_DB_ID=${crm}\n`);
          NODE
          rm -f private/reconciliation/d1-list.json

      - name: Mark encrypted-backup stage
        run: echo "R85_STAGE=encrypted-backup" >> "$GITHUB_ENV"

      - name: Export, encrypt and verify fresh production backups
        run: |
          set -euo pipefail
          timestamp=$(date -u +%Y%m%dT%H%M%SZ)
          house_key="reconciliation-backups/${timestamp}/akari-house-db.sql.gz.enc"
          crm_key="reconciliation-backups/${timestamp}/akari-crm-production.sql.gz.enc"

          npx wrangler d1 export akari-house-db --remote --output=private/reconciliation/house.sql --skip-confirmation
          npx wrangler d1 export akari-crm-production --remote --output=private/reconciliation/crm.sql --skip-confirmation
          test -s private/reconciliation/house.sql
          test -s private/reconciliation/crm.sql

          house_plain_sha=$(sha256sum private/reconciliation/house.sql | awk '{print $1}')
          crm_plain_sha=$(sha256sum private/reconciliation/crm.sql | awk '{print $1}')
          gzip -9 -c private/reconciliation/house.sql > private/reconciliation/house.sql.gz
          gzip -9 -c private/reconciliation/crm.sql > private/reconciliation/crm.sql.gz
          node scripts/recovery/backup-crypto.mjs encrypt private/reconciliation/house.sql.gz private/reconciliation/house.sql.gz.enc
          node scripts/recovery/backup-crypto.mjs encrypt private/reconciliation/crm.sql.gz private/reconciliation/crm.sql.gz.enc

          node scripts/recovery/backup-crypto.mjs decrypt private/reconciliation/house.sql.gz.enc private/reconciliation/house.verify.sql.gz
          node scripts/recovery/backup-crypto.mjs decrypt private/reconciliation/crm.sql.gz.enc private/reconciliation/crm.verify.sql.gz
          gunzip -c private/reconciliation/house.verify.sql.gz > private/reconciliation/house.verify.sql
          gunzip -c private/reconciliation/crm.verify.sql.gz > private/reconciliation/crm.verify.sql
          test "$(sha256sum private/reconciliation/house.verify.sql | awk '{print $1}')" = "${house_plain_sha}"
          test "$(sha256sum private/reconciliation/crm.verify.sql | awk '{print $1}')" = "${crm_plain_sha}"

          house_encrypted_sha=$(sha256sum private/reconciliation/house.sql.gz.enc | awk '{print $1}')
          crm_encrypted_sha=$(sha256sum private/reconciliation/crm.sql.gz.enc | awk '{print $1}')
          npx wrangler r2 object put "akari-house-media/${house_key}" --file=private/reconciliation/house.sql.gz.enc --remote
          npx wrangler r2 object put "akari-house-media/${crm_key}" --file=private/reconciliation/crm.sql.gz.enc --remote

          jq -n \
            --arg createdAt "${timestamp}" \
            --arg houseKey "${house_key}" \
            --arg houseSha256 "${house_encrypted_sha}" \
            --arg crmKey "${crm_key}" \
            --arg crmSha256 "${crm_encrypted_sha}" \
            '{createdAt:$createdAt,house:{storage:"R2",key:$houseKey,sha256:$houseSha256,encrypted:true},crm:{storage:"R2",key:$crmKey,sha256:$crmSha256,encrypted:true}}' \
            > private/reconciliation/backups.json

          rm -f private/reconciliation/house.sql private/reconciliation/crm.sql \
            private/reconciliation/house.sql.gz private/reconciliation/crm.sql.gz \
            private/reconciliation/house.verify.sql private/reconciliation/crm.verify.sql \
            private/reconciliation/house.verify.sql.gz private/reconciliation/crm.verify.sql.gz

      - name: Mark count-only inventory stage
        run: echo "R85_STAGE=count-only-inventory" >> "$GITHUB_ENV"

      - name: Run count-only House and CRM inventory
        run: |
          set -euo pipefail
          query_d1() {
            db_id="$1"; sql_file="$2"; output_file="$3"
            payload_file="${output_file}.payload"
            jq -Rs '{sql:.}' "${sql_file}" > "${payload_file}"
            http_code=$(curl --silent --show-error --output "${output_file}" --write-out '%{http_code}' -X POST \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data @"${payload_file}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${db_id}/query" || true)
            rm -f "${payload_file}"
            test "${http_code}" -ge 200 2>/dev/null && test "${http_code}" -lt 300 2>/dev/null
            test "$(jq -r '.success // false' "${output_file}")" = "true"
            test "$(jq -r '(.errors // []) | length' "${output_file}")" = "0"
            test "$(jq -r '[.result[]? | (.success // true) == false] | any' "${output_file}")" = "false"
          }

          query_d1 "${R85_HOUSE_DB_ID}" docs/r84-house-legacy-crm-inventory.sql private/reconciliation/house-inventory.json

          cat > private/reconciliation/tenant-census.sql <<'SQL'
          SELECT id FROM tenants ORDER BY created_at, id;
          SQL
          query_d1 "${R85_CRM_DB_ID}" private/reconciliation/tenant-census.sql private/reconciliation/tenant-census.json
          node scripts/reconciliation/r85-inventory.mjs select-tenant \
            private/reconciliation/tenant-census.json \
            private/reconciliation/tenant-selection.json

          tenant_status=$(jq -r '.status' private/reconciliation/tenant-selection.json)
          if [ "${tenant_status}" = "unique" ]; then
            curl --fail --silent --show-error \
              "https://raw.githubusercontent.com/akari-house/CRMAKARI/bab2777a984b0dfdd95a3de84de695e206469661/docs/house-crm-reconciliation-inventory.sql" \
              -o private/reconciliation/crm-inventory-source.sql
            node scripts/reconciliation/r85-inventory.mjs prepare-crm-sql \
              private/reconciliation/crm-inventory-source.sql \
              private/reconciliation/tenant-selection.json \
              private/reconciliation/crm-inventory.sql
            query_d1 "${R85_CRM_DB_ID}" private/reconciliation/crm-inventory.sql private/reconciliation/crm-inventory.json
          else
            printf '{"skipped":true}\n' > private/reconciliation/crm-inventory.json
          fi

      - name: Mark private-persistence stage
        run: echo "R85_STAGE=private-persistence" >> "$GITHUB_ENV"

      - name: Persist private reconciliation snapshot in House D1
        run: |
          set -euo pipefail
          node scripts/reconciliation/r85-inventory.mjs finalize \
            private/reconciliation/house-inventory.json \
            private/reconciliation/crm-inventory.json \
            private/reconciliation/tenant-selection.json \
            private/reconciliation/backups.json \
            private/reconciliation/audit.sql \
            private/reconciliation/status.json

          jq -Rs '{sql:.}' private/reconciliation/audit.sql > private/reconciliation/audit-payload.json
          http_code=$(curl --silent --show-error --output private/reconciliation/audit-response.json --write-out '%{http_code}' -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data @private/reconciliation/audit-payload.json \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${R85_HOUSE_DB_ID}/query" || true)
          test "${http_code}" -ge 200 2>/dev/null && test "${http_code}" -lt 300 2>/dev/null
          test "$(jq -r '.success // false' private/reconciliation/audit-response.json)" = "true"
          test "$(jq -r '(.errors // []) | length' private/reconciliation/audit-response.json)" = "0"
          rm -f private/reconciliation/audit.sql private/reconciliation/audit-payload.json private/reconciliation/audit-response.json

      - name: Mark sanitized-artifact stage
        run: echo "R85_STAGE=sanitized-artifact" >> "$GITHUB_ENV"

      - name: Upload sanitized R85 status only
        uses: actions/upload-artifact@v4
        with:
          name: r85-reconciliation-status-${{ github.sha }}
          path: private/reconciliation/status.json
          retention-days: 30
          if-no-files-found: error

      - name: Mark sanitized-status stage
        run: echo "R85_STAGE=sanitized-status" >> "$GITHUB_ENV"

      - name: Record sanitized checkpoint status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          record_id=$(jq -r '.privateRecordId' private/reconciliation/status.json)
          tenant_resolution=$(jq -r '.tenantResolution' private/reconciliation/status.json)
          gh issue comment 31 --repo "${GITHUB_REPOSITORY}" --body "✅ R85 encrypted backups and count-only House/CRM reconciliation inventory completed for commit \`${GITHUB_SHA}\`. Full counts are stored privately in House D1 under reconciliation record \`${record_id}\`. CRM tenant resolution: \`${tenant_resolution}\`. No mapping writes were made and the NDA bridge remains in \`legacy\` mode."

      - name: Remove all reconciliation working files
        if: always()
        run: rm -rf private/reconciliation

      - name: Record sanitized failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stage="${R85_STAGE:-unknown}"
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh issue comment 31 --repo "${GITHUB_REPOSITORY}" --body "❌ R85 reconciliation inventory did not complete for commit \`${GITHUB_SHA}\` at sanitized stage \`${stage}\`. No mapping or authority changes were attempted; production remains in \`legacy\` NDA mode. Run: ${run_url}"

name: R88 Format Fix

on:
  push:
    branches:
      - r88-house-public-journey-cleanup

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r88-house-public-journey-cleanup
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format R88 files with repository Prettier
        run: >-
          npx prettier --write
          app/routes/home.tsx
          app/components/HouseMemberPresence.tsx
          app/components/discovery/HouseInMotion.tsx
          app/styles/member-presence.css
          tests/e2e/public-journey.spec.ts
          tests/unit/house-member-presence.test.tsx
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "R88 files already match repository formatting."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/routes/home.tsx app/components/HouseMemberPresence.tsx app/components/discovery/HouseInMotion.tsx app/styles/member-presence.css tests/e2e/public-journey.spec.ts tests/unit/house-member-presence.test.tsx
          git commit -m "R88: apply repository formatting"
          git push origin HEAD:r88-house-public-journey-cleanup

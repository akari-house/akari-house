name: R76D Format

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'feature/r76d-project-ownership-verification'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply repository formatting
        run: >-
          npx prettier --write
          app/lib/project-relationships.server.ts
          app/routes/admin-project-claims.tsx
          app/routes/project-claim.tsx
          app/routes/project-manage.tsx
          tests/project-relationship-claims.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/project-relationships.server.ts app/routes/admin-project-claims.tsx app/routes/project-claim.tsx app/routes/project-manage.tsx tests/project-relationship-claims.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "R76D apply repository formatting"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

name: Opportunity Document Lint Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  lint-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Capture lint finding
        run: |
          set +e
          npm run lint > lint-diagnostic.log 2>&1
          status=$?
          python - <<'PY'
          from pathlib import Path
          import re

          value = Path("lint-diagnostic.log").read_text(errors="replace")
          value = re.sub(r"\x1b\[[0-9;]*m", "", value)
          lines = value.splitlines()
          selected = []
          for index, line in enumerate(lines):
              if re.search(r"\s+\d+:\d+\s+error\s+", line):
                  selected.extend(lines[max(0, index - 2):min(len(lines), index + 3)])
          concise = "\n".join(dict.fromkeys(selected)) or "No concise lint line was captured."
          Path("lint-issue.md").write_text(
              "Temporary diagnostic for PR #44.\n\n```text\n" + concise + "\n```\n"
          )
          PY
          echo "status=$status" >> "$GITHUB_ENV"
      - name: Create temporary diagnostic issue
        if: env.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Temporary document lint diagnostic ${GITHUB_SHA:0:7}" \
            --body-file lint-issue.md
      - name: Enforce result
        run: test "$status" = "0"

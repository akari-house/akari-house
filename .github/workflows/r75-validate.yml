name: R75 Validate
on:
  push:
    branches:
      - r75-commercial-saas-completion
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r75-commercial-saas-completion
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/r75-finalize.mjs
      - run: npx prettier --write app/lib/commercial-saas.ts app/lib/commercial-saas.server.ts app/lib/commercial-attention.server.ts app/lib/saas-workspace.server.ts app/lib/workspace-invitations.server.ts app/lib/operating-rhythm.ts app/lib/operating-rhythm.server.ts app/lib/admin-workspace.ts app/lib/email.server.ts app/routes.ts app/routes/login.tsx app/routes/admin-finance.tsx app/routes/admin-saas-workspaces.tsx app/routes/saas-workspace.tsx app/routes/workspace-invitation-accept.tsx tests/commercial-saas.test.ts
      - run: npm run typecheck
      - run: npm test -- --run tests/commercial-saas.test.ts
      - name: Commit validated integration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app tests/commercial-saas.test.ts
          git commit -m "R75: finalize validated integration"
          git push origin HEAD:r75-commercial-saas-completion

name: R90 Format Final

on:
  push:
    branches:
      - r90-house-boundary-final

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r90-house-boundary-final
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write app/routes/login.tsx tests/unit/r90-house-crm-boundary.test.ts
      - name: Commit canonical formatting and remove temporary workflow
        run: |
          rm -f .github/workflows/r90-format-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git commit -m "R90: apply canonical Prettier formatting"
          git push origin HEAD:r90-house-boundary-final

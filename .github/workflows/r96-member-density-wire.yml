name: R96 Member Density Wire

on:
  push:
    branches:
      - r96-project-detail-pilot-console

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r96-project-detail-pilot-console
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Wire final member-density stylesheet
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/root.tsx')
          text = path.read_text()
          needle = 'import "./styles/r91-launch-experience.css";\n'
          addition = 'import "./styles/r96-member-directory-density.css";\n'
          if addition not in text:
              text = text.replace(needle, needle + addition)
          path.write_text(text)
          PY
          npx prettier --write app/root.tsx app/styles/r96-member-directory-density.css
      - name: Commit final density wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/root.tsx app/styles/r96-member-directory-density.css
          git diff --cached --quiet || git commit -m "fix: compact member directory list rows"
          git push origin HEAD:r96-project-detail-pilot-console

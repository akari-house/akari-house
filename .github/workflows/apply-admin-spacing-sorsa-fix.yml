name: Apply admin spacing and Sorsa correction

on:
  push:
    branches:
      - agent/admin-spacing-sorsa-range

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/admin-spacing-sorsa-range
      - run: python scripts/apply-admin-spacing-sorsa-fix.py
      - name: Commit product corrections
        run: |
          git config user.name "AKARI automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/routes/dashboard.tsx app/routes/admin-operations.tsx app/root.tsx app/styles/admin-operations-spacing.css tests/profile-score-navigation.test.ts tests/admin-operations-spacing.test.ts
          if git diff --cached --quiet; then
            echo "Corrections are already applied."
          else
            git commit -m "Fix admin section spacing and support larger Sorsa scores"
            git push origin HEAD:agent/admin-spacing-sorsa-range
          fi

name: Format Campaign Operations

on:
  pull_request:
    paths:
      - ".github/workflows/format-campaign-operations.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write app/routes.ts app/routes/admin-campaign-operations.tsx app/routes/health.ts app/lib/campaign-reminders.server.ts app/lib/campaign-operations-schema.server.ts tests/unit/campaign-operations.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app tests
          git commit -m "Format campaign ownership release"
          git push

name: R69 Format

on:
  push:
    branches:
      - feature/r69-campaign-closeout-renewal

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.event.head_commit.message != 'R69 format E2E files' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/r69-campaign-closeout-renewal
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format R69 E2E files
        run: >-
          npx prettier --write
          app/routes/test-campaign-closeout.ts
          tests/e2e/campaign-closeout.spec.ts
          app/routes.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/routes/test-campaign-closeout.ts tests/e2e/campaign-closeout.spec.ts app/routes.ts
          git commit -m "R69 format E2E files"
          git push

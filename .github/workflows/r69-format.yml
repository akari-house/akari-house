name: R69 Format

on:
  push:
    branches:
      - feature/r69-campaign-closeout-renewal

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.event.head_commit.message != 'R69 final format' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/r69-campaign-closeout-renewal
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format final R69 files
        run: >-
          npx prettier --write
          scripts/production-public-audit.mjs
          tests/campaign-closeout.test.ts
          tests/e2e/launch-visual-evidence.spec.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/production-public-audit.mjs tests/campaign-closeout.test.ts tests/e2e/launch-visual-evidence.spec.ts
          git commit -m "R69 final format"
          git push
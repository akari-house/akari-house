name: Verify Authentication Journeys

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify-auth:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/auth-password-ux
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Run authentication journeys
        run: |
          set +e
          npx playwright test tests/e2e/auth-password-ux.spec.ts --reporter=line --retries=0 > /tmp/auth-output.txt 2>&1
          auth_status=$?
          npx playwright test tests/e2e/public-journey.spec.ts --grep "membership request remains gated" --project=desktop-chromium --reporter=line --retries=0 > /tmp/membership-output.txt 2>&1
          membership_status=$?
          {
            echo "=== AUTHENTICATION JOURNEYS ==="
            cat /tmp/auth-output.txt
            echo "auth_exit_status=${auth_status}"
            echo "=== EXISTING MEMBERSHIP JOURNEY ==="
            cat /tmp/membership-output.txt
            echo "membership_exit_status=${membership_status}"
          } > .github/auth-journey-results.txt
          rm -f .github/workflows/verify-auth-journeys.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record isolated authentication journey results"
          git pull --rebase origin agent/auth-password-ux
          git push origin HEAD:agent/auth-password-ux
          exit 0

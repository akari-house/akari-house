name: Diagnose Navigation Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply canonical route fallback
        run: python scripts/finalise-navigation-fix.py
      - run: |
          npx prettier --write \
            app/routes.ts \
            app/routes/deals.tsx \
            app/routes/deal-room.tsx \
            app/lib/opportunity-schema.server.ts \
            tests/navigation-destinations.test.ts
      - run: npm run typecheck
      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep deal routes available during schema activation"
          git push

name: Diagnose Navigation Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Correct patch sequencing
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/finalise-navigation-fix.py")
          value = path.read_text()
          needle = "expected = '''"
          if "navigation_test.write_text(value)\nexpected = '''" not in value:
              if needle not in value:
                  raise SystemExit("Navigation test insertion point not found.")
              value = value.replace(
                  needle,
                  "navigation_test.write_text(value)\nexpected = '''",
                  1,
              )
          path.write_text(value)
          PY
      - name: Apply canonical route fallback
        run: |
          set +e
          python scripts/finalise-navigation-fix.py > patch.log 2>&1
          status=$?
          echo "patch_status=$status" >> "$GITHUB_ENV"
          cat patch.log
      - name: Upload patch diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-patch-${{ github.sha }}
          path: patch.log
          retention-days: 2
      - name: Enforce patch
        run: test "$patch_status" = "0"
      - run: |
          npx prettier --write \
            app/routes.ts \
            app/routes/deals.tsx \
            app/routes/deal-room.tsx \
            app/lib/opportunity-schema.server.ts \
            tests/navigation-destinations.test.ts
      - run: npm run typecheck
      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep deal routes available during schema activation"
          git push

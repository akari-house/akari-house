name: Diagnose Navigation Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Capture typecheck
        run: |
          set +e
          npm run typecheck > typecheck.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_ENV"
          tail -n 180 typecheck.log > typecheck-tail.log
      - name: Upload typecheck diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-typecheck-${{ github.sha }}
          path: typecheck-tail.log
          retention-days: 2
      - name: Enforce
        run: test "$status" = "0"

name: R79 Live Feature Smoke

on:
  push:
    branches:
      - r79-profile-card-event-publishing

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      PRODUCTION_URL: https://akarihouse.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Create short-lived production smoke session
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > d1.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const payload = JSON.parse(fs.readFileSync('d1.json','utf8'));
          const rows = Array.isArray(payload) ? payload : (payload.result ?? []);
          const db = rows.find((x) => x.name === 'akari-house-db' || x.database_name === 'akari-house-db');
          const id = db?.uuid ?? db?.database_id ?? db?.id;
          if (!id) throw new Error('akari-house-db not found');
          const config = {
            name: 'akari-house', main: './worker/index.ts', compatibility_date: '2026-07-23',
            d1_databases: [{ binding: 'DB', database_name: 'akari-house-db', database_id: id }]
          };
          fs.writeFileSync('r79-smoke-wrangler.jsonc', JSON.stringify(config, null, 2));
          NODE
          npx wrangler d1 execute DB --remote --config r79-smoke-wrangler.jsonc --json --command \
            "SELECT u.id FROM users u JOIN admin_users au ON au.user_id = u.id WHERE u.status = 'active' AND au.access_level = 'superadmin' ORDER BY u.created_at, u.id LIMIT 1" > owner.json
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          const payload = JSON.parse(fs.readFileSync('owner.json','utf8'));
          const entries = Array.isArray(payload) ? payload : [payload];
          const row = entries.flatMap((entry) => entry.results ?? entry.result?.results ?? [])[0];
          if (!row?.id) throw new Error('Superadmin owner account not found');
          const token = crypto.randomBytes(48).toString('hex');
          const hash = crypto.createHash('sha256').update(token).digest('base64');
          const session = crypto.randomUUID();
          const q = (value) => `'${String(value).replaceAll("'", "''")}'`;
          fs.writeFileSync('token.txt', token);
          fs.writeFileSync('session.txt', session);
          fs.writeFileSync('session.sql', `INSERT INTO sessions (id, user_id, token_hash, expires_at) VALUES (${q(session)}, ${q(row.id)}, ${q(hash)}, datetime('now', '+15 minutes'));\n`);
          NODE
          npx wrangler d1 execute DB --remote --config r79-smoke-wrangler.jsonc --file session.sql >/dev/null
      - name: Verify live profile card and event publishing UI
        run: |
          set -euo pipefail
          token=$(cat token.txt)
          card_status=$(curl -sS --max-time 30 -o profile-card.html -w '%{http_code}' -H "Cookie: akari_session=${token}" "${PRODUCTION_URL}/profile-card")
          event_status=$(curl -sS --max-time 30 -o event-new.html -w '%{http_code}' -H "Cookie: akari_session=${token}" "${PRODUCTION_URL}/events/new")
          test "$card_status" = "200"
          test "$event_status" = "200"
          grep -q 'glass-profile-card' profile-card.html
          grep -q 'Midnight Glass' profile-card.html
          grep -q 'Pearl Glass' profile-card.html
          grep -q 'Sakura Glass' profile-card.html
          grep -q 'Blossom Plum' profile-card.html
          grep -q 'Lantern Gold' profile-card.html
          grep -q '/assets/brand/akari-logo-horizontal.png' profile-card.html
          grep -q 'Publish event' event-new.html
          grep -q 'Publish now is enabled' event-new.html
          gh issue comment 31 --repo "$GITHUB_REPOSITORY" --body "✅ R79 live feature smoke passed on \`akarihouse.com\`: authenticated \`/profile-card\` rendered the AKARI glass credit-card UI with all five themes and official logo asset, and authenticated Superadmin \`/events/new\` rendered the direct **Publish event** flow. No production event was created."
      - name: Remove short-lived smoke session
        if: always()
        run: |
          set +e
          if [ -f session.txt ] && [ -f r79-smoke-wrangler.jsonc ]; then
            session=$(sed "s/'/''/g" session.txt)
            npx wrangler d1 execute DB --remote --config r79-smoke-wrangler.jsonc --command "DELETE FROM sessions WHERE id = '${session}'" >/dev/null
          fi
          rm -f token.txt session.txt session.sql owner.json profile-card.html event-new.html d1.json r79-smoke-wrangler.jsonc

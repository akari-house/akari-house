name: R73 Format Fix

on:
  push:
    branches:
      - r73-relationship-intelligence-360

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r73-relationship-intelligence-360
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format R73 TypeScript
        run: >-
          npx prettier --write
          app/lib/relationship-intelligence.ts
          app/routes/admin-relationship-detail.tsx
          app/routes/admin-relationships.tsx
          tests/relationship-intelligence.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/relationship-intelligence.ts app/routes/admin-relationship-detail.tsx app/routes/admin-relationships.tsx tests/relationship-intelligence.test.ts
          git commit -m "R73: apply repository formatting"
          git push origin HEAD:r73-relationship-intelligence-360

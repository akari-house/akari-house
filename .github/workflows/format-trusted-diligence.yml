name: Format Trusted Diligence

on:
  pull_request:
    paths:
      - ".github/workflows/format-trusted-diligence.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write app/routes/project-diligence.tsx app/routes/project-document.ts app/routes/admin-verifications.tsx app/routes/project-manage.tsx app/routes/health.ts app/routes.ts app/lib/diligence-schema.server.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git commit -m "Format trusted diligence release"
          git push

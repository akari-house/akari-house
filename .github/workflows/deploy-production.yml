name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: akari-production-deploy
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.credentials.outputs.configured }}
    steps:
      - id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PUBLIC_WORKER_URL: https://akari-house.spacematesxyz.workers.dev
      PRODUCTION_URL: https://akarihouse.com
      EXPECTED_RELEASE: launch-completion-2026-07-26
      OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Generate production Wrangler input configuration
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > d1-databases.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const payload = JSON.parse(fs.readFileSync("d1-databases.json", "utf8"));
          const databases = Array.isArray(payload)
            ? payload
            : Array.isArray(payload.result)
              ? payload.result
              : [];
          const database = databases.find(
            (entry) =>
              entry.name === "akari-house-db" ||
              entry.database_name === "akari-house-db",
          );
          const databaseId =
            database?.uuid ?? database?.database_id ?? database?.id;
          if (!databaseId) {
            throw new Error(
              "Cloudflare account does not contain a D1 database named akari-house-db.",
            );
          }

          const config = {
            name: "akari-house",
            main: "./worker/index.ts",
            compatibility_date: "2026-07-23",
            compatibility_flags: [
              "nodejs_compat",
              "global_fetch_strictly_public",
            ],
            observability: {
              enabled: true,
              head_sampling_rate: 1,
            },
            upload_source_maps: true,
            triggers: {
              crons: ["0 3 * * *", "*/5 * * * *"],
            },
            vars: {
              APP_ENV: "production",
              APP_URL: "https://akarihouse.com",
              TURNSTILE_HOSTNAME: "akarihouse.com",
            },
            d1_databases: [
              {
                binding: "DB",
                database_name: "akari-house-db",
                database_id: databaseId,
                migrations_dir: "migrations",
              },
            ],
            r2_buckets: [
              {
                binding: "MEDIA",
                bucket_name: "akari-house-media",
              },
            ],
          };
          fs.writeFileSync(
            "wrangler.production.jsonc",
            `${JSON.stringify(config, null, 2)}\n`,
          );
          fs.appendFileSync(
            process.env.GITHUB_ENV,
            `PRODUCTION_DB_ID=${databaseId}\n`,
          );
          NODE
          rm -f d1-databases.json
      - name: Build production Worker and assets
        env:
          CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH: wrangler.production.jsonc
        run: npm run build
      - name: Verify generated deployment configuration and bindings
        run: |
          set -euo pipefail
          test -f .wrangler/deploy/config.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";

          const redirectPath = path.resolve(".wrangler/deploy/config.json");
          const redirect = JSON.parse(fs.readFileSync(redirectPath, "utf8"));
          if (!redirect.configPath)
            throw new Error("Generated deployment redirect has no configPath.");

          const generatedPath = path.resolve(
            path.dirname(redirectPath),
            redirect.configPath,
          );
          const generated = JSON.parse(fs.readFileSync(generatedPath, "utf8"));
          const db = generated.d1_databases?.find(
            (binding) => binding.binding === "DB",
          );
          const media = generated.r2_buckets?.find(
            (binding) => binding.binding === "MEDIA",
          );

          if (generated.name !== "akari-house")
            throw new Error(`Generated Worker name is ${generated.name}.`);
          if (db?.database_id !== process.env.PRODUCTION_DB_ID)
            throw new Error(
              `Generated DB binding is ${db?.database_id ?? "missing"}, expected production D1.`,
            );
          if (media?.bucket_name !== "akari-house-media")
            throw new Error(
              `Generated MEDIA binding is ${media?.bucket_name ?? "missing"}.`,
            );
          if (generated.vars?.APP_ENV !== "production")
            throw new Error("Generated Worker is not in production mode.");
          if (generated.vars?.APP_URL !== "https://akarihouse.com")
            throw new Error("Generated Worker has the wrong APP_URL.");

          console.log(
            `Generated deployment is production-safe: ${generated.name}, DB ${db.database_id}, R2 ${media.bucket_name}.`,
          );
          NODE
      - name: Apply production migrations
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.production.jsonc
      - name: Deploy production Worker from generated production configuration
        run: |
          set +e
          npx wrangler deploy --keep-vars 2>&1 | tee production-deploy.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -n 80 production-deploy.log > production-deploy-error.log
            exit "$status"
          fi
      - name: Upload deployment diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-deploy-diagnostic-${{ github.sha }}
          path: production-deploy-error.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Confirm public Workers release
        run: |
          for attempt in $(seq 1 18); do
            response=$(curl -fsS --max-time 20 "${PUBLIC_WORKER_URL}/health" || true)
            if echo "$response" | grep -q '"release":"launch-completion-2026-07-26"'; then
              echo "$response"
              exit 0
            fi
            sleep 10
          done
          echo "The Worker deployment did not return the expected public release."
          exit 1
      - name: Create short-lived authenticated production smoke session
        run: |
          set -euo pipefail
          npx wrangler d1 execute DB --remote --config wrangler.production.jsonc --json --command \
            "SELECT id FROM users WHERE lower(email) = lower('${OWNER_EMAIL}')" > owner-account.json
          node --input-type=module <<'NODE'
          import crypto from "node:crypto";
          import fs from "node:fs";

          const payload = JSON.parse(fs.readFileSync("owner-account.json", "utf8"));
          const containers = Array.isArray(payload) ? payload : [payload];
          const row = containers.flatMap(
            (entry) => entry.results ?? entry.result?.results ?? [],
          )[0];
          if (!row?.id) throw new Error("Canonical owner account was not found.");

          const token = crypto.randomBytes(48).toString("hex");
          const tokenHash = crypto
            .createHash("sha256")
            .update(token)
            .digest("base64");
          const sessionId = crypto.randomUUID();
          const quote = (value) =>
            `'${String(value).replaceAll("'", "''")}'`;

          fs.writeFileSync("production-smoke-token.txt", token);
          fs.writeFileSync("production-smoke-session-id.txt", sessionId);
          fs.writeFileSync(
            "production-smoke-session.sql",
            `INSERT INTO sessions (id, user_id, token_hash, expires_at) VALUES (${quote(sessionId)}, ${quote(row.id)}, ${quote(tokenHash)}, datetime('now', '+15 minutes'));\n`,
          );
          NODE
          rm -f owner-account.json
          npx wrangler d1 execute DB --remote --config wrangler.production.jsonc --file production-smoke-session.sql >/dev/null
          rm -f production-smoke-session.sql
      - name: Prove member dashboard and Superadmin access on the custom domain
        run: |
          set -euo pipefail
          token=$(cat production-smoke-token.txt)
          for route in app admin/launch-gate admin/operations; do
            key=$(echo "$route" | tr '/' '-')
            status=$(curl -sS --max-time 30 \
              -D "${key}.headers" \
              -o "${key}.html" \
              -w '%{http_code}' \
              -H "Cookie: akari_session=${token}" \
              "${PRODUCTION_URL}/${route}")
            if [ "$status" != "200" ]; then
              echo "Authenticated /${route} returned HTTP ${status}."
              sed -n '1,30p' "${key}.headers"
              exit 1
            fi
            if grep -qi 'the lantern went out unexpectedly' "${key}.html"; then
              echo "Authenticated /${route} rendered the generic AKARI error boundary."
              exit 1
            fi
            if grep -q 'name="password"' "${key}.html"; then
              echo "Authenticated /${route} rendered the login form."
              exit 1
            fi
            if ! grep -qi 'akari' "${key}.html"; then
              echo "Authenticated /${route} did not render the AKARI product."
              exit 1
            fi
          done
          echo "Authenticated production dashboard and Superadmin routes passed."
          rm -f -- *.headers *.html production-smoke-token.txt
      - name: Remove short-lived authenticated smoke session
        if: always()
        run: |
          set +e
          if [ -f production-smoke-session-id.txt ] && [ -f wrangler.production.jsonc ]; then
            session_id=$(sed "s/'/''/g" production-smoke-session-id.txt)
            npx wrangler d1 execute DB --remote --config wrangler.production.jsonc --command \
              "DELETE FROM sessions WHERE id = '${session_id}'" >/dev/null
          fi
          rm -f production-smoke-session-id.txt production-smoke-token.txt
      - name: Run public production audit
        run: node scripts/production-public-audit.mjs
      - name: Persist production audit in D1
        run: |
          node --input-type=module <<'NODE'
          import { randomUUID } from "node:crypto";
          import fs from "node:fs";

          const report = JSON.parse(fs.readFileSync("production-audit.json", "utf8"));
          const sqlValue = (value) =>
            value == null ? "NULL" : `'${String(value).replaceAll("'", "''")}'`;
          const sql = `INSERT INTO production_audit_runs
            (id, commit_sha, environment, status, checks_json, workflow_url, completed_at)
            VALUES (
              ${sqlValue(randomUUID())},
              ${sqlValue(report.commitSha)},
              ${sqlValue(report.environment)},
              ${sqlValue(report.status)},
              ${sqlValue(JSON.stringify(report.checks))},
              ${sqlValue(report.workflowUrl)},
              ${sqlValue(report.completedAt)}
            );\n`;
          fs.writeFileSync("production-audit.sql", sql);
          NODE
          npx wrangler d1 execute DB --remote --config wrangler.production.jsonc --file production-audit.sql
      - name: Upload public production audit
        uses: actions/upload-artifact@v4
        with:
          name: production-public-audit-${{ github.sha }}
          path: production-audit.json
          retention-days: 90
      - name: Enforce public production audit
        run: |
          node -e 'const fs=require("fs"); const report=JSON.parse(fs.readFileSync("production-audit.json","utf8")); if(report.status!=="passed") { console.error(JSON.stringify(report,null,2)); process.exit(1); }'
      - name: Record successful public deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 31 --repo "$GITHUB_REPOSITORY" --body "✅ Public deployment, authenticated Superadmin smoke and custom-domain audit succeeded for commit \`${GITHUB_SHA}\`. Live product: ${PRODUCTION_URL}. Audit evidence was persisted in D1 and uploaded as a 90-day workflow artifact."
      - name: Record deployment failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          diagnostic_path = Path("production-deploy-error.log")
          audit_path = Path("production-audit.json")
          if diagnostic_path.exists():
              diagnostic = diagnostic_path.read_text()
          elif audit_path.exists():
              diagnostic = audit_path.read_text()
          else:
              diagnostic = "No deployment diagnostic was produced."
          for key in ("CLOUDFLARE_API_TOKEN", "CLOUDFLARE_ACCOUNT_ID"):
              value = os.environ.get(key, "")
              if value:
                  diagnostic = diagnostic.replace(value, f"[REDACTED_{key}]")
          diagnostic = "\n".join(diagnostic.splitlines()[-60:])
          body = (
              f"Deployment commit: `{os.environ['GITHUB_SHA']}`\n\n"
              f"Workflow: https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}\n\n"
              "Sanitised production diagnostic:\n\n```text\n"
              f"{diagnostic}\n```\n"
          )
          Path("deployment-failure-comment.md").write_text(body)
          PY
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Production deploy diagnostic ${GITHUB_SHA:0:7}" --body-file deployment-failure-comment.md

  missing-cloudflare-credentials:
    needs: preflight
    if: needs.preflight.outputs.configured != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Record missing Cloudflare credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 31 --repo "$GITHUB_REPOSITORY" --body "⚠️ Production deployment was not started for commit \`${GITHUB_SHA}\` because repository secrets \`CLOUDFLARE_API_TOKEN\` and \`CLOUDFLARE_ACCOUNT_ID\` are not configured. Add both under Settings → Secrets and variables → Actions; the next main push or manual workflow run will deploy publicly."

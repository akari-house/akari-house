name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: akari-production-deploy
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.credentials.outputs.configured }}
    steps:
      - id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PUBLIC_WORKER_URL: https://akari-house.spacematesxyz.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Generate production Wrangler configuration
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > d1-databases.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const payload = JSON.parse(fs.readFileSync("d1-databases.json", "utf8"));
          const databases = Array.isArray(payload)
            ? payload
            : Array.isArray(payload.result)
              ? payload.result
              : [];
          const database = databases.find(
            (entry) =>
              entry.name === "akari-house-db" ||
              entry.database_name === "akari-house-db",
          );
          const databaseId =
            database?.uuid ?? database?.database_id ?? database?.id;
          if (!databaseId) {
            throw new Error(
              "Cloudflare account does not contain a D1 database named akari-house-db.",
            );
          }

          const config = {
            name: "akari-house",
            main: "./worker/index.ts",
            compatibility_date: "2026-07-23",
            compatibility_flags: [
              "nodejs_compat",
              "global_fetch_strictly_public",
            ],
            observability: {
              enabled: true,
              head_sampling_rate: 1,
            },
            upload_source_maps: true,
            triggers: {
              crons: ["0 3 * * *", "*/5 * * * *"],
            },
            vars: {
              APP_ENV: "production",
              APP_URL: "https://akarihouse.com",
              TURNSTILE_HOSTNAME: "akarihouse.com",
            },
            d1_databases: [
              {
                binding: "DB",
                database_name: "akari-house-db",
                database_id: databaseId,
                migrations_dir: "migrations",
              },
            ],
            r2_buckets: [
              {
                binding: "MEDIA",
                bucket_name: "akari-house-media",
              },
            ],
          };
          fs.writeFileSync(
            "wrangler.deploy.jsonc",
            `${JSON.stringify(config, null, 2)}\n`,
          );
          NODE
          rm -f d1-databases.json
      - name: Apply production migrations
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.deploy.jsonc
      - name: Deploy production Worker
        run: |
          set +e
          npx wrangler deploy --keep-vars --config wrangler.deploy.jsonc 2>&1 | tee production-deploy.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -n 80 production-deploy.log > production-deploy-error.log
            exit "$status"
          fi
      - name: Upload deployment diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-deploy-diagnostic-${{ github.sha }}
          path: production-deploy-error.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Confirm public Workers release
        run: |
          for attempt in $(seq 1 18); do
            response=$(curl -fsS --max-time 20 "${PUBLIC_WORKER_URL}/health" || true)
            if echo "$response" | grep -q '"release":"launch-completion-2026-07-26"'; then
              echo "$response"
              exit 0
            fi
            sleep 10
          done
          echo "The Worker deployment did not return the expected public release."
          exit 1
      - name: Check custom domain
        run: |
          if response=$(curl -fsS --max-time 20 https://akarihouse.com/health); then
            echo "$response"
          else
            echo "::warning::The Worker is public, but akarihouse.com still requires DNS/custom-domain cutover."
          fi
      - name: Record successful public deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 31 --repo "$GITHUB_REPOSITORY" --body "✅ Public deployment succeeded for commit \`${GITHUB_SHA}\`. Live Worker: ${PUBLIC_WORKER_URL} — the custom domain check runs separately and may still require DNS cutover."
      - name: Record deployment failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          diagnostic_path = Path("production-deploy-error.log")
          diagnostic = diagnostic_path.read_text() if diagnostic_path.exists() else "No deployment diagnostic was produced."
          for key in ("CLOUDFLARE_API_TOKEN", "CLOUDFLARE_ACCOUNT_ID"):
              value = os.environ.get(key, "")
              if value:
                  diagnostic = diagnostic.replace(value, f"[REDACTED_{key}]")
          diagnostic = "\n".join(diagnostic.splitlines()[-40:])
          body = (
              f"Deployment commit: `{os.environ['GITHUB_SHA']}`\n\n"
              f"Workflow: https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}\n\n"
              "Sanitised Cloudflare diagnostic:\n\n```text\n"
              f"{diagnostic}\n```\n"
          )
          Path("deployment-failure-comment.md").write_text(body)
          PY
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Production deploy diagnostic ${GITHUB_SHA:0:7}" --body-file deployment-failure-comment.md

  missing-cloudflare-credentials:
    needs: preflight
    if: needs.preflight.outputs.configured != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Record missing Cloudflare credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 31 --repo "$GITHUB_REPOSITORY" --body "⚠️ Production deployment was not started for commit \`${GITHUB_SHA}\` because repository secrets \`CLOUDFLARE_API_TOKEN\` and \`CLOUDFLARE_ACCOUNT_ID\` are not configured. Add both under Settings → Secrets and variables → Actions; the next main push or manual workflow run will deploy publicly."

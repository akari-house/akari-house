name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: akari-production-deploy
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.credentials.outputs.configured }}
    steps:
      - id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PUBLIC_WORKER_URL: https://akari-house.spacematesxyz.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Resolve production D1 binding
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > d1-databases.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const payload = JSON.parse(fs.readFileSync("d1-databases.json", "utf8"));
          const databases = Array.isArray(payload)
            ? payload
            : Array.isArray(payload.result)
              ? payload.result
              : [];
          const database = databases.find(
            (entry) =>
              entry.name === "akari-house-db" ||
              entry.database_name === "akari-house-db",
          );
          const databaseId =
            database?.uuid ?? database?.database_id ?? database?.id;
          if (!databaseId) {
            throw new Error(
              "Cloudflare account does not contain a D1 database named akari-house-db.",
            );
          }

          let config = fs.readFileSync("wrangler.jsonc", "utf8");
          const databaseName = /"database_name"\s*:\s*"akari-house-db"\s*,/;
          if (!databaseName.test(config)) {
            throw new Error("wrangler.jsonc is missing the AKARI D1 binding.");
          }
          config = config.replace(
            databaseName,
            `"database_name": "akari-house-db",\n      "database_id": "${databaseId}",`,
          );
          fs.writeFileSync("wrangler.deploy.jsonc", config);
          NODE
          rm -f d1-databases.json
      - name: Apply production migrations
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.deploy.jsonc
      - name: Deploy production Worker
        run: npx wrangler deploy --keep-vars --config wrangler.deploy.jsonc
      - name: Confirm public Workers release
        run: |
          for attempt in $(seq 1 18); do
            response=$(curl -fsS --max-time 20 "${PUBLIC_WORKER_URL}/health" || true)
            if echo "$response" | grep -q '"release":"launch-completion-2026-07-26"'; then
              echo "$response"
              exit 0
            fi
            sleep 10
          done
          echo "The Worker deployment did not return the expected public release."
          exit 1
      - name: Check custom domain
        run: |
          if response=$(curl -fsS --max-time 20 https://akarihouse.com/health); then
            echo "$response"
          else
            echo "::warning::The Worker is public, but akarihouse.com still requires DNS/custom-domain cutover."
          fi
      - name: Record successful public deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 31 --repo "$GITHUB_REPOSITORY" --body "✅ Public deployment succeeded for commit \`${GITHUB_SHA}\`. Live Worker: ${PUBLIC_WORKER_URL} — the custom domain check runs separately and may still require DNS cutover."
      - name: Record deployment failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 31 --repo "$GITHUB_REPOSITORY" --body "❌ Public deployment failed for commit \`${GITHUB_SHA}\`. Review: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  missing-cloudflare-credentials:
    needs: preflight
    if: needs.preflight.outputs.configured != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Record missing Cloudflare credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 31 --repo "$GITHUB_REPOSITORY" --body "⚠️ Production deployment was not started for commit \`${GITHUB_SHA}\` because repository secrets \`CLOUDFLARE_API_TOKEN\` and \`CLOUDFLARE_ACCOUNT_ID\` are not configured. Add both under Settings → Secrets and variables → Actions; the next main push or manual workflow run will deploy publicly."

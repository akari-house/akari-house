name: Recovery Lint Diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/recovery-lint-diagnostic.yml"

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Capture exact lint diagnostics
        run: |
          mkdir -p docs
          npx eslint \
            scripts/recovery/backup-crypto.mjs \
            scripts/recovery/validate-restore.mjs \
            tests/unit/recovery-backup.test.ts \
            > docs/recovery-lint.txt 2>&1 || true
          if [ ! -s docs/recovery-lint.txt ]; then
            echo "No targeted lint diagnostics." > docs/recovery-lint.txt
          fi
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/recovery-lint.txt
          git commit -m "Capture recovery lint diagnostics"
          git push

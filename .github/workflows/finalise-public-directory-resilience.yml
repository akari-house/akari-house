name: Finalise Public Directory Resilience

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalise:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply Deals compatibility probe
        run: python scripts/patch-deals-directory-probe.py
      - name: Format public directory repair
        run: |
          npx prettier --write \
            app/routes/projects.tsx \
            app/routes/deals.tsx \
            app/routes/campaigns.tsx \
            app/routes/events.tsx \
            tests/public-directory-resilience.test.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: Commit validated directory repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/routes/projects.tsx app/routes/deals.tsx app/routes/campaigns.tsx app/routes/events.tsx tests/public-directory-resilience.test.ts
          git commit -m "Keep public directories available during schema drift"
          git push

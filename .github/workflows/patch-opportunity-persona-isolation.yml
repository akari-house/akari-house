name: Finalise Curated Opportunities

on:
  push:
    branches: [agent/curated-opportunities-foundation]

permissions:
  contents: write

jobs:
  finalise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/curated-opportunities-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Merge production main and isolate opportunity fixtures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge origin/main --no-commit --no-ff
          merge_status=$?
          set -e

          conflicts="$(git diff --name-only --diff-filter=U)"
          for file in $conflicts; do
            case "$file" in
              app/components/PublicFooter.tsx|app/root.tsx)
                git checkout --theirs -- "$file"
                ;;
              *)
                echo "Unexpected merge conflict: $file"
                exit 1
                ;;
            esac
          done

          python - <<'PY'
          from pathlib import Path

          root = Path("app/root.tsx")
          value = root.read_text()
          if 'import "./styles/opportunities.css";' not in value:
              needle = 'import "./styles/footer.css";'
              if needle not in value:
                  raise SystemExit("footer stylesheet import not found")
              value = value.replace(
                  needle,
                  needle + '\nimport "./styles/opportunities.css";',
                  1,
              )
          root.write_text(value)

          footer = Path("app/components/PublicFooter.tsx")
          value = footer.read_text()
          if '{ label: "Investor deals", to: "/deals" }' not in value:
              needle = '      { label: "Projects", to: "/projects" },'
              if needle not in value:
                  raise SystemExit("footer Projects destination not found")
              value = value.replace(
                  needle,
                  needle + '\n      { label: "Investor deals", to: "/deals" },',
                  1,
              )
          footer.write_text(value)

          persona = Path("app/routes/test-persona.ts")
          value = persona.read_text()
          if "opp_owner:" not in value:
              needle = '  creator: { status: "active", roles: ["creator"], membership: "approved" },'
              if needle not in value:
                  raise SystemExit("creator persona insertion point not found")
              block = '''  opp_owner: {
            status: "active",
            roles: ["founder"],
            membership: "approved",
          },
          opp_founder: {
            status: "active",
            roles: ["founder"],
            membership: "approved",
          },
          opp_creator: {
            status: "active",
            roles: ["creator"],
            membership: "approved",
          },
          opp_investor: {
            status: "active",
            roles: ["investor"],
            membership: "approved",
          },
          opp_granted: {
            status: "active",
            roles: ["investor"],
            membership: "approved",
          },
          opp_expired: {
            status: "active",
            roles: ["investor"],
            membership: "approved",
          },
          opp_suspended: {
            status: "suspended",
            roles: ["founder"],
            membership: "approved",
          },
          opp_private_target: {
            status: "active",
            roles: ["founder"],
            membership: "approved",
            privateProfile: true,
          },
          opp_scoped_admin: {
            status: "active",
            roles: [],
            membership: "approved",
            admin: "membership",
          },
          opp_superadmin: {
            status: "active",
            roles: [],
            membership: "approved",
            admin: "superadmin",
          },
          '''
              value = value.replace(needle, block + needle, 1)
          persona.write_text(value)

          fixture = Path("app/routes/test-opportunities.ts")
          value = fixture.read_text()
          replacements = {
              'fixtureUser(env.DB, "project_owner")': 'fixtureUser(env.DB, "opp_owner")',
              'fixtureUser(env.DB, "creator")': 'fixtureUser(env.DB, "opp_creator")',
              'fixtureUser(env.DB, "investor")': 'fixtureUser(env.DB, "opp_investor")',
              'fixtureUser(env.DB, "investor_granted")': 'fixtureUser(env.DB, "opp_granted")',
              'fixtureUser(env.DB, "investor_expired")': 'fixtureUser(env.DB, "opp_expired")',
              'fixtureUser(env.DB, "suspended")': 'fixtureUser(env.DB, "opp_suspended")',
              'fixtureUser(env.DB, "private_target")': 'fixtureUser(env.DB, "opp_private_target")',
          }
          for old, new in replacements.items():
              value = value.replace(old, new)
          fixture.write_text(value)

          persona_replacements = {
              '"project_owner"': '"opp_owner"',
              '"creator"': '"opp_creator"',
              '"investor"': '"opp_investor"',
              '"investor_granted"': '"opp_granted"',
              '"investor_expired"': '"opp_expired"',
              '"suspended"': '"opp_suspended"',
              '"private_target"': '"opp_private_target"',
              '"founder"': '"opp_founder"',
              '"scoped_admin"': '"opp_scoped_admin"',
              '"superadmin"': '"opp_superadmin"',
          }
          for filename in [
              "tests/e2e/curated-opportunities.spec.ts",
              "tests/e2e/opportunity-document-review.spec.ts",
          ]:
              path = Path(filename)
              value = path.read_text()
              for old, new in persona_replacements.items():
                  value = value.replace(old, new)
              path.write_text(value)
          PY

          rm -f .github/workflows/full-browser-diagnostic.yml
          rm -f .github/workflows/patch-opportunity-persona-isolation.yml

          npx prettier --write \
            app/components/PublicFooter.tsx \
            app/root.tsx \
            app/routes/test-persona.ts \
            app/routes/test-opportunities.ts \
            tests/e2e/curated-opportunities.spec.ts \
            tests/e2e/opportunity-document-review.spec.ts

          git add -A
          if git diff --cached --quiet; then
            echo "No finalisation changes were required."
            exit 0
          fi
          git commit -m "Merge main and isolate opportunity test personas"
          git push

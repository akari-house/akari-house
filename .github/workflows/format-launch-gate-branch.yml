name: Format launch-gate branch

on:
  push:
    branches:
      - agent/launch-gate-ownership-evidence
    paths:
      - app/routes/test-persona.ts
      - .github/workflows/format-launch-gate-branch.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/launch-gate-ownership-evidence
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write app/routes/test-persona.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "File already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/routes/test-persona.ts
          git commit -m "Format idempotent launch-gate fixtures"
          git push origin HEAD:agent/launch-gate-ownership-evidence

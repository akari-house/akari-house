name: Apply Project Need Status Integration

on:
  push:
    branches:
      - feature/project-need-status

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/project-need-status
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply integration
        run: node scripts/apply-project-need-status.mjs
      - name: Format changed files
        run: >-
          npx prettier --write
          app/lib/project-need-status.ts
          app/components/projects/ProjectNeedChips.tsx
          app/components/discovery/ProjectLanternCard.tsx
          app/routes/projects.tsx
          app/routes/project-needs.tsx
          app/routes/project-detail.tsx
          app/routes/deals.tsx
          app/routes/deal-room.tsx
          app/styles/app.css
          migrations/0110_project_need_status.sql
      - name: Commit generated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app migrations
          git commit -m "Integrate project support status" || exit 0
          git push origin HEAD:feature/project-need-status
